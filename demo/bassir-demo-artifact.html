<title>بصير - عيون المالك | ديمو تفاعلي</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* بصير - عيون المالك | التصميم الأساسي (RTL - داكن) */
:root {
  --bg: #0b0e14;
  --bg2: #0f131c;
  --panel: #131926;
  --panel2: #182032;
  --border: #222c40;
  --accent: #e0a458;
  --accent2: #f2c078;
  --text: #e9ecf3;
  --muted: #8b95a8;
  --ok: #2dd4a0;
  --warn: #f2c94c;
  --danger: #ef5d75;
  --info: #4cc9f0;
  --radius: 14px;
  --shadow: 0 10px 30px rgba(0, 0, 0, .35);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", Tahoma, "Noto Kufi Arabic", "Cairo", Arial, sans-serif;
  font-size: 15px;
}

body { direction: rtl; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #2a3550; border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }

/* ============ شاشة الدخول ============ */
.login-wrap {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(900px 500px at 80% -10%, rgba(224, 164, 88, .12), transparent 60%),
    radial-gradient(700px 500px at 10% 110%, rgba(76, 201, 240, .08), transparent 60%),
    var(--bg);
  padding: 24px;
}

.login-card {
  width: 420px; max-width: 100%;
  background: linear-gradient(180deg, var(--panel2), var(--panel));
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 36px 32px;
  box-shadow: var(--shadow);
}

.login-logo { text-align: center; margin-bottom: 8px; font-size: 44px; }
.login-title { text-align: center; font-size: 26px; font-weight: 800; letter-spacing: .5px; }
.login-title small { display: block; color: var(--accent); font-size: 13px; font-weight: 600; margin-top: 6px; letter-spacing: 2px; }
.login-sub { text-align: center; color: var(--muted); font-size: 13px; margin: 10px 0 26px; line-height: 1.8; }

.demo-accounts { margin-top: 22px; border-top: 1px dashed var(--border); padding-top: 16px; }
.demo-accounts h4 { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.demo-chip {
  display: inline-block; margin: 3px; padding: 6px 12px;
  background: var(--bg2); border: 1px solid var(--border); border-radius: 999px;
  font-size: 12px; cursor: pointer; color: var(--text); transition: .15s;
}
.demo-chip:hover { border-color: var(--accent); color: var(--accent2); }

/* ============ الهيكل العام ============ */
.app { display: flex; min-height: 100vh; }

.sidebar {
  width: 258px; flex-shrink: 0;
  background: linear-gradient(180deg, #101522, #0d111b);
  border-left: 1px solid var(--border);
  padding: 20px 14px;
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}

.brand { display: flex; align-items: center; gap: 12px; padding: 6px 10px 20px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
.brand .eye { font-size: 30px; filter: drop-shadow(0 0 12px rgba(224, 164, 88, .6)); }
.brand b { font-size: 19px; display: block; }
.brand small { color: var(--accent); font-size: 10.5px; letter-spacing: 1.5px; }

.nav-sec { font-size: 10.5px; color: var(--muted); margin: 14px 10px 6px; letter-spacing: 1px; }

.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 10px; cursor: pointer;
  color: #c6cdda; font-size: 14px; margin-bottom: 2px;
  border: 1px solid transparent; transition: .15s;
}
.nav-item:hover { background: rgba(224, 164, 88, .07); color: var(--text); }
.nav-item.active {
  background: linear-gradient(90deg, rgba(224, 164, 88, .16), rgba(224, 164, 88, .04));
  border-color: rgba(224, 164, 88, .35); color: var(--accent2); font-weight: 700;
}
.nav-item .ico { width: 22px; text-align: center; }
.nav-item .badge { margin-right: auto; background: var(--danger); color: #fff; border-radius: 999px; font-size: 11px; padding: 1px 8px; }

.side-user { margin-top: auto; border-top: 1px solid var(--border); padding-top: 14px; }
.side-user .who { font-size: 13px; font-weight: 700; }
.side-user .role { font-size: 11.5px; color: var(--accent); margin: 3px 0 10px; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 18px 28px; border-bottom: 1px solid var(--border);
  background: rgba(15, 19, 28, .8); backdrop-filter: blur(8px);
  position: sticky; top: 0; z-index: 20;
}
.topbar h1 { font-size: 20px; font-weight: 800; }
.topbar .proj { color: var(--muted); font-size: 13px; }
.topbar .spacer { flex: 1; }

.content { padding: 26px 28px 60px; }

/* ============ مكونات ============ */
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, 1fr); }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, 1fr); } .g3 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 760px) { .g2, .g3, .g4 { grid-template-columns: 1fr; } .sidebar { display: none; } }

.card {
  background: linear-gradient(180deg, var(--panel2), var(--panel));
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px; box-shadow: 0 4px 18px rgba(0, 0, 0, .22);
}
.card h3 { font-size: 15px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.card h3 .hint { font-size: 11.5px; color: var(--muted); font-weight: 400; margin-right: auto; }

.kpi { position: relative; overflow: hidden; }
.kpi .lbl { color: var(--muted); font-size: 12.5px; }
.kpi .val { font-size: 26px; font-weight: 800; margin: 8px 0 4px; }
.kpi .sub { font-size: 12px; color: var(--muted); }
.kpi .trend-up { color: var(--ok); } .kpi .trend-down { color: var(--danger); }
.kpi::after {
  content: ''; position: absolute; inset-inline-start: 0; top: 0; bottom: 0; width: 4px;
  background: var(--accent); opacity: .8; border-radius: 0 4px 4px 0;
}
.kpi.k-ok::after { background: var(--ok); } .kpi.k-warn::after { background: var(--warn); }
.kpi.k-danger::after { background: var(--danger); } .kpi.k-info::after { background: var(--info); }

table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: right; color: var(--muted); font-size: 12px; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { padding: 11px 12px; border-bottom: 1px solid rgba(34, 44, 64, .55); vertical-align: middle; }
.tbl tr:hover td { background: rgba(224, 164, 88, .04); }
.tbl-wrap { overflow-x: auto; }

.pill { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
.pill.p-ok { background: rgba(45, 212, 160, .14); color: var(--ok); }
.pill.p-warn { background: rgba(242, 201, 76, .14); color: var(--warn); }
.pill.p-danger { background: rgba(239, 93, 117, .14); color: var(--danger); }
.pill.p-info { background: rgba(76, 201, 240, .14); color: var(--info); }
.pill.p-muted { background: rgba(139, 149, 168, .14); color: var(--muted); }

.bar { height: 8px; background: #1a2234; border-radius: 99px; overflow: hidden; min-width: 90px; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
.bar.b-ok > i { background: linear-gradient(90deg, #1fae85, var(--ok)); }
.bar.b-danger > i { background: linear-gradient(90deg, #d4405c, var(--danger)); }

.btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: linear-gradient(180deg, var(--accent2), var(--accent));
  color: #201505; font-weight: 800; font-size: 13.5px;
  border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer;
  transition: .15s; font-family: inherit;
}
.btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
.btn.sm { padding: 6px 12px; font-size: 12px; border-radius: 8px; }
.btn.ghost { background: transparent; color: var(--accent2); border: 1px solid rgba(224, 164, 88, .5); }
.btn.ok { background: linear-gradient(180deg, #35e0ac, #1fae85); color: #04241a; }
.btn.danger { background: linear-gradient(180deg, #f27085, #d4405c); color: #2b0710; }
.btn.mutedb { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
.btn.block { width: 100%; justify-content: center; }

input.inp, select.inp, textarea.inp {
  width: 100%; background: var(--bg2); color: var(--text);
  border: 1px solid var(--border); border-radius: 10px;
  padding: 11px 14px; font-size: 14px; font-family: inherit; outline: none; transition: .15s;
}
.inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(224, 164, 88, .15); }
label.fl { display: block; font-size: 12.5px; color: var(--muted); margin: 12px 0 6px; }
textarea.inp { resize: vertical; min-height: 80px; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
.tab {
  padding: 8px 16px; border-radius: 999px; cursor: pointer; font-size: 13px;
  background: var(--panel); border: 1px solid var(--border); color: #c6cdda; transition: .15s;
}
.tab:hover { border-color: var(--accent); }
.tab.active { background: rgba(224, 164, 88, .15); border-color: var(--accent); color: var(--accent2); font-weight: 700; }
.tab .n { background: var(--danger); color: #fff; border-radius: 99px; padding: 0 7px; font-size: 11px; margin-right: 6px; }

/* ============ رؤية المشروع (المخططات) ============ */
.disc-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.disc-chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 14px; border-radius: 12px; cursor: pointer; font-size: 12.5px;
  background: var(--panel); border: 1px solid var(--border); transition: .15s;
}
.disc-chip:hover { transform: translateY(-1px); }
.disc-chip.active { border-color: var(--disc-color, var(--accent)); background: color-mix(in srgb, var(--disc-color, var(--accent)) 14%, transparent); font-weight: 700; }
.disc-chip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--disc-color, var(--accent)); }

.floor-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }

.plan-stage { background: #0a0d13; border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; position: relative; }
.plan-stage svg { width: 100%; height: auto; display: block; }

.legend { display: flex; gap: 18px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
.legend .sw { display: inline-block; width: 26px; height: 12px; border-radius: 4px; vertical-align: middle; margin-left: 6px; }

.zone-panel { max-height: 560px; overflow-y: auto; }

/* مناطق المخطط */
.zone-shape { cursor: pointer; transition: filter .2s; }
.zone-shape:hover { filter: brightness(1.35); }

/* ============ BIM ============ */
.bim-stage { background: radial-gradient(600px 400px at 50% 20%, #131a2a, #0a0d13); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.bim-floor { cursor: pointer; transition: .2s; }
.bim-floor:hover { filter: brightness(1.3); }

/* ============ AI ============ */
.ai-item { display: flex; gap: 14px; padding: 14px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; background: var(--bg2); }
.ai-item .ai-ico { font-size: 22px; }
.ai-item.sev-warn { border-color: rgba(242, 201, 76, .4); }
.ai-item.sev-alert { border-color: rgba(239, 93, 117, .5); background: rgba(239, 93, 117, .05); }
.ai-item p { font-size: 13.5px; line-height: 1.9; }
.ai-item .meta { font-size: 11.5px; color: var(--muted); margin-top: 6px; }

.photo-card { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--bg2); }
.photo-card .ph { height: 130px; display: flex; align-items: center; justify-content: center; font-size: 40px; background: linear-gradient(135deg, #182032, #10151f); border-bottom: 1px solid var(--border); position: relative; }
.photo-card .ph .scan { position: absolute; inset: 0; background: linear-gradient(180deg, transparent, rgba(76, 201, 240, .12), transparent); animation: scan 3s infinite; }
@keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
.photo-card .info { padding: 12px; font-size: 12.5px; }
.photo-card .aiTag { font-size: 11px; color: var(--info); margin-top: 6px; line-height: 1.7; }

/* ============ كاميرات الموقع ============ */
.cam-feed {
  position: relative; height: 230px; overflow: hidden;
  background:
    radial-gradient(500px 200px at 50% 100%, rgba(224, 164, 88, .07), transparent),
    linear-gradient(180deg, #0c111c 0%, #10182a 55%, #0b0f18 100%);
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
}
.cam-feed.cam-off { background: repeating-linear-gradient(0deg, #0b0e14, #0b0e14 3px, #10141d 3px, #10141d 6px); }
.cam-scene { position: absolute; inset: 0; }
.cam-scene span { position: absolute; }
.cam-bld { font-size: 84px; bottom: 6px; inset-inline-start: 50%; transform: translateX(50%); opacity: .8; }
.cam-crane { font-size: 56px; bottom: 60px; inset-inline-start: 22%; animation: sway 6s ease-in-out infinite; transform-origin: bottom; opacity: .85; }
.cam-wrk { font-size: 22px; bottom: 10px; inset-inline-start: 68%; animation: walk 9s linear infinite; }
@keyframes sway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
@keyframes walk { 0% { inset-inline-start: 72%; } 50% { inset-inline-start: 30%; } 100% { inset-inline-start: 72%; } }
.cam-osd {
  position: absolute; inset-inline: 0; bottom: 0; display: flex; justify-content: space-between;
  padding: 6px 12px; font-size: 10.5px; color: #9fe8c9;
  background: linear-gradient(0deg, rgba(5, 8, 14, .85), transparent);
  font-family: Consolas, monospace; direction: ltr;
}
.rec-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ff4d4d; animation: blink 1.2s infinite; vertical-align: middle; }
@keyframes blink { 0%, 60% { opacity: 1; } 61%, 100% { opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .cam-crane, .cam-wrk, .rec-dot, .photo-card .ph .scan { animation: none; } }

/* شريط أدوار عين المالك */
.eye-floor {
  flex: 1; min-width: 74px; text-align: center; padding: 12px 6px;
  border-radius: 10px; border: 1px solid #26314a; cursor: pointer; transition: .15s;
  display: flex; flex-direction: column; gap: 4px; font-size: 11px;
}
.eye-floor:hover { transform: translateY(-3px); filter: brightness(1.2); }
.eye-floor b { font-size: 15px; }

/* ============ عارض المخططات مع الترميز ============ */
.dv-wrap {
  width: min(1200px, 96vw); max-height: 94vh; overflow-y: auto;
  background: linear-gradient(180deg, var(--panel2), var(--panel));
  border: 1px solid var(--border); border-radius: 18px; padding: 18px 20px;
  box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px;
}
.dv-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.dv-tools {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px;
}
.dv-tool {
  background: var(--panel); border: 1px solid var(--border); color: var(--text);
  border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; font-family: inherit;
}
.dv-tool.active { border-color: var(--accent); color: var(--accent2); background: rgba(224, 164, 88, .12); font-weight: 700; }
.dv-color { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
.dv-color.active { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
.dv-stage-wrap { background: #0a0d13; border: 1px solid var(--border); border-radius: 12px; padding: 8px; overflow: auto; max-height: 58vh; }
.dv-stage { position: relative; display: inline-block; min-width: 100%; }
.dv-stage img { display: block; width: 100%; user-select: none; border-radius: 6px; }
.dv-stage canvas { position: absolute; inset: 0; touch-action: none; }
.dv-sheet {
  min-height: 480px; background:
    linear-gradient(#e9e5da 1px, transparent 1px), linear-gradient(90deg, #e9e5da 1px, transparent 1px),
    #f5f2ea;
  background-size: 28px 28px; border: 10px solid #fff; outline: 2px solid #c9c2b2;
  border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
}
.dv-sheet-title { color: #333; font-weight: 800; font-size: 20px; }
.dv-sheet-sub { color: #666; font-size: 13px; direction: ltr; }
.dv-sheet-note { color: #999; font-size: 11px; }
.dv-side { display: flex; flex-direction: column; gap: 10px; }
.dv-pins { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.dv-pin-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.dv-pin-n {
  min-width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  color: #10151f; font-weight: 800; font-size: 12px;
}
.dv-review { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.dv-body { display: grid; grid-template-columns: 1fr 330px; gap: 12px; align-items: start; }
@media (max-width: 980px) { .dv-body { grid-template-columns: 1fr; } }
.dv-stage #dv-pdf { position: static; display: block; background: #fff; border-radius: 6px; }
.dv-reply {
  background: rgba(45, 212, 160, .08); border: 1px solid rgba(45, 212, 160, .3);
  border-radius: 8px; padding: 6px 10px; margin: 6px 0 0 0; width: 100%; line-height: 1.8;
}
.dv-hist-row { border-bottom: 1px dashed rgba(34, 44, 64, .6); padding: 7px 0; }
.dv-hist-row:last-child { border-bottom: 0; }
.timeline { position: relative; padding-right: 18px; }
.timeline::before { content: ''; position: absolute; right: 5px; top: 4px; bottom: 4px; width: 2px; background: var(--border); }
.tl-item { position: relative; padding: 6px 0 10px; }
.tl-item::before {
  content: ''; position: absolute; right: -17px; top: 12px; width: 10px; height: 10px;
  border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(224, 164, 88, .2);
}

/* ============ جرس الإشعارات ============ */
.bell {
  position: relative; background: var(--bg2); border: 1px solid var(--border); color: var(--text);
  border-radius: 10px; padding: 7px 12px; font-size: 16px; cursor: pointer; font-family: inherit;
}
.bell:hover { border-color: var(--accent); }
.bell-n {
  position: absolute; top: -6px; inset-inline-start: -6px; background: var(--danger); color: #fff;
  border-radius: 99px; font-size: 10.5px; font-weight: 800; padding: 1px 6px; min-width: 18px;
}
.notif-pop {
  position: fixed; top: 64px; inset-inline-start: 18px; z-index: 95; width: min(420px, 92vw);
  background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--border);
  border-radius: 14px; box-shadow: var(--shadow); overflow: hidden;
}
.notif-list { max-height: 55vh; overflow-y: auto; }
.notif-row { padding: 11px 14px; border-bottom: 1px solid rgba(34, 44, 64, .5); }
.notif-row.new { background: rgba(224, 164, 88, .08); border-inline-start: 3px solid var(--accent); }
.notif-row:last-child { border-bottom: 0; }

/* ============ نوافذ ورسائل ============ */
.modal-back { position: fixed; inset: 0; background: rgba(5, 8, 14, .7); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
.modal { width: 560px; max-width: 100%; max-height: 88vh; overflow-y: auto; background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--border); border-radius: 18px; padding: 26px; box-shadow: var(--shadow); }
.modal h3 { margin-bottom: 6px; }
.modal .m-sub { color: var(--muted); font-size: 12.5px; margin-bottom: 14px; }
.m-actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }

.toast-wrap { position: fixed; bottom: 24px; right: 24px; z-index: 200; display: flex; flex-direction: column; gap: 10px; }
.toast { background: var(--panel2); border: 1px solid var(--border); border-inline-start: 4px solid var(--ok); border-radius: 12px; padding: 14px 18px; font-size: 13.5px; box-shadow: var(--shadow); animation: pop .25s; max-width: 380px; }
.toast.t-err { border-inline-start-color: var(--danger); }
@keyframes pop { from { transform: translateY(10px); opacity: 0; } }

.empty { text-align: center; color: var(--muted); padding: 40px 10px; font-size: 13.5px; }
.empty .e-ico { font-size: 36px; margin-bottom: 10px; }

.sig { font-size: 12px; color: var(--accent2); border-top: 1px dashed var(--border); margin-top: 8px; padding-top: 8px; }

.muted { color: var(--muted); } .small { font-size: 12px; }
.mt { margin-top: 16px; } .mb { margin-bottom: 16px; }
.flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.num { font-variant-numeric: tabular-nums; }

    snags: ['consultant', 'admin'],
    hseReports: ['consultant', 'admin'],
    materialTests: ['consultant', 'admin'],
    meetings: ['consultant', 'admin'],
    correspondence: ['consultant', 'admin'],
    bimModels: ['consultant', 'admin'],
    bimDocs: ['consultant', 'admin'],
    // وحدة التسليم والإغلاق ومراحل المشروع
    handoverItems: ['consultant', 'admin'],
    punchList: ['consultant', 'admin'],
    warranties: ['contractor', 'consultant', 'admin'],
    keysLog: ['consultant', 'admin', 'owner_rep'],
    incidents: ['consultant', 'admin'],
    scheduleTasks: ['consultant', 'admin']
  };

  function createCore(db, persist, opts) {
    persist = persist || function () {};
    opts = opts || {};
    // طبقة كلمات المرور: الخادم يمرر تشفير scrypt، ووضع الديمو بالمتصفح يقارن نصاً
    const pwd = opts.password || {
      hash: null,
      verify: function (plain, u) { return u.password === plain; }
    };
    // خطاف التسليم الخارجي (بريد/واتساب): يمرره الخادم فقط. غير معرّف في الديمو.
    const onNotify = typeof opts.onNotify === 'function' ? opts.onNotify : null;

    function nextId(prefix) {
      db.meta.seq = (db.meta.seq || 1000) + 1;
      return prefix + db.meta.seq;
    }

    function err(message, code) {
      const e = new Error(message);
      e.status = code || 400;
      return e;
    }

    /**
     * تكويد المستندات: كود فريد متسلسل لكل مستند/اعتماد/ملف
     * الصيغة: BSR-<المشروع>-<النوع>-<السنة>-<تسلسل 4 خانات>
     */
    function docCode(collection, projectId, year) {
      const t = DOC_TYPE_CODES[collection];
      if (!t) return null;
      const y = year || String(new Date().getFullYear());
      const key = (projectId || 'P1') + '-' + t + '-' + y;
      if (!db.meta.docSeq) db.meta.docSeq = {};
      db.meta.docSeq[key] = (db.meta.docSeq[key] || 0) + 1;
      return 'BSR-' + key + '-' + String(db.meta.docSeq[key]).padStart(4, '0');
    }

    /** سجل النظام: توثيق كل عملية (من، متى، ماذا) — يحتفظ بآخر 800 حدث */
    function audit(user, action, target) {
      if (!db.auditLog) db.auditLog = [];
      db.auditLog.unshift({
        id: nextId('AL'), time: nowStr(),
        userName: user ? user.name : 'النظام', role: user ? user.role : 'system',
        action: action, target: target
      });
      if (db.auditLog.length > 800) db.auditLog.length = 800;
    }

    function login(username, password) {
      const u = db.users.find(function (x) { return x.username === username; });
      if (!u || !password || !pwd.verify(password, u)) throw err('اسم المستخدم أو كلمة المرور غير صحيحة', 401);
      const sessionUser = {
        id: u.id, username: u.username, name: u.name, role: u.role,
        contractorId: u.contractorId || null,
        projectIds: u.projectIds && u.projectIds.length ? u.projectIds : null
      };
      audit(sessionUser, 'login', 'دخول إلى النظام');
      persist();
      return sessionUser;
    }

    function stripPassword(u) {
      const c = Object.assign({}, u);
      delete c.password;
      delete c.passwordHash;
      delete c.salt;
      return c;
    }

    /** يخزن حساباً بكلمة مرور مشفرة ويعيد نسخة عرض تحمل كلمة المرور مرة واحدة فقط */
    function storeAccount(fields, plainPw) {
      const stored = Object.assign({}, fields);
      if (pwd.hash) Object.assign(stored, pwd.hash(plainPw));
      else stored.password = plainPw;
      db.users.push(stored);
      return Object.assign(stripPassword(stored), { password: plainPw });
    }

    /** لقطة الحالة الكاملة مُرشّحة حسب دور المستخدم */
    function getState(user) {
      const s = {};
      const role = user.role;
      s.projects = db.projects;
      s.scheduleCurve = db.scheduleCurve;
      s.scheduleTasks = db.scheduleTasks;
      s.costCurve = db.costCurve;
      s.aiInsights = db.aiInsights;
      s.photos = db.photos;
      s.dailyReports = db.dailyReports;
      s.weeklyReports = db.weeklyReports || [];
      s.monthlyReports = db.monthlyReports;
      s.cameras = db.cameras || [];
      s.planDrawings = db.planDrawings || [];
      s.bimModels = db.bimModels || [];
      s.bimDocs = db.bimDocs || [];
      s.phaseLibrary = db.phaseLibrary || [];
      s.phaseTemplates = db.phaseTemplates || {};
      s.cashFlow = db.cashFlow || [];
      s.healthHistory = db.healthHistory || [];
      // وحدة التسليم والإغلاق
      s.handoverItems = db.handoverItems || [];
      s.punchList = db.punchList || [];
      s.warranties = db.warranties || [];
      s.keysLog = db.keysLog || [];
      s.incidents = db.incidents || [];
      // المالك يطلع على وثائق مشروعه (قراءة) — يقيدها نطاق المشروع أدناه
      s.files = (role === 'admin' || role === 'owner_rep' || role === 'consultant' || role === 'owner') ? (db.files || []) : [];
      s.messages = db.messages;
      s.contractors = db.contractors;
      s.boqItems = db.boqItems;
      APPROVAL_COLLECTIONS.concat(TECH_FILTERED, TECH_INTERNAL).forEach(function (c) { s[c] = db[c] || []; });

      if (role === 'contractor') {
        const cid = user.contractorId;
        CONTRACTOR_OWNED.forEach(function (c) {
          s[c] = (db[c] || []).filter(function (x) { return x.contractorId === cid; });
        });
        TECH_INTERNAL.forEach(function (c) { s[c] = []; });
        s.cameras = [];
        s.bimDocs = [];
        s.boqItems = db.boqItems.filter(function (x) { return x.contractorId === cid; });
        s.contractors = db.contractors.filter(function (x) { return x.id === cid; });
        // المقاول يرى مشروعه فقط
        const myC = db.contractors.find(function (x) { return x.id === cid; });
        if (myC && myC.projectId) s.projects = db.projects.filter(function (p) { return p.id === myC.projectId; });
        s.messages = [];
        s.users = [];
        // التسليم: المقاول يرى ما يخصه فقط (ملاحظاته وضماناته وحوادثه)
        s.punchList = (db.punchList || []).filter(function (x) { return x.contractorId === cid; });
        s.warranties = (db.warranties || []).filter(function (x) { return x.contractorId === cid; });
        s.incidents = (db.incidents || []).filter(function (x) { return x.assignedTo === cid; });
        s.handoverItems = [];
        s.keysLog = [];
        s.cashFlow = [];
      } else {
        // لا تُرسل كلمات المرور أو تجزئاتها لأي دور، بما فيهم الأدمن
        s.users = db.users.map(stripPassword);
      }

      // إشعارات المستخدم الحالي فقط (بحسب دوره أو مقاوله)
      s.notifications = myNotifications(user).slice(0, 60);
      // بيانات تواصل المستخدم وتفضيلات إشعاراته (للإعدادات)
      s.profile = myProfile(user);

      // سجل النظام: للأدمن وممثل المالك فقط
      if (role === 'admin' || role === 'owner_rep') s.auditLog = db.auditLog || [];

      // تقييد النطاق بالمشاريع المسندة: المالك يرى مشروعه فقط
      // (وينطبق كذلك على استشاري أُسندت له مشاريع محددة)
      if (user.projectIds && (role === 'owner' || role === 'consultant')) {
        const pids = user.projectIds;
        const inScope = function (x) { return !x.projectId || pids.indexOf(x.projectId) !== -1; };
        s.projects = s.projects.filter(function (p) { return pids.indexOf(p.id) !== -1; });
        Object.keys(s).forEach(function (k) {
          if (k === 'projects' || k === 'users' || k === 'auditLog') return;
          if (Array.isArray(s[k])) s[k] = s[k].filter(inScope);
        });
      }

      // مؤشر صحة كل مشروع في نطاق المستخدم (يُحسب بعد تقييد النطاق)
      s.projectHealth = {};
      (s.projects || []).forEach(function (p) { s.projectHealth[p.id] = computeProjectHealth(p.id); });
      return s;
    }

    function assertCanCreate(user, collection) {
      const allowed = CREATE_RULES[collection];
      if (!allowed) throw err('مجموعة غير معروفة: ' + collection, 404);
      if (allowed.indexOf(user.role) === -1) throw err('لا تملك صلاحية الإضافة هنا', 403);
    }

    /**
     * إشعار داخلي فوري. target: { role: 'consultant' } يصل للاستشاري والأدمن،
     * أو { contractorId: 'C1' } يصل لحسابات هذا المقاول.
     * تُقرأ لكل مستخدم على حدة عبر readBy.
     */
    function pushNotification(target, kind, text, refCollection, refId) {
      if (!db.notifications) db.notifications = [];
      const notif = {
        id: nextId('NT'), time: nowStr(), kind: kind, text: text,
        role: target.role || null, contractorId: target.contractorId || null,
        collection: refCollection || null, refId: refId || null, readBy: []
      };
      db.notifications.unshift(notif);
      if (db.notifications.length > 200) db.notifications.length = 200;
      // التسليم الخارجي (بريد/واتساب) عبر الخادم — لا يعطّل المسار الأساسي إن فشل
      if (onNotify) {
        try { onNotify(notif, notifyTargets(target)); } catch (e) { /* لا يؤثر على العملية */ }
      }
      return notif;
    }

    /** المستخدمون الذين يخصهم إشعار معيّن (دور + الأدمن، أو مقاول محدد) */
    function notifyTargets(target) {
      return (db.users || []).filter(function (u) {
        if (target.contractorId) return u.role === 'contractor' && u.contractorId === target.contractorId;
        if (target.role) return u.role === target.role || u.role === 'admin';
        return false;
      }).map(stripPassword);
    }

    function myNotifications(user) {
      return (db.notifications || []).filter(function (n) {
        if (n.contractorId) return user.role === 'contractor' && user.contractorId === n.contractorId;
        if (n.role) return user.role === n.role || user.role === 'admin';
        return false;
      });
    }

    function markNotificationsRead(user) {
      myNotifications(user).forEach(function (n) {
        if (n.readBy.indexOf(user.id) === -1) n.readBy.push(user.id);
      });
      persist();
      return { ok: true };
    }

    /** بيانات التواصل وتفضيلات الإشعارات للمستخدم الحالي (بلا كلمة المرور) */
    function myProfile(user) {
      const u = (db.users || []).find(function (x) { return x.id === user.id; }) || {};
      return {
        id: u.id, name: u.name, username: u.username, role: u.role,
        email: u.email || '', phone: u.phone || '',
        notifyEmail: u.notifyEmail !== false, notifyWhatsapp: !!u.notifyWhatsapp
      };
    }

    /** تحديث المستخدم لبيانات تواصله وتفضيلات إشعاراته (لنفسه فقط) */
    function updateProfile(user, patch) {
      const u = (db.users || []).find(function (x) { return x.id === user.id; });
      if (!u) throw err('المستخدم غير موجود', 404);
      if (patch.email != null) u.email = String(patch.email).trim();
      if (patch.phone != null) u.phone = String(patch.phone).trim();
      if (patch.notifyEmail != null) u.notifyEmail = !!patch.notifyEmail;
      if (patch.notifyWhatsapp != null) u.notifyWhatsapp = !!patch.notifyWhatsapp;
      audit(user, 'update', 'تحديث بيانات التواصل وتفضيلات الإشعارات');
      persist();
      return myProfile(user);
    }

    function createItem(user, collection, data) {
      assertCanCreate(user, collection);
      const item = Object.assign({}, data);
      item.id = nextId(collection.substring(0, 2).toUpperCase());
      item.projectId = item.projectId || 'P1';
      if (user.role === 'contractor') {
        item.contractorId = user.contractorId; // المقاول لا يُنشئ باسم غيره
        if (APPROVAL_COLLECTIONS.indexOf(collection) !== -1) item.status = 'pending';
      }
      if (!item.date) item.date = todayStr();
      if (!item.status) {
        if (DEFAULT_STATUS[collection]) item.status = DEFAULT_STATUS[collection];
        else if (APPROVAL_COLLECTIONS.indexOf(collection) !== -1) item.status = 'pending';
      }
      if (!item.docCode) item.docCode = docCode(collection, item.projectId);
      // سجل التتبع: كل معاملة تبدأ بحدث "تقديم"
      if (APPROVAL_COLLECTIONS.indexOf(collection) !== -1 || collection === 'rfis' || collection === 'rfps') {
        item.history = [{ status: item.status || 'pending', by: user.name, role: user.role, date: item.date }];
      }
      if (collection === 'users' && item.password && pwd.hash) {
        const plain = item.password;
        delete item.password;
        Object.assign(item, pwd.hash(plain));
        db.users.push(item);
        audit(user, 'create', labelOf('users', item));
        persist();
        return Object.assign(stripPassword(item), { password: plain }); // تُعرض مرة واحدة فقط
      }
      db[collection].push(item);
      // إشعار المكتب الفني بكل تقديم جديد من مقاول
      if (user.role === 'contractor' &&
          (APPROVAL_COLLECTIONS.indexOf(collection) !== -1 || collection === 'rfis' || collection === 'rfps')) {
        pushNotification({ role: 'consultant' }, 'submit',
          '📥 تقديم جديد: ' + labelOf(collection, item) + ' — من ' + user.name, collection, item.id);
        if (collection === 'rfps' && item.to === 'owner') {
          pushNotification({ role: 'owner' }, 'submit', '📮 طلب عرض موجه إليك: ' + (item.title || item.ref), collection, item.id);
        }
      }
      // إشعار المقاول عند إسناد ملاحظة تسليم أو تقرير حادث إليه
      if ((collection === 'punchList' || collection === 'incidents')) {
        const cid = item.contractorId || item.assignedTo;
        if (cid) pushNotification({ contractorId: cid }, 'assign',
          (collection === 'punchList' ? '📌 ملاحظة تسليم مسندة إليك: ' : '🚨 تقرير حادث مسند إليك: ') + (item.title || item.ref), collection, item.id);
      }
      audit(user, 'create', labelOf(collection, item));
      persist();
      return item;
    }

    function updateItem(user, collection, id, patch) {
      const list = db[collection];
      if (!list) throw err('مجموعة غير معروفة', 404);
      const item = list.find(function (x) { return x.id === id; });
      if (!item) throw err('العنصر غير موجود', 404);
      if (user.role === 'contractor') {
        if (item.contractorId !== user.contractorId) throw err('لا تملك صلاحية التعديل', 403);
        if (item.status && item.status !== 'pending' && item.status !== 'open') {
          // بعد البت: يسمح فقط بالرد على الترميز/الملاحظات على نفس النسخة
          const keys = Object.keys(patch);
          const allowed = keys.every(function (k) { return ['annotations', 'markupBy', 'markupDate'].indexOf(k) !== -1; });
          if (!allowed) throw err('لا يمكن تعديل طلب تم البت فيه — يمكنك الرد على الملاحظات أو رفع نسخة معدلة', 403);
        }
      }
      const wasOpen = item.status === 'open';
      const prevAssignee = item.assignedTo;
      Object.assign(item, patch);
      // إشعار المقاول عند الرد على استفساره أو عرضه
      if (wasOpen && patch.status === 'answered' && (collection === 'rfis' || collection === 'rfps') && item.contractorId) {
        pushNotification({ contractorId: item.contractorId }, 'answer',
          '↩️ تم الرد على ' + labelOf(collection, item) + (patch.answer ? ' — ' + patch.answer : ''), collection, item.id);
      }
      // إشعار الطرف المسند إليه تنبيه ذكي أو حادث
      if (patch.assignedTo && patch.assignedTo !== prevAssignee && (collection === 'aiInsights' || collection === 'incidents')) {
        pushNotification({ contractorId: patch.assignedTo }, 'assign',
          '📌 أُسند إليك: ' + (item.note || item.title || labelOf(collection, item)).slice(0, 80), collection, item.id);
      }
      audit(user, 'update', labelOf(collection, item));
      persist();
      return item;
    }

    function deleteItem(user, collection, id) {
      if (user.role !== 'admin' && !(user.role === 'owner_rep' && collection === 'users')) {
        throw err('الحذف متاح للأدمن فقط', 403);
      }
      const list = db[collection];
      if (!list) throw err('مجموعة غير معروفة', 404);
      const i = list.findIndex(function (x) { return x.id === id; });
      if (i === -1) throw err('العنصر غير موجود', 404);
      audit(user, 'delete', labelOf(collection, list[i]));
      list.splice(i, 1);
      persist();
      return { ok: true };
    }

    /**
     * قرار الاستشاري على أي طلب اعتماد.
     * status: approved | approved_notes | rejected
     * اعتماد المستخلص يحدّث نسب إنجاز بنود جدول الكميات المرتبطة به
     * (فتتحول مناطق المخططات من داكنة إلى ساطعة) ويحدّث المبالغ المستلمة للمقاول.
     */
    function review(user, opts) {
      if (user.role !== 'consultant' && user.role !== 'admin') throw err('قرار الاعتماد صلاحية الاستشاري', 403);
      const collection = opts.collection, id = opts.id, status = opts.status;
      if (APPROVAL_COLLECTIONS.indexOf(collection) === -1) throw err('هذه المجموعة ليست ضمن دورة الاعتماد', 400);
      if (['approved', 'approved_notes', 'rejected'].indexOf(status) === -1) throw err('حالة غير صالحة', 400);
      const item = db[collection].find(function (x) { return x.id === id; });
      if (!item) throw err('الطلب غير موجود', 404);

      item.status = status;
      item.notes = opts.notes || '';
      item.signature = user.name;
      item.signDate = todayStr();
      if (!item.reviewStartDate) item.reviewStartDate = item.date;
      item.reviewEndDate = todayStr();
      item.reviewDays = Math.max(0, Math.round((new Date(item.reviewEndDate) - new Date(item.date)) / 86400000));
      if (!item.history) item.history = [];
      item.history.push({ status: status, by: user.name, role: user.role, date: todayStr(), notes: opts.notes || '' });

      if (collection === 'payments' && (status === 'approved' || status === 'approved_notes')) {
        applyPaymentEffects(item);
      }
      const decision = status === 'rejected' ? 'رفض' : 'اعتماد';
      if (item.contractorId) {
        pushNotification({ contractorId: item.contractorId }, 'decision',
          (status === 'rejected' ? '↩ أُرجع إليك للتعديل: ' : status === 'approved_notes' ? '📝 اعتُمد مع ملاحظات: ' : '✅ اعتُمد: ') +
          labelOf(collection, item) + (opts.notes ? ' — ' + opts.notes : ''), collection, item.id);
      }
      audit(user, 'review', decision + ' — ' + labelOf(collection, item));
      persist();
      return item;
    }

    /** أثر اعتماد المستخلص: تحديث نسب البنود + المبالغ المستلمة */
    function applyPaymentEffects(pc) {
      const contractor = db.contractors.find(function (c) { return c.id === pc.contractorId; });
      if (contractor) contractor.amountReceived = (contractor.amountReceived || 0) + (pc.amount || 0);
      (pc.lines || []).forEach(function (line) {
        const bq = db.boqItems.find(function (b) { return b.id === line.boqItemId; });
        if (bq && typeof line.progress === 'number') {
          bq.progress = Math.max(bq.progress, Math.min(100, line.progress));
          bq.status = bq.progress >= 100 ? 'منجز' : bq.progress > 0 ? 'جاري' : 'لم يبدأ';
        }
      });
    }

    /**
     * إعادة تقديم نسخة معدلة على نفس المستند: تؤرشف النسخة الحالية
     * (الملف + الترميز + القرار) في revisions ويعود المستند لقيد المراجعة
     * — دورة مراجعة متصلة بلا ملفات مكررة وبسجل تدقيق كامل.
     */
    function resubmit(user, opts) {
      const collection = opts.collection, id = opts.id;
      const list = db[collection];
      if (!list) throw err('مجموعة غير معروفة', 404);
      const item = list.find(function (x) { return x.id === id; });
      if (!item) throw err('المستند غير موجود', 404);
      if (user.role === 'contractor' && item.contractorId !== user.contractorId) throw err('غير مصرح', 403);
      if (['contractor', 'consultant', 'admin'].indexOf(user.role) === -1) throw err('غير مصرح', 403);
      if (item.status === 'pending') throw err('المستند قيد المراجعة بالفعل', 400);

      if (!item.revisions) item.revisions = [];
      item.revisions.push({
        rev: item.revisions.length + 1,
        file: item.file || null,
        annotations: item.annotations || [],
        status: item.status, notes: item.notes || '',
        signature: item.signature || '', signDate: item.signDate || '',
        date: item.date, archivedAt: todayStr()
      });
      if (opts.file) item.file = opts.file;
      item.annotations = [];
      item.status = 'pending';
      item.notes = ''; item.signature = ''; item.signDate = '';
      item.date = todayStr();
      item.reviewStartDate = null; item.reviewEndDate = null; item.reviewDays = null;
      if (!item.history) item.history = [];
      item.history.push({ status: 'resubmitted', by: user.name, role: user.role, date: todayStr(), notes: 'نسخة معدلة رقم ' + (item.revisions.length + 1) });
      pushNotification({ role: 'consultant' }, 'resubmit',
        '🔄 أُعيد التقديم بنسخة معدلة: ' + labelOf(collection, item) + ' — من ' + user.name, collection, item.id);
      audit(user, 'update', 'إعادة تقديم نسخة معدلة — ' + labelOf(collection, item));
      persist();
      return item;
    }

    /** إضافة مقاول جديد مع حسابه وبنود كمياته (صلاحية الاستشاري) */
    function addContractor(user, payload) {
      if (['consultant', 'admin'].indexOf(user.role) === -1) throw err('إضافة المقاولين صلاحية الاستشاري', 403);
      const c = {
        id: nextId('C'), projectId: payload.projectId || 'P1',
        name: payload.name, type: payload.type,
        contractValue: Number(payload.contractValue) || 0,
        startDate: payload.startDate, endDate: payload.endDate,
        amountReceived: 0, plannedProgress: 0, phone: payload.phone || ''
      };
      db.contractors.push(c);
      let account = null;
      if (payload.username) {
        account = storeAccount(
          { id: nextId('U'), username: payload.username, name: c.name, role: 'contractor', contractorId: c.id },
          payload.password || genPassword()
        );
      }
      (payload.boqItems || []).forEach(function (b, i) {
        db.boqItems.push({
          id: nextId('BQ'), projectId: c.projectId, contractorId: c.id,
          discipline: c.type, floor: b.floor || 'GF', zone: i % 6,
          code: (c.type || 'GN').substring(0, 2).toUpperCase() + '-' + String(i + 1).padStart(2, '0'),
          description: b.description, unit: b.unit, qty: Number(b.qty) || 0,
          unitPrice: Number(b.unitPrice) || 0, progress: 0, status: 'لم يبدأ'
        });
      });
      audit(user, 'create', labelOf('contractors', c) + (account ? ' + حساب دخول (' + account.username + ')' : ''));
      persist();
      return { contractor: c, account: account };
    }

    /** إضافة مشروع وتعيين استشاري بحسابه (صلاحية ممثل المالك) */
    function addProject(user, payload) {
      if (['owner_rep', 'admin'].indexOf(user.role) === -1) throw err('إضافة المشاريع صلاحية ممثل المالك', 403);
      const p = {
        id: nextId('P'), name: payload.name, location: payload.location || '',
        description: payload.description || '', ownerName: payload.ownerName || '',
        consultantName: payload.consultantName || '',
        startPlanned: payload.startPlanned, endPlanned: payload.endPlanned,
        startActual: null, endForecast: payload.endPlanned,
        budgetPlanned: Number(payload.budgetPlanned) || 0, costActual: 0, costPlannedToDate: 0,
        progressPlanned: 0, progressActual: 0,
        floors: db.projects[0] ? db.projects[0].floors : [], disciplines: db.projects[0] ? db.projects[0].disciplines : []
      };
      db.projects.push(p);
      let account = null;
      if (payload.consultantUsername) {
        account = storeAccount(
          { id: nextId('U'), username: payload.consultantUsername,
            name: payload.consultantName || 'استشاري ' + p.name, role: 'consultant' },
          payload.consultantPassword || genPassword()
        );
      }
      audit(user, 'create', labelOf('projects', p) + (account ? ' + حساب استشاري (' + account.username + ')' : ''));
      persist();
      return { project: p, account: account };
    }

    /** إرسال تقرير للمالك (واتساب / إيميل) — محاكاة قناة الإرسال مع سجل موثق */
    function sendReport(user, payload) {
      if (['consultant', 'admin', 'owner_rep', 'owner'].indexOf(user.role) === -1) throw err('غير مصرح', 403);
      const msg = {
        id: nextId('MSG'), channel: payload.channel === 'whatsapp' ? 'whatsapp' : 'email',
        to: payload.to, title: payload.title || 'تقرير المشروع',
        date: nowStr(), status: payload.status === 'sent_demo' ? 'sent_demo' : 'sent', by: user.name
      };
      db.messages.push(msg);
      audit(user, 'send', 'إرسال تقرير عبر ' + (msg.channel === 'whatsapp' ? 'واتساب' : 'البريد') + ': ' + msg.title);
      persist();
      return msg;
    }

    // ===== حسابات مشتقة =====

    /** ملخص أداء مقاول: إنجاز، مبالغ، تأخر، تجاوز صرف */
    function contractorSummary(c) {
      const items = db.boqItems.filter(function (b) { return b.contractorId === c.id; });
      let earned = 0, total = 0;
      items.forEach(function (b) {
        const v = b.qty * b.unitPrice;
        total += v; earned += v * (b.progress / 100);
      });
      const progress = total ? Math.round((earned / total) * 1000) / 10 : 0;
      const earnedValue = c.contractValue * progress / 100;
      const delayPct = thresholdsOf(c.projectId || 'P1').contractorDelayPct;
      return {
        id: c.id, name: c.name, type: c.type,
        contractValue: c.contractValue, amountReceived: c.amountReceived,
        startDate: c.startDate, endDate: c.endDate,
        progress: progress, plannedProgress: c.plannedProgress || 0,
        delayed: progress < (c.plannedProgress || 0) - delayPct,
        overpaid: c.amountReceived > earnedValue * 1.05,
        earnedValue: Math.round(earnedValue)
      };
    }

    /** نسبة إنجاز دور/تخصص لتلوين المخططات (داكن ← ساطع) */
    function floorDisciplineProgress(floorId, discipline) {
      const items = db.boqItems.filter(function (b) {
        return b.floor === floorId && (!discipline || b.discipline === discipline);
      });
      if (!items.length) return null;
      let earned = 0, total = 0;
      items.forEach(function (b) {
        const v = b.qty * b.unitPrice;
        total += v; earned += v * (b.progress / 100);
      });
      return total ? Math.round((earned / total) * 100) : 0;
    }

    // ============ عتبات التنبيه القابلة للضبط لكل مشروع ============
    const DEFAULT_THRESHOLDS = { slaReviewDays: 7, warrantyWarnDays: 90, contractorDelayPct: 3, healthAlertGrade: 'C' };
    function thresholdsOf(projectId) {
      const P = db.projects.find(function (p) { return p.id === projectId; });
      return Object.assign({}, DEFAULT_THRESHOLDS, (P && P.thresholds) || {});
    }

    // ============ مؤشر صحة المشروع (مصدر موثوق للحساب والتنبيه) ============
    function clampScore(v) { return Math.max(0, Math.min(100, Math.round(v))); }
    const HEALTH_GRADES = [
      { min: 85, grade: 'A', ar: 'ممتاز', cls: 'ok', tier: 4 },
      { min: 70, grade: 'B', ar: 'جيد', cls: 'ok', tier: 3 },
      { min: 55, grade: 'C', ar: 'مقبول — يحتاج متابعة', cls: 'warn', tier: 2 },
      { min: 0, grade: 'D', ar: 'حرج — تدخّل عاجل', cls: 'danger', tier: 1 }
    ];
    function gradeOf(score) { return HEALTH_GRADES.find(function (g) { return score >= g.min; }); }

    /** يحسب صحة مشروع من بياناته الحالية (نفس صيغة الواجهة تماماً) */
    function computeProjectHealth(projectId) {
      const P = db.projects.find(function (p) { return p.id === projectId; });
      if (!P) return null;
      const inP = function (x) { return !x.projectId || x.projectId === projectId; };
      const th = thresholdsOf(projectId);
      const progVar = Math.round(((P.progressActual || 0) - (P.progressPlanned || 0)) * 10) / 10;
      const costVar = (P.costActual || 0) - (P.costPlannedToDate || 0);
      const costVarPct = P.costPlannedToDate ? Math.round(costVar / P.costPlannedToDate * 100) : 0;
      const openNcr = (db.ncrs || []).filter(function (x) { return inP(x) && x.status === 'open'; }).length;
      const failedTests = (db.materialTests || []).filter(function (x) { return inP(x) && x.result === 'fail'; }).length;
      const openPunch = (db.punchList || []).filter(function (x) { return inP(x) && x.status === 'open'; }).length;
      const openHse = (db.hseReports || []).filter(function (x) { return inP(x) && x.status === 'open'; }).length;
      const openInc = (db.incidents || []).filter(function (x) { return inP(x) && x.status === 'open'; }).length;
      const conts = (db.contractors || []).filter(inP);
      let delayed = 0, overpaid = 0;
      conts.forEach(function (c) {
        const items = (db.boqItems || []).filter(function (b) { return b.contractorId === c.id; });
        let earned = 0, total = 0;
        items.forEach(function (b) { const v = b.qty * b.unitPrice; total += v; earned += v * (b.progress / 100); });
        const progress = total ? earned / total * 100 : 0;
        if (progress < (c.plannedProgress || 0) - th.contractorDelayPct) delayed++;
        if (c.amountReceived > (c.contractValue * progress / 100) * 1.05) overpaid++;
      });
      const schedule = clampScore(100 + progVar * 3);
      const cost = clampScore(100 - Math.max(0, costVarPct) * 3);
      const quality = clampScore(100 - openNcr * 8 - failedTests * 6 - openPunch * 3);
      const safety = clampScore(100 - openHse * 10 - openInc * 12);
      const contractor = clampScore(100 - delayed * 10 - overpaid * 8);
      const score = Math.round(schedule * 0.30 + cost * 0.25 + quality * 0.20 + safety * 0.15 + contractor * 0.10);
      const g = gradeOf(score);
      return {
        projectId: projectId, score: score, grade: g.grade, gradeAr: g.ar, cls: g.cls, tier: g.tier,
        components: { schedule: schedule, cost: cost, quality: quality, safety: safety, contractor: contractor },
        issues: { openNcr: openNcr, failedTests: failedTests, openPunch: openPunch, openHse: openHse, openInc: openInc, delayed: delayed, overpaid: overpaid }
      };
    }

    /**
     * يسجّل لقطة صحة شهرية للمشروع، ويطلق تنبيهاً تلقائياً عند هبوط الدرجة
     * لفئة أدنى (يصل للمالك والاستشاري داخل النظام وبالبريد/واتساب).
     */
    function recordHealthSnapshot(user, opts) {
      opts = opts || {};
      const projectId = opts.projectId || (db.projects[0] && db.projects[0].id);
      const h = computeProjectHealth(projectId);
      if (!h) return { recorded: false };
      if (!db.healthHistory) db.healthHistory = [];
      const month = todayStr().slice(0, 7);
      const existing = db.healthHistory.find(function (x) { return x.projectId === projectId && x.month === month; });
      if (existing) { existing.score = h.score; existing.grade = h.grade; }
      else db.healthHistory.push({ projectId: projectId, month: month, score: h.score, grade: h.grade });

      if (!db.meta.lastHealthGrade) db.meta.lastHealthGrade = {};
      const prev = db.meta.lastHealthGrade[projectId];
      const tierOf = { A: 4, B: 3, C: 2, D: 1 };
      const alertTier = tierOf[thresholdsOf(projectId).healthAlertGrade] || 2; // العتبة القابلة للضبط
      const P = db.projects.find(function (p) { return p.id === projectId; });
      const pname = P ? P.name : projectId;
      const prevTier = prev ? tierOf[prev] : null;
      let dropped = false, improved = false;
      // تنبيه هبوط: تراجعت الدرجة ودخلت منطقة القلق (عند العتبة أو أدنى)
      if (prevTier && h.tier < prevTier && h.tier <= alertTier) {
        dropped = true;
        const msg = '📉 تراجع مؤشر صحة المشروع "' + pname + '" من الفئة ' + prev + ' إلى ' + h.grade +
          ' (' + h.score + '/100) — ' + h.gradeAr;
        pushNotification({ role: 'owner' }, 'health', msg, 'projects', projectId);
        pushNotification({ role: 'consultant' }, 'health', msg, 'projects', projectId);
        audit(user || { name: 'النظام', role: 'system' }, 'update', 'تنبيه هبوط صحة المشروع إلى ' + h.grade);
      } else if (prevTier && h.tier > prevTier && prevTier <= alertTier) {
        // تنبيه تعافٍ: تحسّنت الدرجة بعد أن كانت في منطقة القلق
        improved = true;
        const msg = '📈 تحسّن مؤشر صحة المشروع "' + pname + '" من الفئة ' + prev + ' إلى ' + h.grade +
          ' (' + h.score + '/100) — ' + h.gradeAr;
        pushNotification({ role: 'owner' }, 'recovery', msg, 'projects', projectId);
        pushNotification({ role: 'consultant' }, 'recovery', msg, 'projects', projectId);
        audit(user || { name: 'النظام', role: 'system' }, 'update', 'تنبيه تحسّن صحة المشروع إلى ' + h.grade);
      }
      db.meta.lastHealthGrade[projectId] = h.grade;
      persist();
      return { recorded: true, dropped: dropped, improved: improved, score: h.score, grade: h.grade };
    }

    function genPassword() {
      const chars = 'abcdefghjkmnpqrstuvwxyz23456789';
      let p = '';
      for (let i = 0; i < 8; i++) p += chars[Math.floor(Math.random() * chars.length)];
      return p;
    }
    function todayStr() { return new Date().toISOString().slice(0, 10); }
    function nowStr() { return new Date().toISOString().slice(0, 16).replace('T', ' '); }

    return {
      db: db,
      audit: audit,
      docCode: docCode,
      login: login,
      getState: getState,
      createItem: createItem,
      updateItem: updateItem,
      deleteItem: deleteItem,
      review: review,
      resubmit: resubmit,
      markNotificationsRead: markNotificationsRead,
      updateProfile: updateProfile,
      myProfile: myProfile,
      computeProjectHealth: computeProjectHealth,
      recordHealthSnapshot: recordHealthSnapshot,
      addContractor: addContractor,
      addProject: addProject,
      sendReport: sendReport,
      contractorSummary: contractorSummary,
      floorDisciplineProgress: floorDisciplineProgress,
      APPROVAL_COLLECTIONS: APPROVAL_COLLECTIONS
    };
  }

  return { createCore: createCore };
});


/* ===== public/js/api.js ===== */
/**
 * بصير | طبقة الاتصال Api
 * وضعان:
 *  - الوضع المتصل: يتخاطب مع خادم Node عبر fetch
 *  - وضع الديمو (window.DEMO_MODE): يشغّل نفس نواة المنطق داخل المتصفح بلا خادم
 */
(function () {
  'use strict';

  const DEMO = !!window.DEMO_MODE;

  // ============ وضع الديمو: نواة داخل المتصفح ============
  let demoCore = null, demoUser = null;

  function demoInit() {
    if (demoCore) return;
    let db = null;
    try {
      const saved = localStorage.getItem('bassir-demo-db');
      if (saved) db = JSON.parse(saved);
    } catch (e) { /* تجاهل */ }
    const fresh = window.BassirSeed.buildSeed();
    if (!db || !db.meta || db.meta.version !== fresh.meta.version) db = fresh;
    demoCore = window.BassirCore.createCore(db, function persist() {
      try { localStorage.setItem('bassir-demo-db', JSON.stringify(db)); } catch (e) { /* تجاهل */ }
    });
    try {
      const su = sessionStorage.getItem('bassir-demo-user');
      if (su) demoUser = JSON.parse(su);
    } catch (e) { /* تجاهل */ }
  }

  function demoCall(path, method, body) {
    demoInit();
    const c = demoCore;
    if (path === '/api/login') {
      const user = c.login(body.username, body.password);
      demoUser = user;
      sessionStorage.setItem('bassir-demo-user', JSON.stringify(user));
      return { token: 'demo', user: user };
    }
    if (!demoUser) { const e = new Error('يلزم تسجيل الدخول'); e.status = 401; throw e; }
    if (path === '/api/logout') { demoUser = null; sessionStorage.removeItem('bassir-demo-user'); return { ok: true }; }
    if (path === '/api/me') return { user: demoUser };
    if (path === '/api/state') return c.getState(demoUser);
    if (path === '/api/summary/contractors') {
      const cid = demoUser.role === 'contractor' ? demoUser.contractorId : null;
      return c.db.contractors.filter(function (x) { return !cid || x.id === cid; }).map(c.contractorSummary);
    }
    let m = path.match(/^\/api\/collections\/(\w+)$/);
    if (m && method === 'POST') return c.createItem(demoUser, m[1], body);
    m = path.match(/^\/api\/collections\/(\w+)\/([\w-]+)$/);
    if (m && method === 'PUT') return c.updateItem(demoUser, m[1], m[2], body);
    if (m && method === 'DELETE') return c.deleteItem(demoUser, m[1], m[2]);
    if (path === '/api/actions/review') return c.review(demoUser, body);
    if (path === '/api/actions/resubmit') return c.resubmit(demoUser, body);
    if (path === '/api/actions/notify-read') return c.markNotificationsRead(demoUser);
    if (path === '/api/actions/profile') return c.updateProfile(demoUser, body);
    if (path === '/api/actions/record-health') return c.recordHealthSnapshot(demoUser, body);
    if (path === '/api/actions/add-contractor') return c.addContractor(demoUser, body);
    if (path === '/api/actions/add-project') return c.addProject(demoUser, body);
    if (path === '/api/actions/send-report') return c.sendReport(demoUser, body);
    const e = new Error('مسار غير معروف'); e.status = 404; throw e;
  }

  // ============ الواجهة الموحدة ============
  async function call(path, method, body) {
    method = method || 'GET';
    if (DEMO) {
      try { return structuredClone(demoCall(path, method, body)); }
      catch (e) { return Promise.reject(e); }
    }
    const headers = { 'Content-Type': 'application/json' };
    const token = sessionStorage.getItem('bassir-token');
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch(path, {
      method: method, headers: headers,
      body: body ? JSON.stringify(body) : undefined
    });
    const data = await res.json().catch(function () { return {}; });
    if (!res.ok) { const e = new Error(data.error || ('خطأ ' + res.status)); e.status = res.status; throw e; }
    return data;
  }

  window.Api = {
    demo: DEMO,
    async login(username, password) {
      const r = await call('/api/login', 'POST', { username: username, password: password });
      if (!DEMO) sessionStorage.setItem('bassir-token', r.token);
      sessionStorage.setItem('bassir-user', JSON.stringify(r.user));
      return r.user;
    },
    async logout() {
      try { await call('/api/logout', 'POST', {}); } catch (e) { /* تجاهل */ }
      sessionStorage.removeItem('bassir-token');
      sessionStorage.removeItem('bassir-user');
    },
    currentUser() {
      try { return JSON.parse(sessionStorage.getItem('bassir-user')); } catch (e) { return null; }
    },
    state() { return call('/api/state'); },
    contractorsSummary() { return call('/api/summary/contractors'); },
    create(collection, data) { return call('/api/collections/' + collection, 'POST', data); },
    update(collection, id, patch) { return call('/api/collections/' + collection + '/' + id, 'PUT', patch); },
    remove(collection, id) { return call('/api/collections/' + collection + '/' + id, 'DELETE'); },
    review(opts) { return call('/api/actions/review', 'POST', opts); },
    addContractor(p) { return call('/api/actions/add-contractor', 'POST', p); },
    addProject(p) { return call('/api/actions/add-project', 'POST', p); },
    sendReport(p) { return call('/api/actions/send-report', 'POST', p); },
    /** رفع ملف فعلي — opts: { category, versionOf } — في الديمو محاكاة بالاسم */
    async upload(file, opts) {
      opts = opts || {};
      if (DEMO) return { name: file.name, url: '', demo: true, category: opts.category || 'أخرى' };
      const token = sessionStorage.getItem('bassir-token');
      const headers = {
        'Authorization': 'Bearer ' + token,
        'Content-Type': file.type || 'application/octet-stream',
        'x-filename': encodeURIComponent(file.name)
      };
      if (opts.category) headers['x-category'] = encodeURIComponent(opts.category);
      if (opts.versionOf) headers['x-version-of'] = opts.versionOf;
      const res = await fetch('/api/upload', { method: 'POST', headers: headers, body: file });
      const data = await res.json().catch(function () { return {}; });
      if (!res.ok) { const e = new Error(data.error || 'فشل رفع الملف'); throw e; }
      return data;
    },
    resubmit(p) { return call('/api/actions/resubmit', 'POST', p); },
    notifyRead() { return call('/api/actions/notify-read', 'POST', {}); },
    updateProfile(p) { return call('/api/actions/profile', 'POST', p); },
    recordHealth(projectId) { return call('/api/actions/record-health', 'POST', { projectId: projectId }); },
    backup() {
      if (DEMO) return Promise.reject(new Error('النسخ الاحتياطي متاح في نسخة الخادم'));
      return call('/api/actions/backup', 'POST', {});
    },
    backups() {
      if (DEMO) return Promise.resolve([]);
      return call('/api/backups');
    },
    integrationsStatus() {
      if (DEMO) return Promise.resolve({ demo: true });
      return call('/api/integrations/status');
    },
    analyzePhoto(p) {
      if (DEMO) { const e = new Error('التحليل الحقيقي متاح في نسخة الخادم بعد إضافة ANTHROPIC_API_KEY'); e.status = 503; return Promise.reject(e); }
      return call('/api/actions/analyze-photo', 'POST', p);
    },
    resetDemo() {
      if (DEMO) { localStorage.removeItem('bassir-demo-db'); demoCore = null; }
    }
  };
})();

/** بصير | رسوم بيانية SVG خفيفة (بدون مكتبات خارجية) */
(function () {
  'use strict';

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /** منحنى S: مخطط مقابل فعلي */
  function sCurve(points, opts) {
    opts = opts || {};
    const W = 640, H = 280, PL = 46, PR = 16, PT = 18, PB = 40;
    const iw = W - PL - PR, ih = H - PT - PB;
    const maxY = opts.maxY || 100;
    const n = points.length;
    const x = function (i) { return PL + (iw * i) / (n - 1); };
    const y = function (v) { return PT + ih - (ih * v) / maxY; };

    function pathFor(key) {
      let d = '', started = false;
      points.forEach(function (p, i) {
        if (p[key] == null) return;
        d += (started ? ' L ' : 'M ') + x(i).toFixed(1) + ' ' + y(p[key]).toFixed(1);
        started = true;
      });
      return d;
    }

    let grid = '';
    for (let g = 0; g <= 4; g++) {
      const gy = PT + (ih * g) / 4;
      grid += '<line x1="' + PL + '" y1="' + gy + '" x2="' + (W - PR) + '" y2="' + gy + '" stroke="#1c2536" stroke-width="1"/>' +
        '<text x="' + (PL - 8) + '" y="' + (gy + 4) + '" fill="#67718a" font-size="10" text-anchor="end">' + Math.round(maxY - (maxY * g) / 4) + (opts.unit || '%') + '</text>';
    }
    let labels = '';
    points.forEach(function (p, i) {
      if (i % Math.ceil(n / 8) !== 0 && i !== n - 1) return;
      labels += '<text x="' + x(i) + '" y="' + (H - 12) + '" fill="#67718a" font-size="9.5" text-anchor="middle">' + esc(p.month || p.label) + '</text>';
    });

    let dots = '';
    points.forEach(function (p, i) {
      if (p.actual != null) dots += '<circle cx="' + x(i) + '" cy="' + y(p.actual) + '" r="3.4" fill="#e0a458"/>';
    });

    // منطقة تظليل تحت المنحنى الفعلي
    let lastActual = -1;
    points.forEach(function (p, i) { if (p.actual != null) lastActual = i; });
    let area = '';
    if (lastActual > 0) {
      area = pathFor('actual') + ' L ' + x(lastActual) + ' ' + y(0) + ' L ' + x(0) + ' ' + y(0) + ' Z';
    }

    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img">' +
      grid + labels +
      (area ? '<path d="' + area + '" fill="rgba(224,164,88,.09)"/>' : '') +
      '<path d="' + pathFor('planned') + '" fill="none" stroke="#4cc9f0" stroke-width="2.2" stroke-dasharray="7 5"/>' +
      '<path d="' + pathFor('actual') + '" fill="none" stroke="#e0a458" stroke-width="3"/>' +
      dots +
      '<g font-size="11">' +
      '<rect x="' + (PL + 4) + '" y="' + (PT + 2) + '" width="12" height="4" rx="2" fill="#4cc9f0"/><text x="' + (PL + 22) + '" y="' + (PT + 8) + '" fill="#aab3c5">' + esc(opts.plannedLabel || 'المخطط') + '</text>' +
      '<rect x="' + (PL + 84) + '" y="' + (PT + 2) + '" width="12" height="4" rx="2" fill="#e0a458"/><text x="' + (PL + 102) + '" y="' + (PT + 8) + '" fill="#aab3c5">' + esc(opts.actualLabel || 'الفعلي') + '</text>' +
      '</g></svg>';
  }

  /** حلقة نسبة إنجاز */
  function donut(value, opts) {
    opts = opts || {};
    const R = 52, C = 2 * Math.PI * R;
    const v = Math.max(0, Math.min(100, value || 0));
    const color = opts.color || (v >= 70 ? '#2dd4a0' : v >= 40 ? '#e0a458' : '#ef5d75');
    return '<svg viewBox="0 0 140 140" style="max-width:' + (opts.size || 140) + 'px">' +
      '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="#1a2234" stroke-width="14"/>' +
      '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="' + color + '" stroke-width="14" stroke-linecap="round" ' +
      'stroke-dasharray="' + (C * v / 100).toFixed(1) + ' ' + C.toFixed(1) + '" transform="rotate(-90 70 70)"/>' +
      '<text x="70" y="66" text-anchor="middle" fill="#e9ecf3" font-size="24" font-weight="800">' + v + '%</text>' +
      '<text x="70" y="88" text-anchor="middle" fill="#8b95a8" font-size="10.5">' + esc(opts.label || '') + '</text></svg>';
  }

  /** أعمدة أفقية مقارنة (مخطط/فعلي لكل عنصر) */
  function compareBars(rows) {
    let html = '<div>';
    rows.forEach(function (r) {
      const a = Math.max(0, Math.min(100, r.actual));
      const p = Math.max(0, Math.min(100, r.planned));
      const behind = a < p - 3;
      html += '<div style="margin-bottom:14px">' +
        '<div class="flex" style="justify-content:space-between;font-size:12.5px;margin-bottom:5px">' +
        '<span>' + esc(r.label) + '</span>' +
        '<span class="num ' + (behind ? '' : '') + '" style="color:' + (behind ? '#ef5d75' : '#2dd4a0') + '">' + a + '% <span class="muted">/ ' + p + '% مخطط</span></span></div>' +
        '<div style="position:relative;height:10px;background:#1a2234;border-radius:99px">' +
        '<i style="position:absolute;inset-inline-start:0;top:0;bottom:0;width:' + a + '%;border-radius:99px;background:linear-gradient(90deg,' + (behind ? '#d4405c,#ef5d75' : '#1fae85,#2dd4a0') + ')"></i>' +
        '<i style="position:absolute;inset-inline-start:' + p + '%;top:-3px;bottom:-3px;width:2.5px;background:#4cc9f0;border-radius:2px" title="المخطط"></i>' +
        '</div></div>';
    });
    return html + '</div>';
  }

  window.Charts = { sCurve: sCurve, donut: donut, compareBars: compareBars, esc: esc };
})();

(function () {

      '<canvas id="dv-canvas"></canvas>' +

        : (item.notes || item.signature ?
          '<div class="dv-review"><b class="small">قرار الاستشاري:</b><div class="small" style="margin-top:6px">' + esc(item.notes || '—') + '</div>' +
          (item.signature ? '<div class="sig">✍️ ' + esc(item.signature) + ' · ' + esc(item.signDate || '') + '</div>' : '') + '</div>' : '')) +
      (canRespond ?
        '<div class="dv-review"><b class="small">📤 إعادة التقديم على نفس المستند</b>' +
        '<div class="small muted" style="margin:6px 0;line-height:1.8">تُؤرشف النسخة الحالية (الملف + الترميز + القرار) تلقائياً في سجل النسخ — بلا ملفات مكررة.</div>' +
        '<label class="fl">ملف معدل (اختياري — يحل محل الحالي كنسخة جديدة)</label>' +
        '<input class="inp" id="dv-refile" type="file">' +
        '<div class="m-actions"><button class="btn block" id="dv-resubmit">🔄 إعادة التقديم للمراجعة</button></div></div>' : '') +

    document.body.appendChild(back);

    // ============ عرض PDF حقيقي داخل النظام ============
    async function openPdf() {

        const lib = await loadPdfjs();

          '<div class="dv-sheet-note">تعذّرت معاينة الـPDF هنا — الترميز يُحفظ على المستند نفسه</div>';
        stage.insertBefore(sheet, canvas);

    async function renderPdfPage() {
      if (!pdfDoc) return;
      const pg = await pdfDoc.getPage(page);
      const wrapW = Math.max(stage.parentElement.clientWidth - 20, 640);
      const vp1 = pg.getViewport({ scale: 1 });

    function gotoPage(d) {

    back.querySelector('#dv-prev').addEventListener('click', function () { gotoPage(1); });  // RTL: السابق يميناً
    back.querySelector('#dv-next').addEventListener('click', function () { gotoPage(-1); });

    function fit() {
      const base = img || (pdfCanvas && pdfCanvas.style.display !== 'none' ? pdfCanvas : back.querySelector('#dv-sheet'));

    function W() { return canvas.clientWidth; }
    function H() { return canvas.clientHeight; }

    function pageAnns() { return activeAnns().filter(function (a) { return (a.page || 1) === page; }); }

    function drawArrow(a) {
      const x1 = a.from[0] * W(), y1 = a.from[1] * H(), x2 = a.to[0] * W(), y2 = a.to[1] * H();
      cx2.beginPath(); cx2.moveTo(x1, y1); cx2.lineTo(x2, y2); cx2.stroke();
      const ang = Math.atan2(y2 - y1, x2 - x1);
      cx2.beginPath();
      cx2.moveTo(x2, y2);
      cx2.lineTo(x2 - 14 * Math.cos(ang - 0.45), y2 - 14 * Math.sin(ang - 0.45));

    }

    /** سحابة مراجعة: أقواس متتالية على محيط المستطيل */
    function drawCloud(a) {
      const x = Math.min(a.from[0], a.to[0]) * W(), y = Math.min(a.from[1], a.to[1]) * H();
      const w = Math.abs(a.to[0] - a.from[0]) * W(), h = Math.abs(a.to[1] - a.from[1]) * H();
      if (w < 8 || h < 8) return;
      const r = Math.max(7, Math.min(14, Math.min(w, h) / 6));
      cx2.beginPath();
      let i;
      const nx = Math.max(2, Math.round(w / (r * 1.6))), ny = Math.max(2, Math.round(h / (r * 1.6)));
      for (i = 0; i < nx; i++) cx2.arc(x + (i + 0.5) * w / nx, y, r, Math.PI, 0);              // أعلى
      for (i = 0; i < ny; i++) cx2.arc(x + w, y + (i + 0.5) * h / ny, r, -Math.PI / 2, Math.PI / 2); // يمين
      for (i = nx - 1; i >= 0; i--) cx2.arc(x + (i + 0.5) * w / nx, y + h, r, 0, Math.PI);     // أسفل
      for (i = ny - 1; i >= 0; i--) cx2.arc(x, y + (i + 0.5) * h / ny, r, Math.PI / 2, -Math.PI / 2); // يسار
      cx2.stroke();
    }

    function drawStamp(a) {
      const x = a.at[0] * W(), y = a.at[1] * H();
      cx2.font = '800 16px Tahoma';
      const tw = cx2.measureText(a.text).width;
      cx2.save();
      cx2.translate(x, y); cx2.rotate(-0.12);
      cx2.strokeStyle = a.color; cx2.lineWidth = 2.5;
      cx2.globalAlpha = 0.9;
      cx2.strokeRect(-tw / 2 - 14, -20, tw + 28, 40);
      cx2.fillStyle = a.color; cx2.textAlign = 'center'; cx2.textBaseline = 'middle';
      cx2.fillText(a.text, 0, 1);
      if (a.by) { cx2.font = '600 9px Tahoma'; cx2.fillText(a.by + ' · ' + (a.date || ''), 0, 14); }
      cx2.restore();
      cx2.textAlign = 'start'; cx2.textBaseline = 'alphabetic'; cx2.globalAlpha = 1;
    }

    function drawAnn(a) {
      cx2.strokeStyle = a.color; cx2.fillStyle = a.color; cx2.lineWidth = 2.5; cx2.lineJoin = 'round'; cx2.lineCap = 'round';
      if (a.type === 'pen') {
        cx2.beginPath();
        a.points.forEach(function (pt, i) { i ? cx2.lineTo(pt[0] * W(), pt[1] * H()) : cx2.moveTo(pt[0] * W(), pt[1] * H()); });
        cx2.stroke();
      } else if (a.type === 'rect') {
        cx2.strokeRect(a.from[0] * W(), a.from[1] * H(), (a.to[0] - a.from[0]) * W(), (a.to[1] - a.from[1]) * H());
      } else if (a.type === 'hl') {
        cx2.globalAlpha = 0.3;
        cx2.fillRect(a.from[0] * W(), a.from[1] * H(), (a.to[0] - a.from[0]) * W(), (a.to[1] - a.from[1]) * H());
        cx2.globalAlpha = 1;
      } else if (a.type === 'cloud') {
        drawCloud(a);
      } else if (a.type === 'arrow') {
        drawArrow(a);
      } else if (a.type === 'stamp') {
        drawStamp(a);
      } else if (a.type === 'text') {
        cx2.font = '700 15px Tahoma'; cx2.direction = 'rtl';
        cx2.fillText(a.text, a.at[0] * W(), a.at[1] * H());
      } else if (a.type === 'pin') {
        const x = a.at[0] * W(), y = a.at[1] * H();

        cx2.fillText(String(a.n), x, y + 1);

      cx2.clearRect(0, 0, W(), H());

    // ============ قائمة الملاحظات + ردود المقاول على نفس المستند ============
    function drawPinsList() {
      const list = activeAnns();
