  // ============ 2) الاستفسارات والعروض RFI / RFP: إرسال، ردود، ومدد الاستجابة ============
  const rfxState = { tab: 'rfis' };

  function turnaround(it) {
    if (!it.signDate || !it.date) return null;
    return Math.max(0, Math.round((new Date(it.signDate) - new Date(it.date)) / 86400000));
  }

  function renderRfx(el, ctx) {
    const SLA_DAYS = VS.thresholds(ctx.S.projects[0]).slaReviewDays; // عتبة المشروع الحالي
    const tab = rfxState.tab;
    const isRfp = tab === 'rfps';
    const items = (ctx.S[tab] || []).slice().sort(function (a, b) {
      return (a.status === 'open' ? 0 : 1) - (b.status === 'open' ? 0 : 1);
    });
    const canAnswer = ['consultant', 'admin', 'owner_rep', 'owner'].indexOf(ctx.U.role) !== -1;
    const open = items.filter(function (x) { return x.status === 'open'; }).length;
    const answered = items.filter(function (x) { return x.status === 'answered'; });
    const tds = answered.map(turnaround).filter(function (d) { return d != null; });
    const avgTd = tds.length ? Math.round(tds.reduce(function (a, b) { return a + b; }, 0) / tds.length * 10) / 10 : 0;

    el.innerHTML =
      '<div class="tabs">' +
      '<div class="tab ' + (tab === 'rfis' ? 'active' : '') + '" data-xtab="rfis">❓ استفسارات RFI</div>' +
      '<div class="tab ' + (tab === 'rfps' ? 'active' : '') + '" data-xtab="rfps">📮 طلبات وعروض RFP</div>' +
      '</div>' +
      '<div class="grid g3 mb">' +
      '<div class="card kpi ' + (open ? 'k-warn' : 'k-ok') + '"><div class="lbl">بانتظار الرد</div><div class="val num">' + open + '</div><div class="sub">' + (isRfp ? 'لدى الاستشاري أو المالك' : 'لدى الاستشاري') + '</div></div>' +
      '<div class="card kpi k-ok"><div class="lbl">تم الرد عليها</div><div class="val num">' + answered.length + '</div><div class="sub">بسجل ردود موثق وموقع</div></div>' +
      '<div class="card kpi k-info"><div class="lbl">متوسط مدة الاستجابة</div><div class="val num">' + avgTd + '</div><div class="sub">يوم من الإرسال حتى الرد</div></div>' +
      '</div>' +

      '<div class="card"><div class="flex" style="justify-content:space-between;margin-bottom:8px;flex-wrap:wrap">' +
      '<h3 style="margin:0">' + (isRfp ? '📮 طلبات العروض والمقترحات RFP <span class="hint">تُوجه للاستشاري أو للمالك مع تتبع الردود ومددها</span>' : '❓ الاستفسارات الفنية RFI') + '</h3>' +
      '<div class="flex"><button class="btn ghost sm" id="rx-csv">📥 تصدير CSV</button>' +
      '<button class="btn sm" id="rx-add">➕ إرسال ' + (isRfp ? 'RFP' : 'RFI') + ' جديد</button></div></div>' +
      (items.length ?
        '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
        '<th>المرجع</th><th>الموضوع</th><th>من</th>' + (isRfp ? '<th>موجه إلى</th>' : '') +
        '<th>تاريخ الإرسال</th><th>الحالة</th><th>الرد وتاريخه</th><th>مدة الاستجابة</th><th></th></tr></thead><tbody>' +
        items.map(function (it) {
          const td = turnaround(it);
          return '<tr><td class="num small"><b>' + esc(it.ref || '') + '</b>' +
            (it.docCode ? '<div class="muted" style="font-size:10px;color:var(--accent2)">' + esc(it.docCode) + '</div>' : '') + '</td>' +
            '<td style="max-width:280px">' + esc(it.title) +
            (it.question ? '<div class="small muted">' + esc(it.question) + '</div>' : '') + '</td>' +
            '<td class="small">' + esc(contractorName(ctx, it.contractorId)) + '</td>' +
            (isRfp ? '<td class="small">' + (it.to === 'owner' ? '👁 المالك' : '📐 الاستشاري') + '</td>' : '') +
            '<td class="small muted num">' + esc(it.date) + '</td>' +
            '<td>' + pill(it.status) + '</td>' +
            '<td class="small" style="max-width:260px">' + (it.answer ? '<span style="color:var(--ok)">' + esc(it.answer) + '</span>' +
              (it.signature ? '<div class="sig">✍️ ' + esc(it.signature) + ' · ' + esc(it.signDate) + '</div>' : '') : '<span class="muted">—</span>') + '</td>' +
            '<td class="num small">' + (td != null
              ? '<b>' + td + '</b> يوم'
              : it.status === 'open'
                ? (function () {
                    const d = daysSince(it.date) || 0;
                    return d > SLA_DAYS
                      ? '<span class="pill p-danger" style="font-size:10px">⏰ بلا رد منذ ' + d + ' يوم</span>'
                      : '<span class="muted">بانتظار الرد منذ ' + d + ' يوم</span>';
                  })()
                : '<span class="muted">—</span>') + '</td>' +
            '<td>' + (canAnswer && it.status === 'open' ? '<button class="btn sm" data-ans="' + it.id + '">↩️ رد</button>' : '') + '</td></tr>';
        }).join('') + '</tbody></table></div>'
        : '<div class="empty"><div class="e-ico">📭</div>لا سجلات — أرسل أول ' + (isRfp ? 'RFP' : 'RFI') + '</div>') +
      '</div>';

    el.querySelectorAll('[data-xtab]').forEach(function (t) {
      t.addEventListener('click', function () { rfxState.tab = t.getAttribute('data-xtab'); renderRfx(el, ctx); });
    });
    el.querySelector('#rx-csv').addEventListener('click', function () {
      exportCsv(isRfp ? 'bassir-rfp.csv' : 'bassir-rfi.csv',
        ['المرجع', 'الكود', 'الموضوع', 'من', 'موجه إلى', 'تاريخ الإرسال', 'الحالة', 'الرد', 'وقّعه', 'تاريخ الرد', 'مدة الاستجابة (يوم)'],
        items.map(function (it) {
          return [it.ref || '', it.docCode || '', it.title, contractorName(ctx, it.contractorId),
            isRfp ? (it.to === 'owner' ? 'المالك' : 'الاستشاري') : 'الاستشاري',
            it.date, it.status, it.answer || '', it.signature || '', it.signDate || '',
            turnaround(it) != null ? turnaround(it) : ''];
        }));
    });
    el.querySelector('#rx-add').addEventListener('click', function () {
      const m = modal(
        '<h3>➕ إرسال ' + (isRfp ? 'طلب عرض RFP' : 'استفسار RFI') + '</h3>' +
        (ctx.U.role !== 'contractor' ?
          '<label class="fl">باسم المقاول</label><select class="inp" id="rx-cont">' +
          ctx.S.contractors.map(function (c) { return '<option value="' + c.id + '">' + esc(c.name) + '</option>'; }).join('') + '</select>' : '') +
        (isRfp ? '<label class="fl">موجه إلى</label><select class="inp" id="rx-to"><option value="consultant">📐 الاستشاري</option><option value="owner">👁 المالك</option></select>' : '') +
        '<label class="fl">المرجع</label><input class="inp num" id="rx-ref" placeholder="' + (isRfp ? 'RFP-001' : 'RFI-001') + '">' +
        '<label class="fl">الموضوع</label><input class="inp" id="rx-title">' +
        '<label class="fl">' + (isRfp ? 'تفاصيل العرض / الطلب' : 'نص الاستفسار') + '</label><textarea class="inp" id="rx-q" rows="4"></textarea>' +
        '<label class="fl">مرفق (اختياري)</label><input class="inp" id="rx-file" type="file">' +
        '<div class="m-actions"><button class="btn" id="rx-ok">إرسال</button><button class="btn mutedb" id="rx-cancel">إلغاء</button></div>'
      );
      m.querySelector('#rx-cancel').addEventListener('click', function () { m.remove(); });
      m.querySelector('#rx-ok').addEventListener('click', async function () {
        const title = m.querySelector('#rx-title').value.trim();
        if (!title) { toast('أدخل الموضوع', true); return; }
        const data = {
          ref: m.querySelector('#rx-ref').value || (isRfp ? 'RFP-' : 'RFI-') + Math.floor(Math.random() * 900 + 100),
          title: title, question: m.querySelector('#rx-q').value, status: 'open'
        };
        const cs = m.querySelector('#rx-cont');
        if (cs) data.contractorId = cs.value;
        if (isRfp) data.to = m.querySelector('#rx-to').value;
        const rf = m.querySelector('#rx-file').files[0];
        if (rf) data.file = await Api.upload(rf);
        try {
          await Api.create(tab, data);
          m.remove(); toast('✅ أُرسل وسُجّل بانتظار الرد'); ctx.refresh();
        } catch (e) { toast(e.message, true); }
      });
    });
    el.querySelectorAll('[data-ans]').forEach(function (b) {
      b.addEventListener('click', function () {
        const it = items.find(function (x) { return x.id === b.getAttribute('data-ans'); });
        const m = modal(
          '<h3>↩️ الرد على: ' + esc(it.title) + '</h3>' +
          '<div class="m-sub">' + esc(it.ref || '') + ' · من ' + esc(contractorName(ctx, it.contractorId)) + ' · أُرسل ' + esc(it.date) + '</div>' +
          (it.question ? '<div class="card" style="padding:12px;margin-bottom:8px"><div class="small">' + esc(it.question) + '</div></div>' : '') +
          '<label class="fl">نص الرد (يُوثق بتوقيعك وتاريخه)</label><textarea class="inp" id="an-text" rows="4"></textarea>' +
          '<div class="m-actions"><button class="btn" id="an-ok">اعتماد الرد وتوقيعه</button><button class="btn mutedb" id="an-cancel">إلغاء</button></div>'
        );
        m.querySelector('#an-cancel').addEventListener('click', function () { m.remove(); });
        m.querySelector('#an-ok').addEventListener('click', async function () {
          const txt = m.querySelector('#an-text').value.trim();
          if (!txt) { toast('اكتب الرد أولاً', true); return; }
          try {
            await Api.update(tab, it.id, {
              answer: txt, status: 'answered',
              signature: ctx.U.name, signDate: new Date().toISOString().slice(0, 10)
            });
            m.remove(); toast('✅ سُجّل الرد ووُقّع وأُشعر المرسل'); ctx.refresh();
          } catch (e) { toast(e.message, true); }
        });
      });
    });
  }

  // ============ 3) أوامر التغيير والتعديلات: أثر التكلفة والمدة ودورة الاعتماد ============
  function renderVariations(el, ctx) {
    const items = (ctx.S.changeOrders || []).slice().sort(function (a, b) {
      return (a.status === 'pending' ? 0 : 1) - (b.status === 'pending' ? 0 : 1);
    });
    const canReview = ['consultant', 'admin'].indexOf(ctx.U.role) !== -1;
    const appr = items.filter(function (x) { return x.status === 'approved' || x.status === 'approved_notes'; });
    const pend = items.filter(function (x) { return x.status === 'pending'; });
    const costAppr = appr.reduce(function (a, b) { return a + (b.amount || 0); }, 0);
    const costPend = pend.reduce(function (a, b) { return a + (b.amount || 0); }, 0);
    const daysAppr = appr.reduce(function (a, b) { return a + (b.days || 0); }, 0);
    const P = ctx.S.projects[0] || {};
    const budget = P.budgetPlanned || 0;

    function stageChips(it) {
      const done = it.status !== 'pending';
      const ok = it.status === 'approved' || it.status === 'approved_notes';
      return '<div class="flex" style="gap:4px;flex-wrap:wrap">' +
        '<span class="pill p-ok" style="font-size:10px">1. مُقدَّم ✓</span>' +
        '<span class="pill ' + (done ? 'p-ok' : 'p-warn') + '" style="font-size:10px">2. مراجعة الاستشاري' + (done ? ' ✓' : '...') + '</span>' +
        '<span class="pill ' + (!done ? 'p-muted' : ok ? 'p-ok' : 'p-danger') + '" style="font-size:10px">3. ' + (!done ? 'القرار' : ok ? 'معتمد ✓' : 'مرفوض ✗') + '</span>' +
        '</div>';
    }

    el.innerHTML =
      '<div class="grid g4 mb">' +
      '<div class="card kpi k-warn"><div class="lbl">قيد الاعتماد</div><div class="val num">' + pend.length + '</div><div class="sub">بقيمة ' + money(costPend) + '</div></div>' +
      '<div class="card kpi ' + (costAppr > 0 ? 'k-danger' : 'k-ok') + '"><div class="lbl">أثر التكلفة المعتمد</div><div class="val">' + money(costAppr) + '</div>' +
      '<div class="sub num">' + (budget ? (costAppr / budget * 100).toFixed(1) + '% من الميزانية' : '—') + '</div></div>' +
      '<div class="card kpi ' + (daysAppr ? 'k-warn' : 'k-ok') + '"><div class="lbl">أثر الجدول الزمني المعتمد</div><div class="val num">+' + daysAppr + '</div><div class="sub">يوم تمديد إجمالي</div></div>' +
      '<div class="card kpi k-info"><div class="lbl">إجمالي الأوامر</div><div class="val num">' + items.length + '</div><div class="sub">معتمد: <b class="num">' + appr.length + '</b></div></div>' +
      '</div>' +

      '<div class="card"><div class="flex" style="justify-content:space-between;flex-wrap:wrap">' +
      '<h3 style="margin:0 0 8px">🔁 أوامر التغيير وطلبات التعديل <span class="hint">دورة اعتماد كاملة مع تتبع أثر التكلفة والجدول الزمني</span></h3>' +
      '<button class="btn ghost sm" id="vr-csv">📥 تصدير CSV</button></div>' +
      (items.length ?
        '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
        '<th>المرجع</th><th>الوصف</th><th>الجهة</th><th>أثر التكلفة</th><th>أثر المدة</th><th>دورة الاعتماد</th><th>القرار</th><th></th></tr></thead><tbody>' +
        items.map(function (it) {
          return '<tr><td class="num small"><b>' + esc(it.ref || '') + '</b>' +
            (it.docCode ? '<div class="muted" style="font-size:10px;color:var(--accent2)">' + esc(it.docCode) + '</div>' : '') + '</td>' +
            '<td style="max-width:260px">' + esc(it.title) + '<div class="small muted num">' + esc(it.date || '') + '</div></td>' +
            '<td class="small">' + esc(contractorName(ctx, it.contractorId)) + '</td>' +
            '<td>' + money(it.amount) + '</td>' +
            '<td class="num small">+' + (it.days || 0) + ' يوم</td>' +
            '<td>' + stageChips(it) + '</td>' +
            '<td class="small" style="max-width:200px">' + (it.notes ? esc(it.notes) : '<span class="muted">—</span>') +
            (it.signature ? '<div class="sig">✍️ ' + esc(it.signature) + ' · ' + esc(it.signDate) + '</div>' : '') + '</td>' +
            '<td><div class="flex" style="gap:6px">' + window.DrawingViewer.btn(it) +
            (canReview && it.status === 'pending' ? '<button class="btn sm" data-vrev="' + it.id + '">✍️ قرار</button>' : '') + '</div></td></tr>';
        }).join('') + '</tbody></table></div>'
        : '<div class="empty"><div class="e-ico">🔁</div>لا أوامر تغيير بعد</div>') +
      '</div>';

    el.querySelector('#vr-csv').addEventListener('click', function () {
      exportCsv('bassir-variations.csv',
        ['المرجع', 'الكود', 'الوصف', 'الجهة', 'أثر التكلفة (ر.س)', 'أثر المدة (يوم)', 'التاريخ', 'الحالة', 'القرار', 'وقّعه'],
        items.map(function (it) {
          return [it.ref || '', it.docCode || '', it.title, contractorName(ctx, it.contractorId),
            it.amount || 0, it.days || 0, it.date || '', it.status, it.notes || '', it.signature || ''];
        }));
    });
    el.querySelectorAll('[data-vrev]').forEach(function (b) {
      b.addEventListener('click', function () {
        const it = items.find(function (x) { return x.id === b.getAttribute('data-vrev'); });
        const m = modal(
          '<h3>✍️ قرار أمر التغيير: ' + esc(it.title) + '</h3>' +
          '<div class="m-sub">أثر التكلفة ' + money(it.amount) + ' · أثر المدة +' + (it.days || 0) + ' يوم</div>' +
          '<label class="fl">القرار</label><select class="inp" id="vr-status">' +
          '<option value="approved">✅ اعتماد</option><option value="approved_notes">📝 اعتماد مع ملاحظات</option>' +
          '<option value="rejected">❌ رفض وإرجاع</option></select>' +
          '<label class="fl">الملاحظات</label><textarea class="inp" id="vr-notes" rows="3"></textarea>' +
          '<div class="m-actions"><button class="btn" id="vr-ok">تأكيد وتوقيع</button><button class="btn mutedb" id="vr-cancel">إلغاء</button></div>'
        );
        m.querySelector('#vr-cancel').addEventListener('click', function () { m.remove(); });
        m.querySelector('#vr-ok').addEventListener('click', async function () {
          try {
            await Api.review({ collection: 'changeOrders', id: it.id, status: m.querySelector('#vr-status').value, notes: m.querySelector('#vr-notes').value });
            m.remove(); toast('✅ سُجّل القرار وانعكس أثره على المؤشرات'); ctx.refresh();
          } catch (e) { toast(e.message, true); }
        });
      });
    });
    el.querySelectorAll('[data-dview]').forEach(function (b) {
      b.addEventListener('click', function () {
        const it = items.find(function (x) { return x.id === b.getAttribute('data-dview'); });
        if (it) window.DrawingViewer.open(ctx, 'changeOrders', it, { canEdit: canReview, canReview: canReview && it.status === 'pending' });
      });
    });
  }

  // ============ 4) قاعدة بيانات المقاولين: بيانات الشركات والوثائق القانونية ============
  function renderContractorDb(el, ctx) {
    const canEdit = ['consultant', 'admin'].indexOf(ctx.U.role) !== -1;
    const list = ctx.S.contractors || [];

    function chips(arr, cls) {
      if (!arr || !arr.length) return '<span class="muted small">—</span>';
      return arr.map(function (x) { return '<span class="pill ' + (cls || 'p-muted') + '" style="font-size:10.5px;margin:2px">' + esc(x) + '</span>'; }).join(' ');
    }

    el.innerHTML =
      '<div class="card mb"><h3>🗃️ قاعدة بيانات المقاولين <span class="hint">بيانات الشركة كاملة: العنوان، مسؤول التواصل، السجل التجاري، الرخص والشهادات والوثائق القانونية</span></h3></div>' +
      '<div class="grid g2">' +
      list.map(function (c) {
        const d = VS.discOf(ctx, c.type);
        return '<div class="card"><div class="flex" style="justify-content:space-between">' +
          '<h3 style="margin:0">' + d.icon + ' ' + esc(c.name) + '</h3>' +
          (canEdit ? '<button class="btn ghost sm" data-cedit="' + c.id + '">✏️ تحديث البيانات</button>' : '') + '</div>' +
          '<div class="grid g2 small" style="gap:8px;margin-top:12px">' +
          '<div>🏷️ التخصص: <b>' + esc(d.name) + '</b></div>' +
          '<div>📄 السجل التجاري: <b class="num">' + esc(c.crNumber || '—') + '</b></div>' +
          '<div>📍 العنوان: ' + esc(c.address || '—') + '</div>' +
          '<div>👤 مسؤول التواصل: <b>' + esc(c.contactPerson || '—') + '</b></div>' +
          '<div>📞 الهاتف: <b class="num" dir="ltr">' + esc(c.phone || '—') + '</b></div>' +
          '<div>📧 البريد: <b class="num" dir="ltr">' + esc(c.email || '—') + '</b></div>' +
          '<div>💰 قيمة العقد: ' + money(c.contractValue) + '</div>' +
          '<div>🗓️ المدة: <span class="num">' + esc(c.startDate || '') + ' ← ' + esc(c.endDate || '') + '</span></div>' +
          '</div>' +
          '<div class="small mt"><b>🪪 الرخص:</b> ' + chips(c.licenses, 'p-info') + '</div>' +
          '<div class="small mt"><b>🎖️ الشهادات والتصنيفات:</b> ' + chips(c.certifications, 'p-ok') + '</div>' +
          '<div class="small mt"><b>⚖️ الوثائق القانونية:</b> ' + chips(c.legalDocs) + '</div>' +
          '</div>';
      }).join('') + '</div>' +
      (!list.length ? '<div class="empty"><div class="e-ico">🗃️</div>لا مقاولون بعد — أضفهم من صفحة إدارة المقاولين</div>' : '');

    el.querySelectorAll('[data-cedit]').forEach(function (b) {
      b.addEventListener('click', function () {
        const c = list.find(function (x) { return x.id === b.getAttribute('data-cedit'); });
        const m = modal(
          '<h3>✏️ بيانات الشركة: ' + esc(c.name) + '</h3>' +
          '<div class="grid g2"><div><label class="fl">العنوان</label><input class="inp" id="ce-address" value="' + esc(c.address || '') + '"></div>' +
          '<div><label class="fl">مسؤول التواصل</label><input class="inp" id="ce-contact" value="' + esc(c.contactPerson || '') + '"></div></div>' +
          '<div class="grid g2"><div><label class="fl">الهاتف</label><input class="inp num" id="ce-phone" value="' + esc(c.phone || '') + '"></div>' +
          '<div><label class="fl">البريد الإلكتروني</label><input class="inp num" id="ce-email" dir="ltr" value="' + esc(c.email || '') + '"></div></div>' +
          '<label class="fl">رقم السجل التجاري</label><input class="inp num" id="ce-cr" value="' + esc(c.crNumber || '') + '">' +
          '<label class="fl">الرخص (سطر لكل رخصة)</label><textarea class="inp" id="ce-lic" rows="2">' + esc((c.licenses || []).join('\n')) + '</textarea>' +
          '<label class="fl">الشهادات والتصنيفات (سطر لكل شهادة)</label><textarea class="inp" id="ce-cert" rows="2">' + esc((c.certifications || []).join('\n')) + '</textarea>' +
          '<label class="fl">الوثائق القانونية (سطر لكل وثيقة)</label><textarea class="inp" id="ce-legal" rows="2">' + esc((c.legalDocs || []).join('\n')) + '</textarea>' +
          '<div class="m-actions"><button class="btn" id="ce-ok">حفظ البيانات</button><button class="btn mutedb" id="ce-cancel">إلغاء</button></div>'
        );
        m.querySelector('#ce-cancel').addEventListener('click', function () { m.remove(); });
        m.querySelector('#ce-ok').addEventListener('click', async function () {
          try {
            await Api.update('contractors', c.id, {
              address: m.querySelector('#ce-address').value,
              contactPerson: m.querySelector('#ce-contact').value,
              phone: m.querySelector('#ce-phone').value,
              email: m.querySelector('#ce-email').value,
              crNumber: m.querySelector('#ce-cr').value,
              licenses: m.querySelector('#ce-lic').value.split('\n').filter(Boolean),
              certifications: m.querySelector('#ce-cert').value.split('\n').filter(Boolean),
              legalDocs: m.querySelector('#ce-legal').value.split('\n').filter(Boolean)
            });
            m.remove(); toast('✅ حُدثت بيانات الشركة'); ctx.refresh();
          } catch (e) { toast(e.message, true); }
        });
      });
    });
  }

  // ============ 5) خادم الملفات المركزي: تخزين آمن، نسخ، واسترجاع ============
  const fsState = { q: '', cat: 'all' };
  const DOC_CATEGORIES = ['العقود', 'جداول الكميات BOQ', 'التصاميم الأولية', 'مخططات IFC', 'المواصفات', 'متطلبات المالك', 'وثائق فنية', 'تقارير', 'أخرى'];

  function renderFileServer(el, ctx) {
    const files = (ctx.S.files || []).filter(function (f) {
      if (fsState.cat !== 'all' && (f.category || 'أخرى') !== fsState.cat) return false;
      if (fsState.q) {
        const hay = ((f.name || '') + ' ' + (f.docCode || '') + ' ' + (f.by || '')).toLowerCase();
        if (hay.indexOf(fsState.q.toLowerCase()) === -1) return false;
      }
      return true;
    });
    const totalSize = (ctx.S.files || []).reduce(function (a, f) { return a + (f.size || 0); }, 0);
    const totalVers = (ctx.S.files || []).reduce(function (a, f) { return a + (f.versions || []).length; }, 0);
    const isAdmin = ctx.U.role === 'admin';

    el.innerHTML =
      '<div class="grid g4 mb">' +
      '<div class="card kpi"><div class="lbl">الملفات المخزنة</div><div class="val num">' + (ctx.S.files || []).length + '</div><div class="sub">تخزين مركزي آمن ومُكوَّد</div></div>' +
      '<div class="card kpi k-info"><div class="lbl">الحجم الإجمالي</div><div class="val num" style="font-size:20px">' + fmtSize(totalSize) + '</div><div class="sub">يدعم ملفات BIM حتى 500MB</div></div>' +
      '<div class="card kpi k-ok"><div class="lbl">نسخ الإصدارات المؤرشفة</div><div class="val num">' + totalVers + '</div><div class="sub">تاريخ نسخ كامل بلا تكرار ملفات</div></div>' +
      '<div class="card kpi ' + (isAdmin ? 'k-warn' : '') + '"><div class="lbl">النسخ الاحتياطي</div><div class="val" style="font-size:16px">' +
      (isAdmin ? '<button class="btn sm" id="fs-backup">🛡 نسخة احتياطية الآن</button>' : '<span class="small muted">يديره الأدمن</span>') + '</div>' +
      '<div class="sub" id="fs-backups-info">نسخ كاملة لقاعدة البيانات</div></div>' +
      '</div>' +

      '<div class="card"><div class="flex" style="justify-content:space-between;flex-wrap:wrap;margin-bottom:12px">' +
      '<h3 style="margin:0">🗄️ خادم الملفات المركزي <span class="hint">استرجاع سهل، سجل نسخ لكل ملف، وتنظيم بالفئات</span></h3>' +
      '<div class="flex"><input class="inp" id="fs-upfile" type="file" style="max-width:220px">' +
      '<select class="inp" id="fs-upcat" style="max-width:170px">' +
      DOC_CATEGORIES.map(function (c) { return '<option>' + c + '</option>'; }).join('') + '</select>' +
      '<button class="btn sm" id="fs-up">⬆ رفع للخادم</button></div></div>' +
      '<div class="grid" style="grid-template-columns:2fr 1fr;gap:10px;margin-bottom:14px">' +
      '<input class="inp" id="fs-q" placeholder="🔍 بحث بالاسم أو الكود أو الرافع..." value="' + esc(fsState.q) + '">' +
      '<select class="inp" id="fs-cat"><option value="all">كل الفئات</option>' +
      DOC_CATEGORIES.map(function (c) {
        const n = (ctx.S.files || []).filter(function (f) { return (f.category || 'أخرى') === c; }).length;
        return n ? '<option' + (fsState.cat === c ? ' selected' : '') + '>' + c + '</option>' : '';
      }).join('') + '</select></div>' +
      (files.length ?
        '<div class="tbl-wrap" style="max-height:55vh;overflow-y:auto"><table class="tbl"><thead><tr>' +
        '<th>الكود</th><th>الملف</th><th>الفئة</th><th>الحجم</th><th>رفعه</th><th>التاريخ</th><th>النسخ</th><th></th></tr></thead><tbody>' +
        files.map(function (f, i) {
          const nv = (f.versions || []).length;
          return '<tr><td class="num small" style="white-space:nowrap"><b style="color:var(--accent2)">' + esc(f.docCode || '—') + '</b></td>' +
            '<td class="small" style="max-width:260px;direction:ltr;text-align:right">📎 ' + esc(f.name || '') + '</td>' +
            '<td class="small"><span class="pill p-muted">' + esc(f.category || 'أخرى') + '</span></td>' +
            '<td class="small num">' + fmtSize(f.size) + '</td>' +
            '<td class="small">' + esc(f.by || '—') + '</td>' +
            '<td class="small muted num">' + esc(f.date || '') + '</td>' +
            '<td class="num small">' + (nv ? '<button class="btn ghost sm" data-vers="' + i + '">🗂 ' + (nv + 1) + '</button>' : '1') + '</td>' +
            '<td><div class="flex" style="gap:6px">' +
            (f.url ? '<a class="btn ghost sm" href="' + esc(f.url) + '" target="_blank">⬇ تحميل</a>' : '') +
            '<button class="btn mutedb sm" data-newver="' + i + '">⬆ نسخة جديدة</button></div></td></tr>';
        }).join('') + '</tbody></table></div>'
        : '<div class="empty"><div class="e-ico">🗄️</div>لا ملفات مطابقة — ارفع أول ملف للخادم المركزي</div>') +
      '<input type="file" id="fs-verfile" style="display:none">' +
      '</div>';

    el.querySelector('#fs-cat').addEventListener('change', function (e) { fsState.cat = e.target.value; renderFileServer(el, ctx); });
    const q = el.querySelector('#fs-q');
    q.addEventListener('input', function () {
      fsState.q = q.value; renderFileServer(el, ctx);
      const q2 = el.querySelector('#fs-q'); q2.focus(); q2.setSelectionRange(q2.value.length, q2.value.length);
    });

    el.querySelector('#fs-up').addEventListener('click', async function () {
      const f = el.querySelector('#fs-upfile').files[0];
      if (!f) { toast('اختر ملفاً أولاً', true); return; }
      try {
        await Api.upload(f, { category: el.querySelector('#fs-upcat').value });
        toast('✅ رُفع الملف وكُوّد وأُدرج في الخادم المركزي'); ctx.refresh();
      } catch (e) { toast(e.message, true); }
    });

    // نسخة جديدة لملف قائم: تؤرشف السابقة في versions بلا سجل مكرر
    let verTarget = null;
    const verInput = el.querySelector('#fs-verfile');
    el.querySelectorAll('[data-newver]').forEach(function (b) {
      b.addEventListener('click', function () { verTarget = files[Number(b.getAttribute('data-newver'))]; verInput.click(); });
    });
    verInput.addEventListener('change', async function () {
      const f = verInput.files[0];
      if (!f || !verTarget) return;
      try {
        await Api.upload(f, { versionOf: verTarget.id });
        toast('✅ رُفعت نسخة جديدة — القديمة مؤرشفة في سجل النسخ'); ctx.refresh();
      } catch (e) { toast(e.message, true); }
    });

    el.querySelectorAll('[data-vers]').forEach(function (b) {
      b.addEventListener('click', function () {
        const f = files[Number(b.getAttribute('data-vers'))];
        modal(
          '<h3>🗂 سجل نسخ الملف</h3><div class="m-sub num">' + esc(f.docCode || '') + '</div>' +
          '<div class="card" style="padding:12px">' +
          '<div class="flex" style="justify-content:space-between"><b class="small" style="direction:ltr">📎 ' + esc(f.name) + '</b><span class="pill p-ok">الحالية</span></div>' +
          '<div class="small muted num">' + esc(f.date || '') + ' · ' + fmtSize(f.size) + ' · ' + esc(f.by || '') + '</div></div>' +
          (f.versions || []).slice().reverse().map(function (v) {
            return '<div class="card" style="padding:12px;margin-top:8px">' +
              '<div class="flex" style="justify-content:space-between"><b class="small" style="direction:ltr">📎 ' + esc(v.name) + '</b><span class="pill p-muted">نسخة ' + v.v + '</span></div>' +
              '<div class="small muted num">' + esc(v.date || '') + ' · ' + fmtSize(v.size) + ' · ' + esc(v.by || '') + '</div>' +
              (v.url ? '<a class="btn ghost sm" style="margin-top:6px" href="' + esc(v.url) + '" target="_blank">⬇ استرجاع هذه النسخة</a>' : '') + '</div>';
          }).join('') +
          '<div class="m-actions"><button class="btn mutedb" onclick="this.closest(\'.modal-back\').remove()">إغلاق</button></div>'
        );
      });
    });

    if (isAdmin) {
      el.querySelector('#fs-backup').addEventListener('click', async function () {
        try {
          const r = await Api.backup();
          toast('🛡 أُنشئت نسخة احتياطية كاملة: ' + (r.file || ''));
          loadBackups();
        } catch (e) { toast(e.message, true); }
      });
      function loadBackups() {
        Api.backups().then(function (list) {
          const info = el.querySelector('#fs-backups-info');
          if (info && list.length) info.innerHTML = '<b class="num">' + list.length + '</b> نسخة — آخرها ' + esc(list[0].date || '');
        }).catch(function () { /* تجاهل */ });
      }
      loadBackups();
    }
  }

  // ============ 6) وثائق المشروع: مستودع لكل مشروع حسب الفئة ============
  const pdState = { cat: null };
  const CAT_ICONS = { 'العقود': '📜', 'جداول الكميات BOQ': '📊', 'التصاميم الأولية': '🎨', 'مخططات IFC': '📐', 'المواصفات': '📘', 'متطلبات المالك': '👁', 'وثائق فنية': '🔧', 'تقارير': '📝', 'أخرى': '📎' };

  function renderProjectDocs(el, ctx) {
    const P = ctx.S.projects[0] || {};
    const files = ctx.S.files || [];
    const byCat = {};
    DOC_CATEGORIES.forEach(function (c) { byCat[c] = []; });
    files.forEach(function (f) { (byCat[f.category || 'أخرى'] = byCat[f.category || 'أخرى'] || []).push(f); });
    const canUp = ctx.U.role !== 'owner';

    const sel = pdState.cat;
    el.innerHTML =
      '<div class="card mb"><h3>📁 وثائق المشروع: ' + esc(P.name || '') + ' <span class="hint">مستودع مستندات هذا المشروع — كل ما يخصه في مكان واحد مُكوَّد</span></h3>' +
      (canUp ? '<div class="flex mt"><input class="inp" id="pd2-file" type="file" style="max-width:240px">' +
        '<select class="inp" id="pd2-cat" style="max-width:190px">' +
        DOC_CATEGORIES.map(function (c) { return '<option' + (sel === c ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select>' +
        '<button class="btn sm" id="pd2-up">⬆ إضافة للمستودع</button></div>' : '') + '</div>' +

      '<div class="grid" style="grid-template-columns:repeat(3,1fr);gap:12px" class="mb">' +
      DOC_CATEGORIES.map(function (c) {
        const n = (byCat[c] || []).length;
        return '<div class="card" data-pcat="' + esc(c) + '" style="cursor:pointer;padding:16px;border-color:' + (sel === c ? 'var(--accent)' : 'var(--border)') + '">' +
          '<div class="flex" style="justify-content:space-between"><b>' + (CAT_ICONS[c] || '📎') + ' ' + esc(c) + '</b>' +
          '<span class="pill ' + (n ? 'p-info' : 'p-muted') + ' num">' + n + '</span></div></div>';
      }).join('') + '</div>' +

      (sel ?
        '<div class="card mt"><h3>' + (CAT_ICONS[sel] || '📎') + ' ' + esc(sel) + '</h3>' +
        ((byCat[sel] || []).length ?
          '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>الكود</th><th>الملف</th><th>الحجم</th><th>رفعه</th><th>التاريخ</th><th>النسخ</th><th></th></tr></thead><tbody>' +
          byCat[sel].map(function (f) {
            return '<tr><td class="num small"><b style="color:var(--accent2)">' + esc(f.docCode || '—') + '</b></td>' +
              '<td class="small" style="direction:ltr;text-align:right">📎 ' + esc(f.name || '') + '</td>' +
              '<td class="small num">' + fmtSize(f.size) + '</td>' +
              '<td class="small">' + esc(f.by || '—') + '</td>' +
              '<td class="small muted num">' + esc(f.date || '') + '</td>' +
              '<td class="num small">' + ((f.versions || []).length + 1) + '</td>' +
              '<td>' + (f.url ? '<a class="btn ghost sm" href="' + esc(f.url) + '" target="_blank">⬇ تحميل</a>' : '') + '</td></tr>';
          }).join('') + '</tbody></table></div>'
          : '<div class="empty"><div class="e-ico">📁</div>لا وثائق في هذه الفئة بعد</div>') + '</div>'
        : '<div class="small muted mt">اختر فئة لعرض وثائقها</div>');

    el.querySelectorAll('[data-pcat]').forEach(function (c) {
      c.addEventListener('click', function () {
        pdState.cat = pdState.cat === c.getAttribute('data-pcat') ? null : c.getAttribute('data-pcat');
        renderProjectDocs(el, ctx);
      });
    });
    const up = el.querySelector('#pd2-up');
    if (up) up.addEventListener('click', async function () {
      const f = el.querySelector('#pd2-file').files[0];
      if (!f) { toast('اختر ملفاً أولاً', true); return; }
      try {
        await Api.upload(f, { category: el.querySelector('#pd2-cat').value });
        toast('✅ أُضيف للمستودع وكُوّد تلقائياً'); ctx.refresh();
      } catch (e) { toast(e.message, true); }
    });
  }

  // ============ 7) BIM: النماذج (سحابي/من الجهاز) + الوثائق بالقوالب + ربط الكاميرات ============
  const bimState = { tab: 'models' };
  const BIM_KINDS = { bep: 'خطة تنفيذ BIM (BEP)', midp: 'خطة تسليم المعلومات (MIDP)', clash: 'تقرير اكتشاف التعارضات', closeout: 'تقرير الإغلاق (Close-Out)', other: 'وثيقة BIM أخرى' };
  const BIM_TEMPLATES = {
    bep: {
      title: 'خطة تنفيذ الـBIM',
      sections: {
        'أهداف الـBIM': 'التنسيق بين التخصصات، اكتشاف التعارضات قبل التنفيذ، استخراج الكميات، وربط النموذج بالجدول الزمني (4D) والتكلفة (5D).',

  function renderBim(el, ctx) {
    const tab = bimState.tab;
    el.innerHTML =
      '<div class="tabs">' +
      '<div class="tab ' + (tab === 'models' ? 'active' : '') + '" data-btab="models">🏢 نماذج BIM</div>' +
      '<div class="tab ' + (tab === 'docs' ? 'active' : '') + '" data-btab="docs">📚 وثائق BIM (قوالب)</div>' +
      '<div class="tab ' + (tab === 'cams' ? 'active' : '') + '" data-btab="cams">🎥 ربط الكاميرات بالنموذج</div>' +
      '</div><div id="bim-body"></div>';
    el.querySelectorAll('[data-btab]').forEach(function (t) {
      t.addEventListener('click', function () { bimState.tab = t.getAttribute('data-btab'); renderBim(el, ctx); });
    });
    const body = el.querySelector('#bim-body');
    if (tab === 'models') renderBimModels(body, ctx);
    else if (tab === 'docs') renderBimDocs(body, ctx);
    else renderBimCams(body, ctx);
  }

  // ============ 8) لوحة اختيار المشروع: كل المشاريع وفتح أي منها ============
  function renderProjectsDash(el, ctx) {
    const projects = (ctx.Sall || ctx.S).projects;
    const Sall = ctx.Sall || ctx.S;

    function countFor(pid, col, pred) {
      return (Sall[col] || []).filter(function (x) {
        return (!x.projectId || x.projectId === pid) && (!pred || pred(x));
      }).length;
    }

    el.innerHTML =
      '<div class="card mb"><h3>🗂️ لوحة المشاريع <span class="hint">اختر المشروع لتعمل عليه — كل الصفحات والبيانات تتبع المشروع المحدد</span></h3></div>' +
      '<div class="grid g2">' +
      projects.map(function (p) {
        const active = ctx.projectId === p.id;
        const nCont = countFor(p.id, 'contractors');
        const nPend = ['shopDrawings', 'materials', 'scheduleSubmittals', 'wirs', 'changeOrders', 'payments']
          .reduce(function (a, c) { return a + countFor(p.id, c, function (x) { return x.status === 'pending'; }); }, 0);
        const nFiles = countFor(p.id, 'files');
        const prog = p.progressActual || 0;
        return '<div class="card" style="border-color:' + (active ? 'var(--accent)' : 'var(--border)') + '">' +
          '<div class="flex" style="justify-content:space-between">' +
          '<h3 style="margin:0">🏗️ ' + esc(p.name) + '</h3>' +
          (active ? '<span class="pill p-ok">المشروع الحالي ✓</span>' : '<button class="btn sm" data-selproj="' + p.id + '">فتح والعمل عليه ←</button>') + '</div>' +
          '<div class="small muted" style="margin:8px 0">' + esc(p.location || '—') + ' · 👨‍💼 ' + esc(p.consultantName || 'لم يعيّن استشاري') + '</div>' +
          '<div class="flex" style="gap:8px;margin:10px 0"><div class="bar" style="flex:1"><i style="width:' + prog + '%"></i></div><b class="num small">' + prog + '%</b></div>' +
          '<div class="grid g3 small" style="gap:8px;text-align:center">' +
          '<div class="card" style="padding:10px"><b class="num">' + nCont + '</b><div class="muted" style="font-size:11px">مقاول</div></div>' +
          '<div class="card" style="padding:10px"><b class="num" style="color:' + (nPend ? 'var(--warn)' : 'var(--ok)') + '">' + nPend + '</b><div class="muted" style="font-size:11px">بانتظار الاعتماد</div></div>' +
          '<div class="card" style="padding:10px"><b class="num">' + nFiles + '</b><div class="muted" style="font-size:11px">ملف بالمستودع</div></div>' +
          '</div>' +
          '<div class="small muted mt num">الميزانية: ' + VS.millions(p.budgetPlanned || 0) + (p.startPlanned ? ' · ' + esc(p.startPlanned) + ' ← ' + esc(p.endPlanned || '') : '') + '</div>' +
          '</div>';
      }).join('') + '</div>';

    el.querySelectorAll('[data-selproj]').forEach(function (b) {
      b.addEventListener('click', function () {
        ctx.setProject(b.getAttribute('data-selproj'));
        toast('🏗️ انتقلت للمشروع — كل الصفحات الآن تعرض بياناته');
      });
    });
  }

  window.ViewsModules = {
    renderSubmissions: renderSubmissions,
    renderRfx: renderRfx,
    renderVariations: renderVariations,
    renderContractorDb: renderContractorDb,
    renderFileServer: renderFileServer,
    renderProjectDocs: renderProjectDocs,
    renderBim: renderBim,
    renderProjectsDash: renderProjectsDash
  };
})();


/* ===== public/js/views4.js ===== */
/**
 * بصير | وحدة التسليم والإغلاق + مراحل المشروع + تقارير الحوادث
 * - قائمة تسليم تفاعلية (مستندات + متطلبات نظامية) قابلة للتحديث والرفع
 * - قائمة ملاحظات (Punch List) مرتبطة بالمقاول مع تتبع الإغلاق
 * - سجل الضمانات مع تنبيهات قرب الانتهاء
 * - سجل تسليم المفاتيح
 * - لوحة فترة ضمان العيوب DLP
 * - تقرير تسليم موحّد قابل للطباعة/التصدير PDF (عربي/إنجليزي)
 * - تكوين مراحل المشروع حسب نوعه (قابل للتخصيص)
 * - تقارير حوادث قابلة للأرشفة والطباعة مرتبطة بتنبيهات الكاميرات
 */
(function () {
  'use strict';

  const VS = window.ViewsShared;
  const esc = VS.esc, pill = VS.pill, toast = VS.toast, modal = VS.modal;

  function contractorName(ctx, id) {
    const c = (ctx.Sall || ctx.S).contractors.find(function (x) { return x.id === id; });
    return c ? c.name : id || '—';
  }
  function todayStr() { return new Date().toISOString().slice(0, 10); }
  function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
  function daysFromNow(dateStr) { if (!dateStr) return null; return Math.round((new Date(dateStr) - Date.now()) / 86400000); }

  const HND_STATUS = { pending: ['لم يبدأ', 'p-muted'], in_progress: ['قيد الإنجاز', 'p-warn'], done: ['مكتمل ✓', 'p-ok'], na: ['غير مطلوب', 'p-muted'] };
  function hndPill(s) { const v = HND_STATUS[s] || [s, 'p-muted']; return '<span class="pill ' + v[1] + '">' + esc(v[0]) + '</span>'; }

  // ============ الطباعة/التصدير PDF (نافذة طباعة منسّقة) ============
  function printDoc(title, bodyHtml) {
    const w = window.open('', '_blank');
    if (!w) { toast('اسمح بالنوافذ المنبثقة للطباعة', true); return; }
    w.document.write(
      '<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>' + esc(title) + '</title>' +
      '<style>body{font-family:Tahoma,Arial,sans-serif;color:#111;margin:32px;line-height:1.8}' +
      'h1{font-size:22px;border-bottom:3px solid #0b8457;padding-bottom:8px;color:#0b5}' +
      'h2{font-size:16px;margin-top:22px;color:#0b8457;border-right:4px solid #0b8457;padding-right:10px}' +
      'table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12.5px}' +
      'th,td{border:1px solid #bbb;padding:7px 9px;text-align:right}th{background:#eef6f2}' +
      '.muted{color:#666;font-size:12px}.ok{color:#0b8457;font-weight:700}.bad{color:#c0392b;font-weight:700}' +
      '.head{display:flex;justify-content:space-between;align-items:center}.logo{font-size:26px}' +
      '.badge{display:inline-block;border:1px solid #999;border-radius:20px;padding:2px 10px;font-size:11px}' +
      '@media print{.noprint{display:none}}</style></head><body>' +
      '<div class="head"><div><span class="logo">👁 بصير — عيون المالك</span></div>' +
      '<div class="muted">تاريخ الإصدار: ' + todayStr() + '</div></div>' +
      bodyHtml +
      '<p class="muted" style="margin-top:26px;border-top:1px solid #ccc;padding-top:10px">وثيقة مُصدَّرة آلياً من منصة بصير — Bassir Owner Eyes Platform</p>' +
      '<div class="noprint" style="margin-top:20px"><button onclick="window.print()" style="padding:10px 22px;font-size:14px;cursor:pointer;background:#0b8457;color:#fff;border:0;border-radius:8px">🖨 طباعة / حفظ PDF</button></div>' +
      '</body></html>');
    w.document.close();
  }

  // ============ صفحة التسليم والإغلاق (Handover) ============
  const hoState = { tab: 'checklist' };

  function renderHandover(el, ctx) {
    const tabs = [
      ['checklist', '📋 قائمة التسليم'],
      ['punch', '📌 قائمة الملاحظات'],
      ['warranties', '🛡️ الضمانات'],
      ['keys', '🔑 سجل المفاتيح'],
      ['dlp', '🏁 لوحة DLP'],
      ['report', '📄 تقرير التسليم الموحّد']
    ];
    el.innerHTML =
      '<div class="tabs">' + tabs.map(function (t) {
        return '<div class="tab ' + (hoState.tab === t[0] ? 'active' : '') + '" data-hotab="' + t[0] + '">' + t[1] + '</div>';
      }).join('') + '</div><div id="ho-body"></div>';
    el.querySelectorAll('[data-hotab]').forEach(function (t) {
      t.addEventListener('click', function () { hoState.tab = t.getAttribute('data-hotab'); renderHandover(el, ctx); });
    });
    const body = el.querySelector('#ho-body');
    if (hoState.tab === 'checklist') renderChecklist(body, ctx);
    else if (hoState.tab === 'punch') renderPunch(body, ctx);
    else if (hoState.tab === 'warranties') renderWarranties(body, ctx);
    else if (hoState.tab === 'keys') renderKeys(body, ctx);
    else if (hoState.tab === 'dlp') renderDlp(body, ctx);
    else renderUnifiedReport(body, ctx);
  }

  // ---- قائمة التسليم التفاعلية (مستندات + متطلبات نظامية) ----
  function renderChecklist(el, ctx) {
    const items = ctx.S.handoverItems || [];
    const canEdit = ['consultant', 'admin', 'owner_rep'].indexOf(ctx.U.role) !== -1;
    const groups = [
      ['docs', '📁 المستندات والتسليمات'],
      ['regulatory', '🏛️ المتطلبات النظامية والتشغيلية']
    ];
    const done = items.filter(function (i) { return i.status === 'done'; }).length;
    const pct = items.length ? Math.round(done / items.length * 100) : 0;

    el.innerHTML =
      '<div class="card mb"><div class="flex" style="justify-content:space-between;flex-wrap:wrap">' +
      '<h3 style="margin:0">✅ قائمة التسليم التفاعلية <span class="hint">حدّث حالة كل بند وارفع مستنده داخل المنصة</span></h3>' +
      '<div class="flex" style="gap:8px;align-items:center"><div class="bar" style="width:160px"><i style="width:' + pct + '%"></i></div>' +
      '<b class="num">' + done + '/' + items.length + ' (' + pct + '%)</b></div></div></div>' +
      groups.map(function (g) {
        const gi = items.filter(function (i) { return i.group === g[0]; });
        return '<div class="card mb"><h3>' + g[1] + '</h3>' +
          '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>البند</th><th>المسؤول</th><th>الحالة</th><th>المستند</th><th>ملاحظات</th>' + (canEdit ? '<th></th>' : '') + '</tr></thead><tbody>' +
          gi.map(function (it) {
            return '<tr><td><b>' + esc(it.title) + '</b><div class="small muted" dir="ltr" style="text-align:right">' + esc(it.en || '') + '</div></td>' +
              '<td class="small">' + esc(it.responsible || '—') + '</td>' +
              '<td>' + hndPill(it.status) + '</td>' +
              '<td class="small">' + (it.file
                ? '📎 ' + VS.att(it.file) + ' <button class="btn ghost sm" data-hreview="' + it.id + '">🔍 مراجعة</button>'
                : '<span class="muted">—</span>') + '</td>' +
              '<td class="small" style="max-width:220px">' + esc(it.notes || '') + (it.date ? '<div class="muted num">' + esc(it.date) + '</div>' : '') + '</td>' +
              (canEdit ? '<td><button class="btn ghost sm" data-hedit="' + it.id + '">تحديث</button></td>' : '') +
              '</tr>';
          }).join('') + '</tbody></table></div></div>';
      }).join('');

    // مراجعة مستند التسليم المرفوع داخل المنصة (عارض PDF/صور مع الترميز)
    el.querySelectorAll('[data-hreview]').forEach(function (b) {
      b.addEventListener('click', function () {
        const it = items.find(function (x) { return x.id === b.getAttribute('data-hreview'); });
        if (it && window.DrawingViewer) window.DrawingViewer.open(ctx, 'handoverItems', it, { canEdit: canEdit, canReview: false });
      });
    });

    el.querySelectorAll('[data-hedit]').forEach(function (b) {
      b.addEventListener('click', function () {
        const it = items.find(function (x) { return x.id === b.getAttribute('data-hedit'); });
        const m = modal(
          '<h3>تحديث بند التسليم</h3><div class="m-sub">' + esc(it.title) + '</div>' +
          '<label class="fl">الحالة</label><select class="inp" id="he-status">' +
          Object.keys(HND_STATUS).map(function (k) { return '<option value="' + k + '"' + (it.status === k ? ' selected' : '') + '>' + HND_STATUS[k][0] + '</option>'; }).join('') + '</select>' +
          '<label class="fl">المسؤول</label><input class="inp" id="he-resp" value="' + esc(it.responsible || '') + '">' +
          '<label class="fl">ملاحظات</label><textarea class="inp" id="he-notes" rows="2">' + esc(it.notes || '') + '</textarea>' +
          '<label class="fl">رفع مستند البند</label><input class="inp" id="he-file" type="file">' +
          '<div class="m-actions"><button class="btn" id="he-ok">حفظ</button><button class="btn mutedb" id="he-cancel">إلغاء</button></div>'
        );
        m.querySelector('#he-cancel').addEventListener('click', function () { m.remove(); });
        m.querySelector('#he-ok').addEventListener('click', async function () {
          try {
            const patch = {
              status: m.querySelector('#he-status').value,
              responsible: m.querySelector('#he-resp').value,
              notes: m.querySelector('#he-notes').value,
              date: todayStr()
            };
            const f = m.querySelector('#he-file').files[0];
            if (f) patch.file = await Api.upload(f, { category: 'وثائق فنية' });
            await Api.update('handoverItems', it.id, patch);
            m.remove(); toast('✅ حُدّث بند التسليم'); ctx.refresh();
          } catch (e) { toast(e.message, true); }
        });
      });
    });
  }

  // ---- قائمة الملاحظات (Punch List) ----
  function renderPunch(el, ctx) {
    const items = (ctx.S.punchList || []).slice().sort(function (a, b) { return (a.status === 'open' ? 0 : 1) - (b.status === 'open' ? 0 : 1); });
    const canManage = ['consultant', 'admin'].indexOf(ctx.U.role) !== -1;
    const isContractor = ctx.U.role === 'contractor';
    const open = items.filter(function (x) { return x.status === 'open'; }).length;
    const closed = items.length - open;
    // تجميع حسب المقاول
    const byC = {};
    items.forEach(function (it) { (byC[it.contractorId] = byC[it.contractorId] || []).push(it); });

    el.innerHTML =
      '<div class="grid g4 mb">' +
      '<div class="card kpi"><div class="lbl">إجمالي الملاحظات</div><div class="val num">' + items.length + '</div></div>' +
      '<div class="card kpi ' + (open ? 'k-warn' : 'k-ok') + '"><div class="lbl">مفتوحة</div><div class="val num">' + open + '</div></div>' +
      '<div class="card kpi k-ok"><div class="lbl">مغلقة</div><div class="val num">' + closed + '</div></div>' +
      '<div class="card kpi k-info"><div class="lbl">نسبة الإغلاق</div><div class="val num">' + (items.length ? Math.round(closed / items.length * 100) : 0) + '%</div></div>' +
      '</div>' +
      '<div class="card"><div class="flex" style="justify-content:space-between;flex-wrap:wrap">' +
      '<h3 style="margin:0">📌 قائمة الملاحظات مرتبطة بالمقاول المسؤول <span class="hint">تتبع فتح/إغلاق لكل ملاحظة</span></h3>' +
      '<div class="flex">' + (canManage ? '<button class="btn sm" id="pl-add">➕ ملاحظة جديدة</button>' : '') +
      '<button class="btn ghost sm" id="pl-print">🖨 طباعة القائمة</button></div></div>' +
      Object.keys(byC).map(function (cid) {
        const list = byC[cid];
        const co = list.filter(function (x) { return x.status === 'open'; }).length;
        return '<div style="margin-top:14px"><b>👷 ' + esc(contractorName(ctx, cid)) + '</b> ' +
          '<span class="pill ' + (co ? 'p-warn' : 'p-ok') + '">' + co + ' مفتوحة / ' + list.length + '</span>' +
          '<div class="tbl-wrap" style="margin-top:8px"><table class="tbl"><thead><tr><th>المرجع</th><th>الملاحظة</th><th>الموقع</th><th>الخطورة</th><th>أُثيرت</th><th>الحالة / الإغلاق</th><th></th></tr></thead><tbody>' +
          list.map(function (it) {
            return '<tr><td class="num small"><b>' + esc(it.ref || '') + '</b>' + (it.docCode ? '<div class="muted" style="font-size:10px;color:var(--accent2)">' + esc(it.docCode) + '</div>' : '') + '</td>' +
              '<td>' + esc(it.title) + (it.notes ? '<div class="small muted">' + esc(it.notes) + '</div>' : '') + '</td>' +
              '<td class="small">' + esc(VS.floorName(ctx, it.location) || it.location || '') + '</td>' +
              '<td>' + (it.severity === 'major' ? '<span class="pill p-danger">جوهرية</span>' : '<span class="pill p-warn">ثانوية</span>') + '</td>' +
              '<td class="small muted num">' + esc(it.raisedDate || '') + '</td>' +
              '<td>' + (it.status === 'closed' ? '<span class="pill p-ok">مغلقة ✓</span><div class="small muted num">' + esc(it.closedDate || '') + '</div>' : '<span class="pill p-warn">مفتوحة</span>') + '</td>' +
              '<td>' + ((canManage || isContractor) && it.status === 'open' ? '<button class="btn sm" data-plclose="' + it.id + '">✅ إغلاق</button>' : '') + '</td></tr>';
          }).join('') + '</tbody></table></div></div>';
      }).join('') +
      (items.length ? '' : '<div class="empty"><div class="e-ico">📌</div>لا ملاحظات تسليم</div>') +
      '</div>';

    const addBtn = el.querySelector('#pl-add');
    if (addBtn) addBtn.addEventListener('click', function () {
      const m = modal(
        '<h3>➕ ملاحظة تسليم جديدة</h3>' +
        '<label class="fl">المقاول المسؤول</label><select class="inp" id="pl-cont">' +
        ctx.S.contractors.map(function (c) { return '<option value="' + c.id + '">' + esc(c.name) + '</option>'; }).join('') + '</select>' +
        '<label class="fl">المرجع</label><input class="inp num" id="pl-ref" placeholder="PL-001">' +
        '<label class="fl">الملاحظة</label><input class="inp" id="pl-title">' +
        '<div class="grid g2"><div><label class="fl">الموقع</label><select class="inp" id="pl-loc">' +
        ctx.S.projects[0].floors.map(function (f) { return '<option value="' + f.id + '">' + esc(f.name) + '</option>'; }).join('') + '</select></div>' +
        '<div><label class="fl">الخطورة</label><select class="inp" id="pl-sev"><option value="minor">ثانوية</option><option value="major">جوهرية</option></select></div></div>' +
        '<div class="m-actions"><button class="btn" id="pl-ok">حفظ وإسناد للمقاول</button><button class="btn mutedb" id="pl-cancel">إلغاء</button></div>'
      );
      m.querySelector('#pl-cancel').addEventListener('click', function () { m.remove(); });
      m.querySelector('#pl-ok').addEventListener('click', async function () {
        const title = m.querySelector('#pl-title').value.trim();
        if (!title) { toast('أدخل نص الملاحظة', true); return; }
        try {
          await Api.create('punchList', {
            contractorId: m.querySelector('#pl-cont').value,
            ref: m.querySelector('#pl-ref').value || 'PL-' + Math.floor(Math.random() * 900 + 100),
            title: title, location: m.querySelector('#pl-loc').value, severity: m.querySelector('#pl-sev').value,
            status: 'open', raisedDate: todayStr(), closedDate: null
          });
          m.remove(); toast('✅ أُضيفت الملاحظة وأُسندت للمقاول (أُشعر بها)'); ctx.refresh();
        } catch (e) { toast(e.message, true); }
      });
    });

    el.querySelectorAll('[data-plclose]').forEach(function (b) {
      b.addEventListener('click', async function () {
        try {
          await Api.update('punchList', b.getAttribute('data-plclose'), { status: 'closed', closedDate: todayStr() });
          toast('✅ أُغلقت الملاحظة'); ctx.refresh();
        } catch (e) { toast(e.message, true); }
      });
    });

    el.querySelector('#pl-print').addEventListener('click', function () {
      printDoc('قائمة الملاحظات — Punch List', punchReportHtml(ctx, items));
    });
  }

  function punchReportHtml(ctx, items) {
    return '<h1>قائمة الملاحظات — Punch List</h1>' +
      '<p class="muted">المشروع: ' + esc(ctx.S.projects[0].name) + '</p>' +
      '<table><thead><tr><th>المرجع</th><th>المقاول</th><th>الملاحظة</th><th>الموقع</th><th>الخطورة</th><th>الحالة</th><th>الإغلاق</th></tr></thead><tbody>' +
      items.map(function (it) {
        return '<tr><td>' + esc(it.ref || '') + '</td><td>' + esc(contractorName(ctx, it.contractorId)) + '</td><td>' + esc(it.title) + '</td>' +
          '<td>' + esc(VS.floorName(ctx, it.location) || it.location || '') + '</td><td>' + (it.severity === 'major' ? 'جوهرية' : 'ثانوية') + '</td>' +
          '<td class="' + (it.status === 'closed' ? 'ok' : 'bad') + '">' + (it.status === 'closed' ? 'مغلقة' : 'مفتوحة') + '</td><td>' + esc(it.closedDate || '—') + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  // ---- الضمانات + تنبيهات قرب الانتهاء ----
  function renderWarranties(el, ctx) {
    const items = (ctx.S.warranties || []).slice().sort(function (a, b) { return String(a.endDate).localeCompare(String(b.endDate)); });
    const canAdd = ['contractor', 'consultant', 'admin'].indexOf(ctx.U.role) !== -1;
    const warnDays = VS.thresholds(ctx.S.projects[0]).warrantyWarnDays;
    const expiringSoon = items.filter(function (w) { const d = daysFromNow(w.endDate); return d != null && d >= 0 && d <= warnDays; });
    const expired = items.filter(function (w) { const d = daysFromNow(w.endDate); return d != null && d < 0; });

    el.innerHTML =
      '<div class="grid g4 mb">' +
      '<div class="card kpi"><div class="lbl">إجمالي الضمانات</div><div class="val num">' + items.length + '</div></div>' +
      '<div class="card kpi ' + (expiringSoon.length ? 'k-warn' : 'k-ok') + '"><div class="lbl">قرب الانتهاء (≤العتبة)</div><div class="val num">' + expiringSoon.length + '</div></div>' +
      '<div class="card kpi ' + (expired.length ? 'k-danger' : 'k-ok') + '"><div class="lbl">منتهية</div><div class="val num">' + expired.length + '</div></div>' +
      '<div class="card kpi k-info"><div class="lbl">سارية</div><div class="val num">' + (items.length - expired.length) + '</div></div>' +
      '</div>' +
      (expiringSoon.length ? '<div class="card mb" style="border-color:var(--warn)"><b class="small" style="color:var(--warn)">⏰ تنبيهات قرب انتهاء الضمان:</b>' +
        expiringSoon.map(function (w) { return '<div class="small" style="margin-top:6px">• ' + esc(w.item) + ' — ينتهي خلال <b class="num">' + daysFromNow(w.endDate) + '</b> يوم (' + esc(w.endDate) + ')</div>'; }).join('') + '</div>' : '') +
      '<div class="card"><div class="flex" style="justify-content:space-between;flex-wrap:wrap">' +
      '<h3 style="margin:0">🛡️ سجل ضمانات الموردين والمقاولين من الباطن</h3>' +
      (canAdd ? '<button class="btn sm" id="wr-add">➕ إضافة ضمان</button>' : '') + '</div>' +
      '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>الكود</th><th>البند/النظام</th><th>المورّد</th><th>المقاول</th><th>البداية</th><th>الانتهاء</th><th>المدة</th><th>الحالة</th></tr></thead><tbody>' +
      items.map(function (w) {
        const d = daysFromNow(w.endDate);
        const st = d == null ? '' : d < 0 ? '<span class="pill p-danger">منتهٍ</span>' : d <= 90 ? '<span class="pill p-warn">≤ ' + d + ' يوم</span>' : '<span class="pill p-ok">ساري</span>';
        return '<tr><td class="num small"><b style="color:var(--accent2)">' + esc(w.docCode || '') + '</b></td>' +
          '<td>' + esc(w.item) + '</td><td class="small">' + esc(w.supplier || '') + '</td>' +

  // ---- لوحة فترة ضمان العيوب DLP ----
  function renderDlp(el, ctx) {
    const P = ctx.S.projects[0] || {};
    const start = P.dlpStart, months = P.dlpMonths || 12;
    let end = '';
    if (start) { const e = new Date(start); e.setMonth(e.getMonth() + months); end = e.toISOString().slice(0, 10); }
    const total = start && end ? daysBetween(start, end) : 0;
    const elapsed = start ? Math.max(0, Math.min(total, daysBetween(start, todayStr()))) : 0;
    const remaining = Math.max(0, total - elapsed);
    const started = start && new Date(start) <= new Date();
    const pct = total ? Math.round(elapsed / total * 100) : 0;
    // عيوب فترة الضمان = ملاحظات مفتوحة تُعامل كعيوب + عناصر handoverDocs من نوع dlp
    const defects = (ctx.S.punchList || []).filter(function (x) { return x.status === 'open'; });

    el.innerHTML =
      '<div class="grid g4 mb">' +
      '<div class="card kpi ' + (started ? 'k-info' : '') + '"><div class="lbl">حالة فترة الضمان</div><div class="val" style="font-size:18px">' + (started ? 'جارية' : (start ? 'لم تبدأ' : 'غير محددة')) + '</div><div class="sub num">' + (start ? esc(start) + ' ← ' + esc(end) : '—') + '</div></div>' +
      '<div class="card kpi"><div class="lbl">المدة</div><div class="val num">' + months + '</div><div class="sub">شهر</div></div>' +
      '<div class="card kpi ' + (remaining < 60 && started ? 'k-warn' : 'k-ok') + '"><div class="lbl">المتبقي</div><div class="val num">' + remaining + '</div><div class="sub">يوم' + (started ? ' (' + pct + '% انقضى)' : '') + '</div></div>' +
      '<div class="card kpi ' + (defects.length ? 'k-warn' : 'k-ok') + '"><div class="lbl">عيوب مفتوحة</div><div class="val num">' + defects.length + '</div><div class="sub">تحت المسؤولية</div></div>' +
      '</div>' +
      '<div class="card mb"><h3>🏁 فترة ضمان العيوب (DLP) — التقدم الزمني</h3>' +
      '<div class="flex" style="gap:10px;align-items:center"><div class="bar" style="flex:1;height:16px"><i style="width:' + pct + '%;background:var(--accent2)"></i></div><b class="num">' + pct + '%</b></div>' +
      '<div class="small muted mt">تبدأ فترة ضمان العيوب بعد التسليم الابتدائي، وخلالها يلتزم المقاول بمعالجة العيوب الظاهرة على نفقته حتى إصدار شهادة التسليم النهائي.</div></div>' +
      '<div class="card"><h3>🔧 العيوب المفتوحة تحت فترة الضمان</h3>' +
      (defects.length ?
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>المرجع</th><th>العيب</th><th>المقاول المسؤول</th><th>الموقع</th><th>الخطورة</th><th>أُثير</th></tr></thead><tbody>' +
        defects.map(function (it) {
          return '<tr><td class="num small">' + esc(it.ref || '') + '</td><td>' + esc(it.title) + '</td><td class="small">' + esc(contractorName(ctx, it.contractorId)) + '</td>' +
            '<td class="small">' + esc(VS.floorName(ctx, it.location) || it.location || '') + '</td>' +
            '<td>' + (it.severity === 'major' ? '<span class="pill p-danger">جوهرية</span>' : '<span class="pill p-warn">ثانوية</span>') + '</td>' +
            '<td class="small muted num">' + esc(it.raisedDate || '') + '</td></tr>';
        }).join('') + '</tbody></table></div>'
        : '<div class="empty"><div class="e-ico">✅</div>لا عيوب مفتوحة</div>') + '</div>';
  }

  function unifiedHtml(ctx, lang) {
    const P = ctx.S.projects[0] || {};
    const items = ctx.S.handoverItems || [];
    const punch = ctx.S.punchList || [];
    const warr = ctx.S.warranties || [];
    const L = lang === 'en'
      ? { title: 'Unified Handover Report', project: 'Project', docs: 'Documents & Submittals', reg: 'Regulatory Requirements', item: 'Item', resp: 'Responsible', status: 'Status', punch: 'Punch List Summary', ref: 'Ref', contractor: 'Contractor', note: 'Note', state: 'State', warr: 'Warranties', wend: 'Expiry', open: 'Open', closed: 'Closed',
          st: { pending: 'Pending', in_progress: 'In Progress', done: 'Completed', na: 'N/A' } }
      : { title: 'تقرير التسليم الموحّد', project: 'المشروع', docs: 'المستندات والتسليمات', reg: 'المتطلبات النظامية', item: 'البند', resp: 'المسؤول', status: 'الحالة', punch: 'ملخص قائمة الملاحظات', ref: 'المرجع', contractor: 'المقاول', note: 'الملاحظة', state: 'الحالة', warr: 'الضمانات', wend: 'الانتهاء', open: 'مفتوحة', closed: 'مغلقة',
          st: { pending: 'لم يبدأ', in_progress: 'قيد الإنجاز', done: 'مكتمل', na: 'غير مطلوب' } };
    function grpTable(grp) {
      return '<table><thead><tr><th>' + L.item + '</th><th>' + L.resp + '</th><th>' + L.status + '</th></tr></thead><tbody>' +
        items.filter(function (i) { return i.group === grp; }).map(function (it) {
          const name = lang === 'en' ? (it.en || it.title) : it.title;
          return '<tr><td>' + esc(name) + '</td><td>' + esc(it.responsible || '—') + '</td><td class="' + (it.status === 'done' ? 'ok' : '') + '">' + esc(L.st[it.status] || it.status) + '</td></tr>';
        }).join('') + '</tbody></table>';
    }
    return '<h1>' + L.title + '</h1>' +
      '<p class="muted">' + L.project + ': <b>' + esc(P.name) + '</b>' + (P.location ? ' — ' + esc(P.location) : '') + '</p>' +

      '<table><thead><tr><th>' + L.ref + '</th><th>' + L.contractor + '</th><th>' + L.note + '</th><th>' + L.state + '</th></tr></thead><tbody>' +
      punch.map(function (it) {
        return '<tr><td>' + esc(it.ref || '') + '</td><td>' + esc(contractorName(ctx, it.contractorId)) + '</td><td>' + esc(it.title) + '</td>' +
          '<td class="' + (it.status === 'closed' ? 'ok' : 'bad') + '">' + (it.status === 'closed' ? L.closed : L.open) + '</td></tr>';
      }).join('') + '</tbody></table>' +
      '<h2>' + L.warr + '</h2><table><thead><tr><th>' + L.item + '</th><th>' + L.contractor + '</th><th>' + L.wend + '</th></tr></thead><tbody>' +
      warr.map(function (w) { return '<tr><td>' + esc(w.item) + '</td><td>' + esc(contractorName(ctx, w.contractorId)) + '</td><td>' + esc(w.endDate || '') + '</td></tr>'; }).join('') + '</tbody></table>';

  // ============ تكوين مراحل المشروع (قابل للتخصيص حسب النوع) ============
  function renderPhases(el, ctx) {
    const P = ctx.S.projects[0] || {};
    const tasks = (ctx.S.scheduleTasks || []).slice();
    const lib = ctx.S.phaseLibrary || [];
    const templates = ctx.S.phaseTemplates || {};
    const canEdit = ['consultant', 'admin'].indexOf(ctx.U.role) !== -1;

    el.innerHTML =
      '<div class="card mb"><div class="flex" style="justify-content:space-between;flex-wrap:wrap">' +
      '<h3 style="margin:0">🗂️ مراحل المشروع <span class="hint">نوع المشروع: ' + esc(P.type || 'غير محدد') + ' — قابلة للتخصيص</span></h3>' +
      (canEdit ? '<div class="flex"><select class="inp" id="ph-tmpl" style="max-width:220px"><option value="">تطبيق قالب حسب النوع...</option>' +
        Object.keys(templates).map(function (t) { return '<option value="' + esc(t) + '">' + esc(t === 'default' ? 'قالب افتراضي' : t) + '</option>'; }).join('') + '</select>' +
        '<button class="btn sm" id="ph-add">➕ مرحلة</button></div>' : '') + '</div>' +
      '<div class="small muted">أضف أو احذف المراحل بما يناسب طبيعة المشروع — تنعكس في لوحة القيادة ومقارنات الإنجاز.</div></div>' +

      (canEdit ? (function () {
        const th = VS.thresholds(P);
        return '<div class="card mb"><div class="flex" style="justify-content:space-between;flex-wrap:wrap">' +
          '<h3 style="margin:0">⚙️ عتبات التنبيه لهذا المشروع <span class="hint">تضبط متى تُطلق التنبيهات وتُحتسب المؤشرات</span></h3>' +
          '<button class="btn sm" id="th-save">💾 حفظ العتبات</button></div>' +
          '<div class="grid g4" style="margin-top:12px">' +
          '<div><label class="fl">مهلة المراجعة (SLA) — يوم</label><input class="inp num" id="th-sla" type="number" min="1" value="' + th.slaReviewDays + '"></div>' +
          '<div><label class="fl">تنبيه قرب انتهاء الضمان — يوم</label><input class="inp num" id="th-warr" type="number" min="1" value="' + th.warrantyWarnDays + '"></div>' +
          '<div><label class="fl">حد تأخر المقاول — %</label><input class="inp num" id="th-delay" type="number" min="0" value="' + th.contractorDelayPct + '"></div>' +
          '<div><label class="fl">درجة تنبيه الصحة (عند/دون)</label><select class="inp" id="th-grade">' +
          ['A', 'B', 'C', 'D'].map(function (g) { return '<option value="' + g + '"' + (th.healthAlertGrade === g ? ' selected' : '') + '>' + g + (g === 'B' ? ' — جيد فأدنى' : g === 'C' ? ' — مقبول فأدنى' : g === 'D' ? ' — حرج فقط' : ' — أي هبوط') + '</option>'; }).join('') + '</select></div>' +
          '</div>' +
          '<div class="small muted mt">تُطبَّق فوراً على تتبع التقديمات (SLA)، وتنبيهات الضمانات، ومقارنة المقاولين، وتنبيه هبوط/تحسّن صحة المشروع.</div></div>';
      })() : '') +

      '<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>المرحلة</th><th>مخطط</th><th>فعلي</th><th>الإنجاز</th>' + (canEdit ? '<th></th>' : '') + '</tr></thead><tbody>' +
      tasks.map(function (t, i) {
        return '<tr><td class="num small">' + (i + 1) + '</td>' +
          '<td><b>' + esc(t.name) + '</b>' + (t.phaseKey ? '<div class="small muted" dir="ltr" style="text-align:right">' + esc((lib.find(function (l) { return l.key === t.phaseKey; }) || {}).en || '') + '</div>' : '') + '</td>' +
          '<td class="small muted num">' + esc(t.startPlanned || '') + ' ← ' + esc(t.endPlanned || '') + '</td>' +
          '<td class="small muted num">' + esc(t.startActual || '—') + ' ← ' + esc(t.endActual || '—') + '</td>' +
          '<td><div class="flex" style="gap:6px"><div class="bar" style="flex:1"><i style="width:' + (t.progress || 0) + '%"></i></div><b class="num small">' + (t.progress || 0) + '%</b></div></td>' +
          (canEdit ? '<td><div class="flex" style="gap:4px"><button class="btn ghost sm" data-phedit="' + t.id + '">تحديث</button><button class="btn danger sm" data-phdel="' + t.id + '">حذف</button></div></td>' : '') +
          '</tr>';
      }).join('') + '</tbody></table></div>' +
      (tasks.length ? '' : '<div class="empty"><div class="e-ico">🗂️</div>لا مراحل — طبّق قالباً أو أضف مرحلة</div>') + '</div>';

    const thSave = el.querySelector('#th-save');
    if (thSave) thSave.addEventListener('click', async function () {
      try {
        await Api.update('projects', P.id, {
          thresholds: {
            slaReviewDays: Math.max(1, Number(el.querySelector('#th-sla').value) || 7),
            warrantyWarnDays: Math.max(1, Number(el.querySelector('#th-warr').value) || 90),
            contractorDelayPct: Math.max(0, Number(el.querySelector('#th-delay').value) || 3),
            healthAlertGrade: el.querySelector('#th-grade').value || 'C'
          }
        });
        toast('✅ حُفظت عتبات التنبيه — طُبّقت على مؤشرات هذا المشروع'); ctx.refresh();
      } catch (e) { toast(e.message, true); }
    });

    const tmpl = el.querySelector('#ph-tmpl');
    if (tmpl) tmpl.addEventListener('change', async function () {
      const key = tmpl.value;
      if (!key || !templates[key]) return;
      if (!confirm('تطبيق قالب "' + (key === 'default' ? 'افتراضي' : key) + '"؟ سيضيف المراحل غير الموجودة.')) { tmpl.value = ''; return; }
      const existing = tasks.map(function (t) { return t.phaseKey; });
      try {
        for (const pk of templates[key]) {
          if (existing.indexOf(pk) !== -1) continue;
          const ph = lib.find(function (l) { return l.key === pk; });
          if (ph) await Api.create('scheduleTasks', { phaseKey: pk, name: ph.ar, progress: 0, startPlanned: '', endPlanned: '', startActual: null, endActual: null });
        }
        toast('✅ طُبّق القالب وأُضيفت المراحل'); ctx.refresh();
      } catch (e) { toast(e.message, true); }
    });

    const addBtn = el.querySelector('#ph-add');
    if (addBtn) addBtn.addEventListener('click', function () { phaseModal(ctx, null, lib); });
    el.querySelectorAll('[data-phedit]').forEach(function (b) {
      b.addEventListener('click', function () { phaseModal(ctx, tasks.find(function (t) { return t.id === b.getAttribute('data-phedit'); }), lib); });
    });
    el.querySelectorAll('[data-phdel]').forEach(function (b) {
      b.addEventListener('click', async function () {
        if (!confirm('حذف هذه المرحلة؟')) return;
        try { await Api.remove('scheduleTasks', b.getAttribute('data-phdel')); toast('حُذفت المرحلة'); ctx.refresh(); }
        catch (e) { toast(e.message, true); }
      });
    });
  }

  function phaseModal(ctx, t, lib) {
    const isEdit = !!t;
    t = t || {};
    const m = modal(

        if (isEdit) await Api.update('scheduleTasks', t.id, data);

  // ============ لوحة محفظة المشاريع (ممثل المالك / الأدمن) ============
  const GRADE_PILL = { A: 'p-ok', B: 'p-ok', C: 'p-warn', D: 'p-danger' };
  const HC = { ok: '#2dd4a0', warn: '#ffcc00', danger: '#ff3b30' };

  function renderPortfolio(el, ctx) {
    const A = ctx.Sall || ctx.S;
    const projects = A.projects || [];
    const ph = A.projectHealth || {};
    const hist = A.healthHistory || [];

    function trendArrow(pid, score) {
      const h = hist.filter(function (x) { return x.projectId === pid; }).sort(function (a, b) { return String(a.month).localeCompare(String(b.month)); });
      if (!h.length) return '';
      const d = score - h[h.length - 1].score;
      return d > 0 ? '<span style="color:var(--ok)">▲ +' + d + '</span>' : d < 0 ? '<span style="color:var(--danger)">▼ ' + d + '</span>' : '<span class="muted">—</span>';
    }

    const rows = projects.map(function (p) {
      const h = ph[p.id] || { score: 0, grade: '—', cls: 'warn', gradeAr: '', issues: {} };
      const g = projectGlanceLite(p);
      return { p: p, h: h, g: g };
    });
    const avg = rows.length ? Math.round(rows.reduce(function (a, r) { return a + r.h.score; }, 0) / rows.length) : 0;
    const atRisk = rows.filter(function (r) { return r.h.cls === 'warn' || r.h.cls === 'danger'; }).length;
    const totalBudget = rows.reduce(function (a, r) { return a + (r.p.budgetPlanned || 0); }, 0);
    const totalCost = rows.reduce(function (a, r) { return a + (r.p.costActual || 0); }, 0);
    const wProg = totalBudget ? Math.round(rows.reduce(function (a, r) { return a + (r.p.progressActual || 0) * (r.p.budgetPlanned || 0); }, 0) / totalBudget) : 0;

    el.innerHTML =
      '<div class="grid g4 mb">' +
      '<div class="card kpi"><div class="lbl">عدد المشاريع</div><div class="val num">' + rows.length + '</div><div class="sub">تحت الإشراف</div></div>' +
      '<div class="card kpi ' + (avg >= 70 ? 'k-ok' : avg >= 55 ? 'k-warn' : 'k-danger') + '"><div class="lbl">متوسط صحة المحفظة</div><div class="val num">' + avg + '</div><div class="sub">من 100</div></div>' +
      '<div class="card kpi ' + (atRisk ? 'k-warn' : 'k-ok') + '"><div class="lbl">مشاريع تحت المخاطرة</div><div class="val num">' + atRisk + '</div><div class="sub">فئة C أو D</div></div>' +
      '<div class="card kpi k-info"><div class="lbl">إجمالي الميزانيات</div><div class="val" style="font-size:19px">' + VS.millions(totalBudget) + '</div><div class="sub num">الإنجاز المرجّح ' + wProg + '%</div></div>' +
      '</div>' +

      '<div class="card mb"><h3>🗂️ محفظة المشاريع — مقارنة الصحة <span class="hint">اضغط "فتح" للعمل على أي مشروع</span></h3>' +
      '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
      '<th>المشروع</th><th>النوع</th><th>الإنجاز (فعلي/مخطط)</th><th>التكلفة</th><th>مؤشر الصحة</th><th>الاتجاه</th><th>مخاطر مفتوحة</th><th></th></tr></thead><tbody>' +
      rows.map(function (r) {
        const p = r.p, h = r.h;
        const risks = (h.issues.openNcr || 0) + (h.issues.failedTests || 0) + (h.issues.openPunch || 0) + (h.issues.openHse || 0) + (h.issues.openInc || 0);
        const active = ctx.projectId === p.id;
        return '<tr>' +
          '<td><b>🏗️ ' + esc(p.name) + '</b><div class="small muted">' + esc(p.location || '') + '</div></td>' +
          '<td class="small">' + esc(p.type || '—') + '</td>' +
          '<td><div class="flex" style="gap:6px"><div class="bar ' + (r.g.behind ? 'b-danger' : 'b-ok') + '" style="flex:1;min-width:90px"><i style="width:' + (p.progressActual || 0) + '%"></i></div>' +
          '<b class="num small">' + (p.progressActual || 0) + '%</b></div><div class="small muted num">مخطط ' + (p.progressPlanned || 0) + '%</div></td>' +
          '<td class="small num">' + VS.millions(p.costActual || 0) + '<div class="muted">من ' + VS.millions(p.budgetPlanned || 0) + '</div></td>' +
          '<td><div class="flex" style="gap:8px;align-items:center"><b class="num" style="font-size:17px;color:' + (HC[h.cls] || HC.warn) + '">' + h.score + '</b>' +
          '<span class="pill ' + (GRADE_PILL[h.grade] || 'p-muted') + '">' + h.grade + '</span></div></td>' +
          '<td class="small">' + trendArrow(p.id, h.score) + '</td>' +
          '<td>' + (risks ? '<span class="pill p-warn">' + risks + '</span>' : '<span class="pill p-ok">0</span>') + '</td>' +
          '<td>' + (active ? '<span class="pill p-ok">الحالي</span>' : '<button class="btn sm" data-openp="' + p.id + '">فتح ←</button>') + '</td>' +
          '</tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="flex mt"><button class="btn ghost sm" id="pf-print">🖨 تصدير تقرير المحفظة PDF</button></div></div>';

    el.querySelectorAll('[data-openp]').forEach(function (b) {
      b.addEventListener('click', function () {
        ctx.setProject(b.getAttribute('data-openp'));
        ctx.nav('dashboard');
      });
    });
    el.querySelector('#pf-print').addEventListener('click', function () {
      printDoc('تقرير محفظة المشاريع', portfolioHtml(rows, { avg: avg, atRisk: atRisk, totalBudget: totalBudget, wProg: wProg }));
    });
  }

  function projectGlanceLite(p) {
    const progVar = (p.progressActual || 0) - (p.progressPlanned || 0);
    return { behind: progVar < -3, progVar: Math.round(progVar * 10) / 10 };
  }

  function portfolioHtml(rows, agg) {
    return '<h1>تقرير محفظة المشاريع</h1>' +
      '<p class="muted">عدد المشاريع: <b>' + rows.length + '</b> · متوسط الصحة: <b>' + agg.avg + '/100</b> · تحت المخاطرة: <b>' + agg.atRisk + '</b> · إجمالي الميزانيات: <b>' + (agg.totalBudget / 1e6).toFixed(1) + 'M</b> · الإنجاز المرجّح: <b>' + agg.wProg + '%</b></p>' +
      '<table><thead><tr><th>المشروع</th><th>النوع</th><th>الإنجاز الفعلي</th><th>المخطط</th><th>مؤشر الصحة</th><th>الفئة</th></tr></thead><tbody>' +
      rows.map(function (r) {
        return '<tr><td>' + esc(r.p.name) + '</td><td>' + esc(r.p.type || '') + '</td><td>' + (r.p.progressActual || 0) + '%</td><td>' + (r.p.progressPlanned || 0) + '%</td>' +
          '<td>' + r.h.score + '</td><td class="' + (r.h.cls === 'ok' ? 'ok' : 'bad') + '">' + r.h.grade + ' — ' + esc(r.h.gradeAr) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  window.ViewsHandover = {
    renderHandover: renderHandover,
    renderPhases: renderPhases,
    renderPortfolio: renderPortfolio,
    printDoc: printDoc
  };
})();

      await Api.login(u, p);

  // ============ الهيكل الرئيسي ============
  async function boot() {
    const user = Api.currentUser();
    if (!user) { renderLogin(); return; }
    let S;
    try { S = await Api.state(); }
    catch (e) { await Api.logout(); renderLogin(e.status === 401 ? null : e.message); return; }

    const myPages = PAGES.filter(function (p) { return p.roles.indexOf(user.role) !== -1; });
    let current = location.hash.replace('#', '') || myPages[0].id;
    if (!myPages.some(function (p) { return p.id === current; })) current = myPages[0].id;

    // ============ تعدد المشاريع: المشروع الحالي وترشيح بياناته ============
    let rawS = S;
    let currentProject = sessionStorage.getItem('bassir-project');
    if (!rawS.projects.some(function (p) { return p.id === currentProject; })) {
      currentProject = rawS.projects[0] ? rawS.projects[0].id : null;
    }

    /** يرشّح اللقطة لبيانات المشروع المحدد (كل عنصر يحمل projectId) */
    function scopedState(full, pid) {
      if (!pid || full.projects.length <= 1) return full;
      const c = {};
      Object.keys(full).forEach(function (k) {
        c[k] = Array.isArray(full[k])
          ? full[k].filter(function (x) { return !x || typeof x !== 'object' || !x.projectId || x.projectId === pid; })
          : full[k];
      });
      c.projects = full.projects.filter(function (p) { return p.id === pid; });
      if (!c.projects.length) c.projects = full.projects;
      return c;
    }

    ctx = {
      U: user,
      S: scopedState(rawS, currentProject),
      Sall: rawS, // اللقطة الكاملة (لصفحات عين المالك، المشاريع، المستخدمين)
      projectId: currentProject,
      nav: function (id) { current = id; location.hash = id; draw(); },
      setProject: function (pid) {
        currentProject = pid;
        ctx.projectId = pid;
        sessionStorage.setItem('bassir-project', pid);
        ctx.S = scopedState(rawS, pid);
        draw();
      },
      refresh: async function () {
        rawS = await Api.state();
        ctx.Sall = rawS; ctx.S = scopedState(rawS, currentProject); S = rawS;
        draw();
      },
      refreshSilent: async function () {
        rawS = await Api.state();
        ctx.Sall = rawS; ctx.S = scopedState(rawS, currentProject); S = rawS;
        drawSidebar();
      }
    };

    function sidebarHtml() {
      let html = '<div class="brand"><span class="eye">👁</span><div><b>بصير</b><small>OWNER EYES</small></div></div>';
