/**
 * بصير | صفحات إضافية للمقاول: جدول الكميات + الجدول الزمني
 *  - renderContractorBoq: جدول كميات المقاول مع (المنجز/الجاري/المتبقي) ومؤشر التأخير حسب الجدول الزمني.
 *  - renderSchedule: عرض الجدول الزمني مع مؤشرات التأخير، وقراءة ملف جدول زمني مرفوع
 *    (CSV / Primavera XER / P6 XML / Excel XLSX / PDF) عبر parseScheduleFile.
 */
(function () {
  'use strict';
  const VS = window.ViewsShared;
  const esc = VS.esc, money = VS.money, toast = VS.toast, floorName = VS.floorName, discOf = VS.discOf;
  const t = I18n.t;

  I18n.registerDict({
    'جدول الكميات': 'Bill of Quantities',
    'الجدول الزمني': 'Schedule',
    'الكمية المنجزة': 'Completed Qty',
    'الكمية الجاري العمل فيها': 'In-Progress Qty',
    'الكمية المتبقية': 'Remaining Qty',
    'التأخير': 'Delay',
    'ضمن الجدول': 'On schedule',
    'سيتأخر — سرّع العمل': 'Will slip — speed up',
    'متأخر': 'Behind',
    'منجز': 'Complete',
    'لم يبدأ': 'Not started',
    'المتوقع حسب الجدول': 'Expected by schedule',
    'رفع ملف الجدول الزمني': 'Upload schedule file',
    'يقرأ CSV / Primavera XER / P6 XML / Excel / PDF': 'Reads CSV / Primavera XER / P6 XML / Excel / PDF'
  });

  const todayMs = () => Date.now();
  function daysBetween(a, b) { return (new Date(b) - new Date(a)) / 86400000; }

  /** النسبة المتوقّعة اليوم ضمن نافذة زمنية (خطّي 0..100) */
  function expectedPct(start, end) {
    if (!start || !end) return null;
    const s = new Date(start).getTime(), e = new Date(end).getTime();
    if (isNaN(s) || isNaN(e) || e <= s) return null;
    const now = todayMs();
    if (now <= s) return 0;
    if (now >= e) return 100;
    return Math.round(((now - s) / (e - s)) * 100);
  }

  /** مؤشر التأخير: يقارن الفعلي بالمتوقّع حسب الجدول ويعيد {cls, icon, label, expected} */
  function delayStatus(actual, start, end, amberTh, redTh) {
    amberTh = amberTh == null ? 10 : amberTh;
    redTh = redTh == null ? amberTh * 2 : redTh;
    const a = Number(actual) || 0;
    if (a >= 100) return { cls: 'p-ok', icon: '✓', label: 'منجز', expected: 100 };
    const exp = expectedPct(start, end);
    if (exp == null) return { cls: 'p-none', icon: '—', label: a > 0 ? 'ضمن الجدول' : 'لم يبدأ', expected: null };
    const overdueEnd = new Date(end).getTime() < todayMs();
    const gap = exp - a;
    if (overdueEnd && a < 100) return { cls: 'p-danger', icon: '✕', label: 'متأخر', expected: exp };
    if (gap <= amberTh) return { cls: 'p-ok', icon: '✓', label: a > 0 ? 'ضمن الجدول' : 'لم يبدأ', expected: exp };
    if (gap <= redTh) return { cls: 'p-warn', icon: '⚠', label: 'سيتأخر — سرّع العمل', expected: exp };
    return { cls: 'p-danger', icon: '✕', label: 'متأخر', expected: exp };
  }

  /** نافذة المقاول الزمنية: من عقده، وإلا من مدى مراحل الجدول الزمني للمشروع */
  function contractorWindow(ctx) {
    const c = (ctx.S.contractors || []).find(function (x) { return x.id === ctx.U.contractorId; }) || (ctx.S.contractors || [])[0];
    if (c && c.startDate && c.endDate) return { start: c.startDate, end: c.endDate };
    const tasks = ctx.S.scheduleTasks || [];
    if (tasks.length) {
      const starts = tasks.map(function (x) { return x.startPlanned; }).filter(Boolean).sort();
      const ends = tasks.map(function (x) { return x.endPlanned; }).filter(Boolean).sort();
      if (starts.length && ends.length) return { start: starts[0], end: ends[ends.length - 1] };
    }
    return { start: null, end: null };
  }

  // ============ 1) جدول كميات المقاول ============
  function renderContractorBoq(el, ctx) {
    const items = (ctx.S.boqItems || []).slice();
    const th = VS.thresholds(ctx.S.projects[0]);
    const win = contractorWindow(ctx);

    // الكميات الجاري العمل فيها = مطالَب بها في مستخلصات معلّقة لم تُعتمد بعد
    const pendingByItem = {};
    (ctx.S.payments || []).filter(function (p) { return p.status === 'pending'; }).forEach(function (p) {
      (p.lines || []).forEach(function (ln) {
        pendingByItem[ln.boqItemId] = Math.max(pendingByItem[ln.boqItemId] || 0, Number(ln.progress) || 0);
      });
    });

    let totVal = 0, totEarned = 0, nLate = 0, nSlip = 0;
    const rows = items.map(function (b) {
      const d = discOf(ctx, b.discipline);
      const approved = Number(b.progress) || 0;
      const pendTarget = pendingByItem[b.id] || 0;
      const inProgPct = Math.max(0, Math.min(100 - approved, pendTarget - approved));
      const doneQty = b.qty * approved / 100;
      const progQty = b.qty * inProgPct / 100;
      const remQty = Math.max(0, b.qty - doneQty - progQty);
      const line = b.qty * b.unitPrice;
      totVal += line; totEarned += line * approved / 100;
      const ds = delayStatus(approved, win.start, win.end, th.progressAmberPct, th.progressAmberPct * 2);
      if (ds.cls === 'p-danger' && approved < 100) nLate++;
      if (ds.cls === 'p-warn') nSlip++;
      const fmt = function (n) { return Math.round(n).toLocaleString('en-US'); };
      return '<tr>' +
        '<td class="num small">' + esc(b.code) + '</td>' +
        '<td>' + d.icon + ' ' + esc(b.description) + '<div class="small muted">' + esc(floorName(ctx, b.floor)) + '</div></td>' +
        '<td class="num small">' + b.unitPrice.toLocaleString('en-US') + '<div class="muted">' + esc(b.unit) + '</div></td>' +
        '<td class="num small">' + b.qty + '</td>' +
        '<td class="num small" style="color:var(--status-ok)">' + fmt(doneQty) + '<div class="muted">' + approved + '%</div></td>' +
        '<td class="num small" style="color:var(--status-info)">' + fmt(progQty) + (inProgPct ? '<div class="muted">+' + inProgPct + '%</div>' : '') + '</td>' +
        '<td class="num small" style="color:var(--status-warning)">' + fmt(remQty) + '</td>' +
        '<td>' + VS.statusPill(ds.cls, ds.label, ds.icon) +
          (ds.expected != null && ds.cls !== 'p-ok' ? '<div class="small muted num">' + t('المتوقع حسب الجدول') + ' ' + ds.expected + '%</div>' : '') + '</td>' +
        '</tr>';
    }).join('');

    // ===== رفع جدول الكميات (خط أساس / تعديل) وحالة الاعتماد =====
    const subs = (ctx.S.boqSubmittals || []).slice().sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
    const pendingSub = subs.find(function (s) { return s.status === 'pending'; });
    const hasBaseline = items.length > 0 || subs.some(function (s) { return s.status === 'approved'; });
    const uploadCard =
      '<div class="card mb"><div class="flex" style="justify-content:space-between;flex-wrap:wrap;gap:10px">' +
      '<h3 style="margin:0">📤 ' + (hasBaseline ? 'طلب تعديل جدول الكميات' : 'رفع جدول الكميات للاعتماد') + ' <span class="hint">CSV / Excel — الأعمدة: الوصف/الوحدة/الكمية/السعر/الدور</span></h3></div>' +
      (hasBaseline ? '<div class="small" style="margin:8px 0"><span class="pill p-ok">🔒 جدول الكميات معتمد ومقفل</span> أي تعديل يتطلب موافقة الاستشاري وممثل المالك معاً.</div>' : '<div class="small muted" style="margin:8px 0">ارفع جدول كمياتك ليُراجعه الاستشاري ويعتمده، وبعد الاعتماد يُقفل ولا يُعدَّل إلا بموافقة الاستشاري وممثل المالك.</div>') +
      (pendingSub
        ? '<div class="pill p-warn">⏳ لديك جدول كميات قيد المراجعة (' + esc(pendingSub.docCode || pendingSub.ref || '') + ') — بانتظار قرار الاستشاري</div>'
        : '<div class="flex"><input class="inp" id="cboq-file" type="file" accept=".csv,.tsv,.txt,.xlsx,.xlsm" style="max-width:260px"><button class="btn sm" id="cboq-read">📖 قراءة الملف</button></div>' +
          '<div id="cboq-prev" class="small muted mt">اختر الملف ثم «قراءة الملف».</div>') +
      (subs.length ? '<div class="tbl-wrap mt"><table class="tbl"><thead><tr><th>المرجع</th><th>النوع</th><th>البنود</th><th>التاريخ</th><th>الحالة</th></tr></thead><tbody>' +
        subs.map(function (s) { return '<tr><td class="num small">' + esc(s.docCode || s.ref || '—') + '</td><td>' + (s.kind === 'revision' ? '<span class="pill p-warn">تعديل</span>' : '<span class="pill p-info">خط أساس</span>') + '</td><td class="num small">' + ((s.parsedItems || []).length || '—') + '</td><td class="small muted num">' + esc(s.date || '') + '</td><td>' + VS.pill(s.status) + '</td></tr>'; }).join('') +
        '</tbody></table></div>' : '') +
      '</div>';

    el.innerHTML = uploadCard +
      '<div class="grid g4 mb">' +
      '<div class="card kpi"><div class="lbl">إجمالي بنودي</div><div class="val num">' + items.length + '</div><div class="sub">بند في عقدي</div></div>' +
      '<div class="card kpi k-info"><div class="lbl">قيمة عقدي</div><div class="val num">' + Math.round(totVal / 1e6 * 10) / 10 + 'M</div><div class="sub">ر.س</div></div>' +
      '<div class="card kpi ' + (nSlip ? 'k-warn' : 'k-ok') + '"><div class="lbl">بنود ستتأخر</div><div class="val num ' + (nSlip ? '' : 'zero') + '">' + nSlip + '</div><div class="sub">سرّع العمل بها</div></div>' +
      '<div class="card kpi ' + (nLate ? 'k-danger' : 'k-ok') + '"><div class="lbl">بنود متأخرة</div><div class="val num ' + (nLate ? '' : 'zero') + '">' + nLate + '</div><div class="sub">خلف الجدول الزمني</div></div>' +
      '</div>' +
      '<div class="card"><div class="flex" style="justify-content:space-between;flex-wrap:wrap">' +
      '<h3 style="margin:0">📐 جدول كمياتي <span class="hint">المنجز والجاري والمتبقي لكل بند، ومؤشر التأخير حسب الجدول الزمني</span></h3>' +
      '<span class="pill p-ok">' + t('المنفذ: ') + money(Math.round(totEarned)) + ' (' + (totVal ? Math.round(totEarned / totVal * 100) : 0) + '%)</span></div>' +
      (items.length ?
        '<div class="tbl-wrap" style="max-height:64vh;overflow-y:auto"><table class="tbl"><thead><tr>' +
        '<th>الكود</th><th>البند</th><th>سعر الوحدة</th><th>الكمية</th><th>' + t('الكمية المنجزة') + '</th><th>' + t('الكمية الجاري العمل فيها') + '</th><th>' + t('الكمية المتبقية') + '</th><th>' + t('التأخير') + '</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<div class="legend" style="margin-top:12px">' +
        '<span>' + VS.statusPill('p-ok', 'ضمن الجدول', '✓') + '</span>' +
        '<span>' + VS.statusPill('p-warn', 'سيتأخر — سرّع العمل', '⚠') + '</span>' +
        '<span>' + VS.statusPill('p-danger', 'متأخر', '✕') + '</span></div>'
        : '<div class="empty"><div class="e-ico">📐</div>لا بنود في عقدك بعد</div>') +
      '</div>';

    const cRead = el.querySelector('#cboq-read');
    if (cRead) cRead.addEventListener('click', async function () {
      const f = el.querySelector('#cboq-file').files[0];
      const prev = el.querySelector('#cboq-prev');
      if (!f) { toast('اختر ملف جدول الكميات أولاً', true); return; }
      prev.innerHTML = '⏳ جارٍ قراءة الملف…';
      try {
        const floors = (ctx.S.projects[0] || {}).floors || [];
        const parsed = await parseBoqFile(f, floors);
        if (!parsed.length) { prev.innerHTML = '⚠️ لم تُستخرج بنود. استخدم CSV/Excel بعناوين: الوصف/الوحدة/الكمية/السعر.'; return; }
        const totalVal = parsed.reduce(function (a, b) { return a + b.qty * b.unitPrice; }, 0);
        prev.innerHTML =
          '<div class="flex" style="justify-content:space-between;flex-wrap:wrap"><b class="small">✅ استُخرج ' + parsed.length + ' بند (قيمة ' + money(Math.round(totalVal)) + ')</b>' +
          '<button class="btn sm" id="cboq-send">📤 ' + (hasBaseline ? 'إرسال طلب التعديل للاعتماد' : 'إرسال للاستشاري للاعتماد') + '</button></div>' +
          '<div class="tbl-wrap mt" style="max-height:32vh;overflow:auto"><table class="tbl"><thead><tr><th>الوصف</th><th>الوحدة</th><th>الكمية</th><th>السعر</th></tr></thead><tbody>' +
          parsed.slice(0, 200).map(function (p) { return '<tr><td class="small">' + esc(p.description) + '</td><td class="small">' + esc(p.unit) + '</td><td class="num small">' + p.qty + '</td><td class="num small">' + p.unitPrice.toLocaleString('en-US') + '</td></tr>'; }).join('') +
          '</tbody></table></div>';
        const sendBtn = el.querySelector('#cboq-send');
        sendBtn.addEventListener('click', async function () {
          sendBtn.disabled = true;
          try {
            const fileObj = await Api.upload(f, { category: 'جداول الكميات BOQ' });
            await Api.create('boqSubmittals', { title: (hasBaseline ? 'تعديل جدول الكميات — ' : 'جدول الكميات — ') + f.name, file: fileObj, parsedItems: parsed, kind: hasBaseline ? 'revision' : 'baseline' });
            toast(hasBaseline ? '📤 أُرسل طلب التعديل — يتطلب موافقة الاستشاري وممثل المالك' : '📤 أُرسل جدول الكميات للاستشاري للاعتماد');
            ctx.refresh();
          } catch (e) { toast(e.message, true); sendBtn.disabled = false; }
        });
      } catch (e) { prev.innerHTML = '❌ تعذّرت قراءة الملف: ' + esc(e.message); }
    });
  }

  // ============ 2) قرّاء ملفات الجدول الزمني ============
  // كلها تُعيد مصفوفة: [{ name, start, end, progress }]

  function normDate(s) {
    if (!s) return '';
    s = String(s).trim();
    // Primavera: 2026-01-31 00:00  |  01-Jan-26  |  1/31/2026
    let m = s.match(/(\d{4})-(\d{2})-(\d{2})/); if (m) return m[1] + '-' + m[2] + '-' + m[3];
    m = s.match(/(\d{1,2})[\/](\d{1,2})[\/](\d{4})/); if (m) return m[3] + '-' + String(m[1]).padStart(2, '0') + '-' + String(m[2]).padStart(2, '0');
    const MON = { jan: '01', feb: '02', mar: '03', apr: '04', may: '05', jun: '06', jul: '07', aug: '08', sep: '09', oct: '10', nov: '11', dec: '12' };
    m = s.match(/(\d{1,2})[- ]([A-Za-z]{3})[- ](\d{2,4})/);
    if (m) { let y = m[3].length === 2 ? '20' + m[3] : m[3]; return y + '-' + (MON[m[2].toLowerCase()] || '01') + '-' + String(m[1]).padStart(2, '0'); }
    return '';
  }
  function pct(v) { const n = parseFloat(String(v).replace('%', '')); return isNaN(n) ? 0 : Math.max(0, Math.min(100, Math.round(n))); }

  function parseDelimited(text) {
    const lines = text.split(/\r\n|\r|\n/).filter(function (l) { return l.trim(); });
    if (!lines.length) return [];
    const sep = lines[0].indexOf('\t') !== -1 ? '\t' : (lines[0].split(';').length > lines[0].split(',').length ? ';' : ',');
    const rows = lines.map(function (l) { return l.split(sep).map(function (c) { return c.replace(/^"|"$/g, '').trim(); }); });
    const head = rows[0].map(function (h) { return h.toLowerCase(); });
    const find = function (keys) { for (let i = 0; i < head.length; i++) { if (keys.some(function (k) { return head[i].indexOf(k) !== -1; })) return i; } return -1; };
    const ci = { name: find(['task', 'activity', 'name', 'المهمة', 'المرحلة', 'البند', 'النشاط']), start: find(['start', 'بداية', 'من']), end: find(['finish', 'end', 'نهاية', 'الى', 'إلى']), prog: find(['%', 'complete', 'progress', 'الإنجاز', 'نسبة']) };
    const hasHeader = ci.name !== -1 || ci.start !== -1;
    const body = hasHeader ? rows.slice(1) : rows;
    return body.map(function (r) {
      return {
        name: (ci.name !== -1 ? r[ci.name] : r[0]) || '',
        start: normDate(ci.start !== -1 ? r[ci.start] : r[1]),
        end: normDate(ci.end !== -1 ? r[ci.end] : r[2]),
        progress: pct(ci.prog !== -1 ? r[ci.prog] : r[3])
      };
    }).filter(function (x) { return x.name; });
  }

  function parseXer(text) {
    const lines = text.split(/\r\n|\r|\n/);
    let fields = null, out = [];
    let inTask = false;
    for (const line of lines) {
      if (line.startsWith('%T')) { inTask = line.trim().split('\t')[1] === 'TASK'; fields = null; continue; }
      if (!inTask) continue;
      const parts = line.split('\t');
      if (line.startsWith('%F')) { fields = parts.slice(1); continue; }
      if (line.startsWith('%R') && fields) {
        const vals = parts.slice(1);
        const g = function (k) { const i = fields.indexOf(k); return i !== -1 ? vals[i] : ''; };
        const name = g('task_name') || g('task_code');
        if (name) out.push({ name: name, start: normDate(g('target_start_date') || g('act_start_date') || g('early_start_date')), end: normDate(g('target_end_date') || g('act_end_date') || g('early_end_date')), progress: pct(g('phys_complete_pct') || g('complete_pct')) });
      }
    }
    return out;
  }

  function parseP6Xml(text) {
    const doc = new DOMParser().parseFromString(text, 'application/xml');
    let nodes = doc.getElementsByTagName('Activity');
    if (!nodes.length) nodes = doc.getElementsByTagName('Task');
    const out = [];
    const childText = function (el, names) { for (const n of names) { const c = el.getElementsByTagName(n)[0]; if (c && c.textContent) return c.textContent; } return ''; };
    for (const el of nodes) {
      const name = childText(el, ['Name', 'name', 'task_name']);
      if (!name) continue;
      out.push({
        name: name,
        start: normDate(childText(el, ['StartDate', 'PlannedStartDate', 'ActualStartDate', 'EarlyStartDate'])),
        end: normDate(childText(el, ['FinishDate', 'PlannedFinishDate', 'ActualFinishDate', 'EarlyFinishDate'])),
        progress: pct(childText(el, ['PercentComplete', 'PhysicalPercentComplete', 'PercentCompleteType']))
      });
    }
    return out;
  }

  // XLSX: فكّ ضغط ZIP عبر DecompressionStream المدمج في المتصفح (بلا مكتبات)
  async function inflateRaw(bytes) {
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Response(new Blob([bytes]).stream().pipeThrough(ds));
    return new Uint8Array(await stream.arrayBuffer());
  }
  async function readZipEntry(buf, nameMatch) {
    const dv = new DataView(buf); const u8 = new Uint8Array(buf);
    // اعثر على نهاية الفهرس المركزي EOCD
    let eocd = -1;
    for (let i = u8.length - 22; i >= 0 && i > u8.length - 65558; i--) { if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; } }
    if (eocd === -1) throw new Error('ملف XLSX غير صالح');
    let off = dv.getUint32(eocd + 16, true); const count = dv.getUint16(eocd + 10, true);
    const dec = new TextDecoder();
    for (let e = 0; e < count; e++) {
      if (dv.getUint32(off, true) !== 0x02014b50) break;
      const method = dv.getUint16(off + 10, true);
      const compSize = dv.getUint32(off + 20, true);
      const fnLen = dv.getUint16(off + 28, true), exLen = dv.getUint16(off + 30, true), cmLen = dv.getUint16(off + 32, true);
      const lho = dv.getUint32(off + 42, true);
      const fname = dec.decode(u8.subarray(off + 46, off + 46 + fnLen));
      off += 46 + fnLen + exLen + cmLen;
      if (!nameMatch(fname)) continue;
      // اقرأ الترويسة المحلية لتحديد بداية البيانات
      const lfnLen = dv.getUint16(lho + 26, true), lexLen = dv.getUint16(lho + 28, true);
      const dataStart = lho + 30 + lfnLen + lexLen;
      const raw = u8.subarray(dataStart, dataStart + compSize);
      return method === 0 ? raw : await inflateRaw(raw);
    }
    return null;
  }
  // يعيد شبكة الخلايا (مصفوفة صفوف من نصوص) من ملف XLSX
  async function xlsxGrid(buf) {
    const dec = new TextDecoder();
    const ssBytes = await readZipEntry(buf, function (n) { return /sharedStrings\.xml$/i.test(n); });
    const shared = [];
    if (ssBytes) { const xml = dec.decode(ssBytes); const doc = new DOMParser().parseFromString(xml, 'application/xml'); const sis = doc.getElementsByTagName('si'); for (const si of sis) { shared.push((si.textContent || '').trim()); } }
    const sheetBytes = await readZipEntry(buf, function (n) { return /worksheets\/sheet1\.xml$/i.test(n); }) || await readZipEntry(buf, function (n) { return /worksheets\/.*\.xml$/i.test(n); });
    if (!sheetBytes) throw new Error('لا توجد ورقة بيانات في الملف');
    const doc = new DOMParser().parseFromString(dec.decode(sheetBytes), 'application/xml');
    const rowsEl = doc.getElementsByTagName('row'); const grid = [];
    for (const row of rowsEl) {
      const cells = row.getElementsByTagName('c'); const arr = [];
      for (const c of cells) {
        const ref = (c.getAttribute('r') || '').replace(/\d+/g, '');
        const col = ref.split('').reduce(function (a, ch) { return a * 26 + (ch.charCodeAt(0) - 64); }, 0) - 1;
        const type = c.getAttribute('t'); const v = c.getElementsByTagName('v')[0];
        let val = v ? v.textContent : (c.getElementsByTagName('t')[0] ? c.getElementsByTagName('t')[0].textContent : '');
        if (type === 's') val = shared[parseInt(val, 10)] || '';
        arr[col >= 0 ? col : arr.length] = (val == null ? '' : val);
      }
      grid.push(arr);
    }
    return grid;
  }
  async function parseXlsx(buf) {
    const grid = await xlsxGrid(buf);
    return parseDelimited(grid.map(function (r) { return r.map(function (c) { return (c == null ? '' : c); }).join('\t'); }).join('\n'));
  }

  // قارئ جداول عام (CSV/TSV/XLSX) يعيد صفوفاً خامة (مصفوفة مصفوفات) — لجداول الكميات وغيرها
  function csvRows(text) {
    const rows = []; let row = [], field = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i], n = text[i + 1];
      if (q) { if (c === '"' && n === '"') { field += '"'; i++; } else if (c === '"') q = false; else field += c; }
      else if (c === '"') q = true;
      else if (c === ',' || c === '\t' || c === ';') { row.push(field); field = ''; }
      else if (c === '\r') { /* skip */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (c) { return String(c).trim(); }); });
  }
  async function parseRows(file) {
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    if (ext === 'xlsx' || ext === 'xlsm') return xlsxGrid(await file.arrayBuffer());
    return csvRows(await file.text());
  }

  async function parsePdf(url) {
    const lib = await import('/vendor/pdfjs/pdf.min.mjs');
    lib.GlobalWorkerOptions.workerSrc = '/vendor/pdfjs/pdf.worker.min.mjs';
    const pdf = await lib.getDocument({ url: url }).promise;
    let text = '';
    for (let p = 1; p <= pdf.numPages; p++) { const page = await pdf.getPage(p); const c = await page.getTextContent(); let lastY = null, line = ''; c.items.forEach(function (it) { const y = Math.round(it.transform[5]); if (lastY !== null && Math.abs(y - lastY) > 3) { text += line.trim() + '\n'; line = ''; } line += it.str + ' '; lastY = y; }); text += line.trim() + '\n'; }
    // أبقِ الأسطر التي تحوي تاريخاً (على الأرجح صفوف مهام)
    const lines = text.split('\n').filter(function (l) { return /\d{4}-\d{2}-\d{2}|\d{1,2}[\/-][A-Za-z]{3}|\d{1,2}\/\d{1,2}\/\d{4}/.test(l); });
    return lines.map(function (l) {
      const dates = l.match(/(\d{4}-\d{2}-\d{2}|\d{1,2}[- ][A-Za-z]{3}[- ]\d{2,4}|\d{1,2}\/\d{1,2}\/\d{4})/g) || [];
      const prog = (l.match(/(\d{1,3})\s*%/) || [])[1];
      const name = l.replace(/(\d{4}-\d{2}-\d{2}|\d{1,2}[- ][A-Za-z]{3}[- ]\d{2,4}|\d{1,2}\/\d{1,2}\/\d{4})/g, '').replace(/\d{1,3}\s*%/, '').trim();
      return { name: name || 'مهمة', start: normDate(dates[0]), end: normDate(dates[1] || dates[0]), progress: pct(prog) };
    }).filter(function (x) { return x.start; });
  }

  /** يقرأ ملف جدول زمني بأي صيغة مدعومة ويعيد قائمة المهام */
  async function parseScheduleFile(file) {
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    if (ext === 'xlsx' || ext === 'xlsm') { return parseXlsx(await file.arrayBuffer()); }
    if (ext === 'pdf') { return parsePdf(URL.createObjectURL(file)); }
    const text = await file.text();
    if (ext === 'xer') return parseXer(text);
    if (ext === 'xml') return parseP6Xml(text);
    if (text.trim()[0] === '<') return parseP6Xml(text);
    if (text.indexOf('%T') !== -1 && text.indexOf('TASK') !== -1) return parseXer(text);
    return parseDelimited(text); // csv / tsv / txt
  }

  // يحوّل ملف جدول كميات (CSV/Excel) إلى بنود [{description,unit,qty,unitPrice,floor}]
  async function parseBoqFile(file, floors) {
    floors = floors || [];
    const rows = await parseRows(file);
    if (!rows.length) return [];
    const head = rows[0].map(function (h) { return String(h).toLowerCase().trim(); });
    const find = function (keys) { for (let i = 0; i < head.length; i++) { if (keys.some(function (k) { return head[i].indexOf(k) !== -1; })) return i; } return -1; };
    const ci = { desc: find(['description', 'item', 'وصف', 'البند', 'الوصف']), unit: find(['unit', 'وحدة', 'الوحدة']), qty: find(['qty', 'quantity', 'كمية', 'الكمية']), price: find(['price', 'unitprice', 'سعر']), floor: find(['floor', 'دور', 'الدور', 'level']) };
    const hasHeader = ci.desc !== -1;
    const body = hasHeader ? rows.slice(1) : rows;
    const dFloor = (floors[0] && floors[0].id) || 'GF';
    const matchFloor = function (v) { if (!v) return dFloor; v = String(v).trim(); const a = floors.find(function (f) { return f.id === v; }); if (a) return a.id; const b = floors.find(function (f) { return f.name === v; }); return b ? b.id : dFloor; };
    return body.map(function (r) {
      return { description: String((ci.desc !== -1 ? r[ci.desc] : r[0]) || '').trim(), unit: (ci.unit !== -1 ? r[ci.unit] : '') || 'وحدة', qty: Number(ci.qty !== -1 ? r[ci.qty] : 0) || 0, unitPrice: Number(ci.price !== -1 ? String(r[ci.price]).replace(/[^\d.]/g, '') : 0) || 0, floor: matchFloor(ci.floor !== -1 ? r[ci.floor] : '') };
    }).filter(function (x) { return x.description; });
  }

  // لوحة اعتماد خط الأساس (جداول الكميات/الجداول الزمنية) — اعتماد فردي لخط الأساس، وتوقيع مزدوج للتعديلات
  function baselineReviewHtml(ctx, collection) {
    const role = ctx.U.role;
    const canConsult = role === 'consultant' || role === 'admin';
    const canRep = role === 'owner_rep';
    if (!canConsult && !canRep) return '';
    const subs = (ctx.S[collection] || []).filter(function (s) { return s.status === 'pending'; });
    if (!subs.length) return '';
    const title = collection === 'boqSubmittals' ? 'جداول الكميات المقدَّمة' : 'الجداول الزمنية المقدَّمة';
    return '<div class="card mb"><h3 style="margin:0 0 10px">🖊 اعتماد ' + title + ' <span class="hint">اعتماد خط الأساس من الاستشاري؛ تعديله لاحقاً يتطلب توقيع الاستشاري وممثل المالك معاً</span></h3>' +
      '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>المرجع</th><th>العنوان</th><th>النوع</th><th>البنود</th><th>التوقيعات</th><th>الإجراء</th></tr></thead><tbody>' +
      subs.map(function (s) {
        const rev = s.kind === 'revision'; const sig = s.sig || {};
        const n = ((s.parsedItems || s.parsedTasks || []).length) || '—';
        const sigCell = rev ? ('استشاري ' + (sig.consultant ? '✓' : '—') + ' · ممثل المالك ' + (sig.ownerRep ? '✓' : '—')) : '—';
        let act = '';
        if (rev) {
          if (canConsult && !sig.consultant) act += '<button class="btn sm" data-sign="' + s.id + '" data-col="' + collection + '">🖊 توقيع الاستشاري</button> ';
          if (canRep && !sig.ownerRep) act += '<button class="btn sm" data-sign="' + s.id + '" data-col="' + collection + '">🖊 توقيع ممثل المالك</button> ';
          act += '<button class="btn danger sm" data-rej="' + s.id + '" data-col="' + collection + '">↩ رفض</button>';
        } else if (canConsult) {
          act += '<button class="btn sm" data-sign="' + s.id + '" data-col="' + collection + '">✅ اعتماد</button> <button class="btn danger sm" data-rej="' + s.id + '" data-col="' + collection + '">↩ إرجاع</button>';
        }
        return '<tr><td class="num small">' + esc(s.docCode || s.ref || '—') + '</td><td class="small">' + esc(s.title || '—') + '</td><td>' + (rev ? '<span class="pill p-warn">تعديل</span>' : '<span class="pill p-info">خط أساس</span>') + '</td><td class="num small">' + n + '</td><td class="small">' + sigCell + '</td><td>' + (act || '<span class="muted small">بانتظار الطرف الآخر</span>') + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }
  function wireBaselineReview(el, ctx) {
    el.querySelectorAll('[data-sign]').forEach(function (b) {
      b.addEventListener('click', async function () {
        try { await Api.review({ collection: b.getAttribute('data-col'), id: b.getAttribute('data-sign'), status: 'approved' }); toast('✅ سُجّل قرارك'); ctx.refresh(); } catch (e) { toast(e.message, true); }
      });

    el.querySelectorAll('[data-rej]').forEach(function (b) {
      b.addEventListener('click', async function () {

      });
    });
  }

  window.ViewsExtra = {
    renderContractorBoq: renderContractorBoq,

    parseBoqFile: parseBoqFile,
    baselineReviewHtml: baselineReviewHtml,
    wireBaselineReview: wireBaselineReview,
    delayStatus: delayStatus, expectedPct: expectedPct
  };
})();

      if (!tabs.some(function (t) { return t.id === active; })) active = tabs[0].id;
      function paint() {

        el.querySelectorAll('[data-tab]').forEach(function (b) {

        location.reload();
      });
    });
  }

  // ============ شاشة الدخول ============
  function renderLogin(msg) {
    app.innerHTML =
      '<div class="login-wrap">' + langSwitchHtml('login-lang-switch') + '<div class="login-card">' +
      '<div class="login-logo">👁</div>' +
      '<div class="login-title">بصير <small>BASSIR · OWNER EYES</small></div>' +
      '<div class="login-sub">' + t('عينك على مشروعك — منصة الرؤية البصرية التي تربط المالك بالاستشاري والمقاول<br>وترى بها تقدم مشروعك كما لو كنت في الموقع') + '</div>' +
      (msg ? '<div class="pill p-danger" style="display:block;text-align:center;margin-bottom:12px;padding:10px">' + esc(msg) + '</div>' : '') +
      '<label class="fl">' + t('اسم المستخدم') + '</label><input class="inp num" id="lg-user" autocomplete="username">' +
      '<label class="fl">' + t('كلمة المرور') + '</label><input class="inp num" id="lg-pass" type="password" autocomplete="current-password">' +
      '<div class="m-actions"><button class="btn block" id="lg-go">' + t('دخول') + '</button></div>' +
      '<div class="demo-accounts"><h4>' + t('حسابات تجريبية — اضغط للتعبئة:') + '</h4>' +
      [['owner', 'owner123', '👁 المالك'], ['rep', 'rep123', '🧑‍💼 ممثل المالك'], ['consultant', 'consult123', '📐 الاستشاري'],
       ['cont-arch', 'cont123', '👷 مقاول معماري'], ['cont-str', 'cont123', '🏗️ مقاول إنشائي'], ['admin', 'admin123', '⚙️ الأدمن']]
        .map(function (a) { return '<span class="demo-chip" data-u="' + a[0] + '" data-p="' + a[1] + '">' + t(a[2]) + '</span>'; }).join('') +
      '</div></div></div>';

    wireLangSwitch(app);
    app.querySelectorAll('.demo-chip').forEach(function (c) {
      c.addEventListener('click', function () {
        document.getElementById('lg-user').value = c.getAttribute('data-u');
        document.getElementById('lg-pass').value = c.getAttribute('data-p');
        doLogin();
      });
    });
    document.getElementById('lg-go').addEventListener('click', doLogin);
    document.getElementById('lg-pass').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  }

  async function doLogin() {
    const u = document.getElementById('lg-user').value.trim();
    const p = document.getElementById('lg-pass').value;
    try {
      await Api.login(u, p);
      await boot();
    } catch (e) { renderLogin(e.message); }
  }

  // ============ الهيكل الرئيسي ============
  async function boot() {
    const user = Api.currentUser();
    if (!user) { renderLogin(); return; }
    let S;
    try { S = await Api.state(); }
    catch (e) { await Api.logout(); renderLogin(e.status === 401 ? null : e.message); return; }

    const myPages = PAGES.filter(function (p) { return p.roles.indexOf(user.role) !== -1; });
    const navPages = myPages.filter(function (p) { return !p.topLink; }); // عناصر القائمة (بلا رابط «كل المشاريع»)
    const projectsPage = myPages.find(function (p) { return p.topLink && p.id === 'projects'; });
    let current = resolveId(location.hash.replace('#', '')) || navPages[0].id;
    if (!myPages.some(function (p) { return p.id === current; })) current = navPages[0].id;

    // ============ تعدد المشاريع: المشروع الحالي وترشيح بياناته ============
    let rawS = S;
    let currentProject = sessionStorage.getItem('bassir-project');
    if (!rawS.projects.some(function (p) { return p.id === currentProject; })) {
      currentProject = rawS.projects[0] ? rawS.projects[0].id : null;
    }

    /** يرشّح اللقطة لبيانات المشروع المحدد (كل عنصر يحمل projectId) */
    function scopedState(full, pid) {
      if (!pid || full.projects.length <= 1) return full;
      const c = {};
      Object.keys(full).forEach(function (k) {
        c[k] = Array.isArray(full[k])
          ? full[k].filter(function (x) { return !x || typeof x !== 'object' || !x.projectId || x.projectId === pid; })
          : full[k];
      });
      c.projects = full.projects.filter(function (p) { return p.id === pid; });
      if (!c.projects.length) c.projects = full.projects;
      return c;
    }

    ctx = {
      U: user,
      S: scopedState(rawS, currentProject),
      Sall: rawS, // اللقطة الكاملة (لصفحات عين المالك، المشاريع، المستخدمين)
      projectId: currentProject,
      nav: function (id) { current = resolveId(id); location.hash = current; draw(); },
      setProject: function (pid) {
        currentProject = pid;
        ctx.projectId = pid;
        sessionStorage.setItem('bassir-project', pid);
        ctx.S = scopedState(rawS, pid);
        draw();
      },
      refresh: async function () {
        rawS = await Api.state();
        ctx.Sall = rawS; ctx.S = scopedState(rawS, currentProject); S = rawS;
        draw();
      },
      refreshSilent: async function () {
        rawS = await Api.state();
        ctx.Sall = rawS; ctx.S = scopedState(rawS, currentProject); S = rawS;
        drawSidebar();
      }
    };

    function sidebarHtml() {
      let html = '<div class="brand"><span class="eye">👁</span><div><b>بصير</b><small>OWNER EYES</small></div></div>';
      html += langSwitchHtml();
      // رابط «كل المشاريع» فوق القائمة كمستوى أعلى، لا كعنصر قائمة (§9-1/14)
      if (projectsPage && rawS.projects.length > 1) {
        html += '<a href="#projects" class="all-projects" data-page="projects">‹ ' + esc(t('كل المشاريع')) + '</a>';
      }
      // حقل بحث سريع في القائمة (§10-9)
      html += '<input class="nav-search" id="nav-q" type="search" placeholder="' + esc(t('بحث في القائمة…')) + '" autocomplete="off">';
      let lastSec = '';
      navPages.forEach(function (p) {
        if (p.sec !== lastSec) { html += '<div class="nav-sec">' + esc(t(p.sec)) + '</div>'; lastSec = p.sec; }
        const badge = p.badge ? p.badge(S) : 0;
        html += '<a href="#' + p.id + '" class="nav-item ' + (current === p.id ? 'active' : '') + '" data-page="' + p.id + '" data-label="' + esc(t(p.title)) + '">' +
          '<span class="ico">' + p.icon + '</span>' + esc(t(p.title)) +
          (badge ? '<span class="badge">' + badge + '</span>' : '') + '</a>';
      });
      html += '<div class="side-user"><div class="who">' + esc(user.name) + '</div>' +
        '<div class="role">' + esc(t(ROLE_NAMES[user.role] || user.role)) + (Api.demo ? ' · ' + t('وضع الديمو') : '') + '</div>' +
        '<button class="btn mutedb sm block" id="btn-logout">' + t('تسجيل الخروج') + '</button>' +
        (Api.demo ? '<button class="btn ghost sm block" id="btn-reset" style="margin-top:8px">' + t('↺ إعادة ضبط بيانات الديمو') + '</button>' : '') +
        '</div>';
      return html;
    }

    function drawSidebar() {
      const sb = app.querySelector('.sidebar');
      if (!sb) return;
      sb.innerHTML = sidebarHtml();
      wireSidebar(sb);
    }

    function wireSidebar(sb) {
      wireLangSwitch(sb);
      sb.querySelectorAll('[data-page]').forEach(function (n) {
        n.addEventListener('click', function (e) {
          // احترام فتح تبويب جديد / نافذة جديدة على الرابط الحقيقي (§10-4)
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
          e.preventDefault();
          ctx.nav(n.getAttribute('data-page'));
        });
      });
      // بحث سريع يرشّح عناصر القائمة (§10-9)
      const q = sb.querySelector('#nav-q');
      if (q) q.addEventListener('input', function () {
        const term = q.value.trim().toLowerCase();
        sb.querySelectorAll('.nav-item').forEach(function (n) {
          const lbl = (n.getAttribute('data-label') || n.textContent || '').toLowerCase();
          n.style.display = (!term || lbl.indexOf(term) !== -1) ? '' : 'none';
        });
        sb.querySelectorAll('.nav-sec').forEach(function (s) { s.style.display = term ? 'none' : ''; });
      });
      sb.querySelector('#btn-logout').addEventListener('click', async function () {
        await Api.logout(); location.hash = ''; renderLogin();
      });
      const rs = sb.querySelector('#btn-reset');
      if (rs) rs.addEventListener('click', function () {
        Api.resetDemo(); location.reload();
      });
    }

    function draw() {
      const page = myPages.find(function (p) { return p.id === current; }) || myPages[0];
      const P = ctx.S.projects[0];
      // مبدّل المشروع: يظهر عند وجود أكثر من مشروع في نطاق المستخدم
      const projCtl = rawS.projects.length > 1
        ? '<select class="inp" id="proj-switch" style="max-width:280px;padding:8px 12px;font-size:13px">' +
          rawS.projects.map(function (pp) {
            return '<option value="' + pp.id + '"' + (pp.id === currentProject ? ' selected' : '') + '>🏗️ ' + esc(pp.name) + '</option>';
          }).join('') + '</select>'
        : '<span class="proj">🏗️ ' + esc(P ? P.name : '') + ' · ' + esc(P ? P.location || '' : '') + '</span>';

      // جرس الإشعارات: أحداث دورة المراجعة تصل لصاحبها فور تحديث اللقطة
      const notifs = ctx.S.notifications || [];
      const unread = notifs.filter(function (n) { return (n.readBy || []).indexOf(user.id) === -1; }).length;

      app.innerHTML =
        '<div class="app"><aside class="sidebar">' + sidebarHtml() + '</aside>' +
        '<div class="main"><div class="topbar"><h1>' + page.icon + ' ' + esc(t(page.title)) + '</h1>' +
        projCtl +
        '<span class="spacer"></span>' +
        '<button class="bell" id="btn-bell" title="الإشعارات">🔔' +
        (unread ? '<span class="bell-n">' + unread + '</span>' : '') + '</button>' +
        '<span class="small muted num">' + new Date().toLocaleDateString(I18n.locale(), { year: 'numeric', month: 'long', day: 'numeric' }) + '</span>' +
        '</div>' +
        // فتات المسار (§10-5): المشروع ← القسم ← الصفحة
        '<div class="crumbs">' +
        (P ? '<span>🏗️ ' + esc(P.name) + '</span>' : '') +
        (page.sec ? '<span class="crumb-sep">›</span><span>' + esc(t(page.sec)) + '</span>' : '') +
        '<span class="crumb-sep">›</span><span class="crumb-cur">' + esc(t(page.title)) + '</span>' +
        '</div>' +
        '<div class="content" id="page"></div></div></div>';
      wireSidebar(app.querySelector('.sidebar'));
      const ps = app.querySelector('#proj-switch');
      if (ps) ps.addEventListener('change', function () { ctx.setProject(ps.value); });
      app.querySelector('#btn-bell').addEventListener('click', function () { openNotifications(notifs, unread); });
      page.render(document.getElementById('page'), ctx);
    }

    function openNotifications(notifs, unread) {
      const old = document.querySelector('.notif-pop');
      if (old) { old.remove(); return; }
      const pop = document.createElement('div');
      pop.className = 'notif-pop';
      pop.innerHTML =
        '<div class="flex" style="justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border)">' +
        '<b class="small">🔔 الإشعارات' + (unread ? ' <span class="pill p-danger" style="font-size:10px">' + unread + ' جديد</span>' : '') + '</b>' +
        '<div class="flex" style="gap:6px"><button class="btn ghost sm" id="nt-settings">⚙ الإعدادات</button>' +
        '<button class="btn mutedb sm" id="nt-close">✕</button></div></div>' +
        '<div class="notif-list">' +
        (notifs.length ? notifs.map(function (n) {
          const isNew = (n.readBy || []).indexOf(user.id) === -1;
          return '<div class="notif-row' + (isNew ? ' new' : '') + '">' +
            '<div class="small" style="line-height:1.8">' + esc(n.text) + '</div>' +
            '<div class="small muted num">' + esc(n.time || '') + '</div></div>';
        }).join('') : '<div class="empty" style="padding:26px"><div class="e-ico">🔕</div>لا إشعارات بعد</div>') +
        '</div>';
      document.body.appendChild(pop);
      pop.querySelector('#nt-close').addEventListener('click', function () { pop.remove(); });
      pop.querySelector('#nt-settings').addEventListener('click', function () { pop.remove(); openNotifSettings(); });
      // فتح الجرس يعلّم إشعاراتك كمقروءة
      if (unread) {
        Api.notifyRead().then(function () { return ctx.refreshSilent(); }).then(function () {
          const b = app.querySelector('#btn-bell .bell-n');
          if (b) b.remove();
        }).catch(function () { /* تجاهل */ });
      }
    }

    /** إعدادات الإشعارات: بريد وجوال المستخدم وقنوات وصوله (لنفسه) */
    function openNotifSettings() {
      const p = (ctx.S.profile) || { email: '', phone: '', notifyEmail: true, notifyWhatsapp: false };
      const back = document.createElement('div');
      back.className = 'modal-back';
      back.innerHTML =
        '<div class="modal">' +
        '<h3>⚙ إعدادات الإشعارات</h3>' +
        '<div class="m-sub">تصلك تنبيهات دورة المراجعة داخل النظام، ويمكنك استلامها أيضاً على بريدك أو واتساب.</div>' +
        '<label class="fl">البريد الإلكتروني</label><input class="inp num" id="ns-email" dir="ltr" value="' + esc(p.email || '') + '" placeholder="you@company.com">' +
        '<label class="fl">رقم الجوال (واتساب)</label><input class="inp num" id="ns-phone" dir="ltr" value="' + esc(p.phone || '') + '" placeholder="05xxxxxxxx">' +
        '<label class="fl flex" style="cursor:pointer;margin-top:12px"><input type="checkbox" id="ns-em"' + (p.notifyEmail !== false ? ' checked' : '') + '> 📧 استلام الإشعارات على البريد</label>' +
        '<label class="fl flex" style="cursor:pointer"><input type="checkbox" id="ns-wa"' + (p.notifyWhatsapp ? ' checked' : '') + '> 💬 استلام الإشعارات على واتساب</label>' +
        '<div class="small muted" style="margin-top:8px;line-height:1.8">إن لم تكن قناة البريد/واتساب مهيأة على الخادم، تُسجَّل المحاولة كمحاكاة موثّقة وتظل الإشعارات داخل النظام تعمل دائماً.</div>' +
        '<div class="m-actions"><button class="btn" id="ns-save">حفظ</button><button class="btn mutedb" id="ns-cancel">إلغاء</button></div>' +
        '</div>';
      document.body.appendChild(back);
      back.querySelector('#ns-cancel').addEventListener('click', function () { back.remove(); });
      back.addEventListener('click', function (e) { if (e.target === back) back.remove(); });
      back.querySelector('#ns-save').addEventListener('click', async function () {
        try {
          await Api.updateProfile({
            email: back.querySelector('#ns-email').value,
            phone: back.querySelector('#ns-phone').value,
            notifyEmail: back.querySelector('#ns-em').checked,
            notifyWhatsapp: back.querySelector('#ns-wa').checked
          });
          back.remove();
          VS.toast('✅ حُفظت تفضيلات الإشعارات');
          ctx.refreshSilent();
        } catch (e) { VS.toast(e.message, true); }
      });
    }

    draw();
  }

  window.addEventListener('hashchange', function () {
    if (!ctx) return;
    const id = location.hash.replace('#', '');
    if (id) ctx.nav(id);
  });

  boot();
})();

</script>
</body>
</html>
