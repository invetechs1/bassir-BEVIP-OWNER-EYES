    function H() { return canvas.clientHeight; }
    function activeAnns() { return viewingRev ? (viewingRev.annotations || []) : anns; }
    function pageAnns() { return activeAnns().filter(function (a) { return (a.page || 1) === page; }); }

    function drawArrow(a) {
      const x1 = a.from[0] * W(), y1 = a.from[1] * H(), x2 = a.to[0] * W(), y2 = a.to[1] * H();
      cx2.beginPath(); cx2.moveTo(x1, y1); cx2.lineTo(x2, y2); cx2.stroke();
      const ang = Math.atan2(y2 - y1, x2 - x1);
      cx2.beginPath();
      cx2.moveTo(x2, y2);
      cx2.lineTo(x2 - 14 * Math.cos(ang - 0.45), y2 - 14 * Math.sin(ang - 0.45));
      cx2.lineTo(x2 - 14 * Math.cos(ang + 0.45), y2 - 14 * Math.sin(ang + 0.45));
      cx2.closePath(); cx2.fillStyle = cx2.strokeStyle; cx2.fill();
    }

    /** سحابة مراجعة: أقواس متتالية على محيط المستطيل */
    function drawCloud(a) {
      const x = Math.min(a.from[0], a.to[0]) * W(), y = Math.min(a.from[1], a.to[1]) * H();
      const w = Math.abs(a.to[0] - a.from[0]) * W(), h = Math.abs(a.to[1] - a.from[1]) * H();
      if (w < 8 || h < 8) return;
      const r = Math.max(7, Math.min(14, Math.min(w, h) / 6));
      cx2.beginPath();
      let i;
      const nx = Math.max(2, Math.round(w / (r * 1.6))), ny = Math.max(2, Math.round(h / (r * 1.6)));
      for (i = 0; i < nx; i++) cx2.arc(x + (i + 0.5) * w / nx, y, r, Math.PI, 0);              // أعلى
      for (i = 0; i < ny; i++) cx2.arc(x + w, y + (i + 0.5) * h / ny, r, -Math.PI / 2, Math.PI / 2); // يمين
      for (i = nx - 1; i >= 0; i--) cx2.arc(x + (i + 0.5) * w / nx, y + h, r, 0, Math.PI);     // أسفل
      for (i = ny - 1; i >= 0; i--) cx2.arc(x, y + (i + 0.5) * h / ny, r, Math.PI / 2, -Math.PI / 2); // يسار
      cx2.stroke();
    }

    function drawStamp(a) {
      const x = a.at[0] * W(), y = a.at[1] * H();
      cx2.font = '800 16px Tahoma';
      const tw = cx2.measureText(a.text).width;
      cx2.save();
      cx2.translate(x, y); cx2.rotate(-0.12);
      cx2.strokeStyle = a.color; cx2.lineWidth = 2.5;
      cx2.globalAlpha = 0.9;
      cx2.strokeRect(-tw / 2 - 14, -20, tw + 28, 40);
      cx2.fillStyle = a.color; cx2.textAlign = 'center'; cx2.textBaseline = 'middle';
      cx2.fillText(a.text, 0, 1);
      if (a.by) { cx2.font = '600 9px Tahoma'; cx2.fillText(a.by + ' · ' + (a.date || ''), 0, 14); }
      cx2.restore();
      cx2.textAlign = 'start'; cx2.textBaseline = 'alphabetic'; cx2.globalAlpha = 1;
    }

    function drawAnn(a) {
      cx2.strokeStyle = a.color; cx2.fillStyle = a.color; cx2.lineWidth = 2.5; cx2.lineJoin = 'round'; cx2.lineCap = 'round';
      if (a.type === 'pen') {
        cx2.beginPath();
        a.points.forEach(function (pt, i) { i ? cx2.lineTo(pt[0] * W(), pt[1] * H()) : cx2.moveTo(pt[0] * W(), pt[1] * H()); });
        cx2.stroke();
      } else if (a.type === 'rect') {
        cx2.strokeRect(a.from[0] * W(), a.from[1] * H(), (a.to[0] - a.from[0]) * W(), (a.to[1] - a.from[1]) * H());
      } else if (a.type === 'hl') {
        cx2.globalAlpha = 0.3;
        cx2.fillRect(a.from[0] * W(), a.from[1] * H(), (a.to[0] - a.from[0]) * W(), (a.to[1] - a.from[1]) * H());
        cx2.globalAlpha = 1;
      } else if (a.type === 'cloud') {
        drawCloud(a);
      } else if (a.type === 'arrow') {
        drawArrow(a);
      } else if (a.type === 'stamp') {
        drawStamp(a);
      } else if (a.type === 'text') {
        cx2.font = '700 15px Tahoma'; cx2.direction = 'rtl';
        cx2.fillText(a.text, a.at[0] * W(), a.at[1] * H());
      } else if (a.type === 'pin') {
        const x = a.at[0] * W(), y = a.at[1] * H();
        cx2.beginPath(); cx2.arc(x, y, 12, 0, 7); cx2.fill();
        cx2.fillStyle = '#10151f'; cx2.font = '800 12px Tahoma'; cx2.textAlign = 'center'; cx2.textBaseline = 'middle';
        cx2.fillText(String(a.n), x, y + 1);
        cx2.textAlign = 'start'; cx2.textBaseline = 'alphabetic';
      }
    }

    function redraw() {
      cx2.clearRect(0, 0, W(), H());
      pageAnns().forEach(drawAnn);
      if (current) drawAnn(current);
      drawPinsList();
      drawHistory();
    }

    // ============ قائمة الملاحظات + ردود المقاول على نفس المستند ============
    function drawPinsList() {
      const list = activeAnns();
      const noted = list.filter(function (a) { return a.type === 'pin' || a.type === 'text' || a.type === 'stamp'; });
      const box = back.querySelector('#dv-pins');
      if (!noted.length) {
        box.innerHTML = '<div class="small muted">' + (canDraw ? 'ارسم على المستند أو أضف ملاحظات مرقمة 📍 بالنقر على الموضع' : 'لا توجد ملاحظات مرسومة على هذا المستند') + '</div>';
        return;
      }
      box.innerHTML = '<b class="small">📍 الملاحظات على المستند' + (viewingRev ? ' (نسخة ' + viewingRev.rev + ' مؤرشفة)' : '') + ':</b>' +
        noted.map(function (a) {
          const idx = list.indexOf(a);
          const badge = a.type === 'pin' ? String(a.n) : a.type === 'stamp' ? '🔖' : '🅰';
          return '<div class="dv-pin-row" style="align-items:flex-start;flex-direction:column">' +
            '<div class="flex" style="gap:8px"><span class="dv-pin-n" style="background:' + a.color + '">' + badge + '</span>' +
            '<span class="small">' + esc(a.text) + (a.page && numPages > 1 ? ' <span class="muted num">(ص' + a.page + ')</span>' : '') + '</span></div>' +
            (a.replies || []).map(function (r) {
              return '<div class="small dv-reply">↩ <b>' + esc(r.by) + '</b> <span class="muted num">' + esc(r.date) + '</span><br>' + esc(r.text) + '</div>';
            }).join('') +
            (canRespond && !viewingRev && a.type !== 'stamp' ? '<button class="btn ghost sm" data-reply="' + idx + '" style="margin-top:4px">↩ رد على الملاحظة</button>' : '') +
            '</div>';
        }).join('');
      box.querySelectorAll('[data-reply]').forEach(function (b) {
        b.addEventListener('click', function () {
          const a = anns[Number(b.getAttribute('data-reply'))];
          const txt = prompt('ردك على الملاحظة (يُسجل باسمك على نفس المستند):');
          if (!txt) return;
          if (!a.replies) a.replies = [];
          a.replies.push({ by: ctx.U.name, date: new Date().toISOString().slice(0, 10), text: txt });
          dirty = true; redraw();
        });
      });
    }

    // ============ سجل الحالات والنسخ (Audit trail داخل المستند) ============
    function drawHistory() {
      const box = back.querySelector('#dv-history');
      const hist = item.history || [];
      const revs = item.revisions || [];
      if (!hist.length && !revs.length) { box.innerHTML = ''; return; }
      box.innerHTML =
        '<div class="dv-pins">' +
        (revs.length ?
          '<b class="small">🗂 نسخ المستند (' + (revs.length + 1) + '):</b>' +
          '<div class="flex" style="flex-wrap:wrap;gap:6px;margin:8px 0">' +
          revs.map(function (r) {
            return '<button class="btn ghost sm' + (viewingRev === r ? ' active' : '') + '" data-rev="' + r.rev + '">نسخة ' + r.rev +
              ' <span class="muted num">' + esc(r.archivedAt || '') + '</span></button>';
          }).join('') +
          '<button class="btn ' + (viewingRev ? 'ghost ' : '') + 'sm" data-rev="cur">النسخة الحالية</button></div>' : '') +
        (hist.length ?
          '<b class="small">🕓 سجل الحالات:</b>' +
          hist.slice().reverse().map(function (h) {
            return '<div class="dv-hist-row"><span class="num muted small">' + esc(h.date || '') + '</span> ' +
              '<b class="small">' + esc(HIST_LABELS[h.status] || h.status) + '</b>' +
              '<span class="small muted"> — ' + esc(h.by || '') + '</span>' +
              (h.notes ? '<div class="small muted" style="margin-top:2px">' + esc(h.notes) + '</div>' : '') + '</div>';
          }).join('') : '') +
        ((item.reviewDays != null && item.reviewEndDate) ?
          '<div class="small mt" style="color:var(--accent2)">⏱ مدة المراجعة: <b class="num">' + item.reviewDays + '</b> يوم (' +
          esc(item.reviewStartDate || item.date || '') + ' ← ' + esc(item.reviewEndDate) + ')</div>' : '') +
        '</div>';
      box.querySelectorAll('[data-rev]').forEach(function (b) {
        b.addEventListener('click', function () {
          const v = b.getAttribute('data-rev');
          viewingRev = v === 'cur' ? null : revs.find(function (r) { return String(r.rev) === v; }) || null;
          redraw();
        });
      });
    }

    function pos(ev) {
      const r = canvas.getBoundingClientRect();
      return [(ev.clientX - r.left) / r.width, (ev.clientY - r.top) / r.height];
    }

    // ============ ربط مناطق المخطط ببنود الكميات (§6 من وثيقة المتطلبات) ============
    // كل منطقة مستطيلة تُخزَّن بإحداثيات منسوبة (0..1) لنفس الصفحة، ونفس نمط تخزين
    // الترميز أعلاه — وتُلوَّن حسب نسبة إنجاز بند الكميات المربوط بها (bq.progress)،
    // بلا أي حساب مواز؛ نفس مصدر الحقيقة الذي تعتمده لوحة القيادة والتقارير.
    const mapLayer = showMap ? back.querySelector('#dv-maplayer') : null;
    const mapPanel = showMap ? back.querySelector('#dv-mappanel') : null;

    function mapStatusColor(bq) {
      if (!bq) return null;
      const p = bq.progress || 0;
      if (p >= 100) return '#30a46c';
      if (p > 0) return '#f5a524';
      return '#3a4258';
    }
    function pageMappings() {
      if (!showMap) return [];
      return (ctx.S.drawingMappings || []).filter(function (m) { return m.drawingId === item.id && (m.page || 1) === page; });
    }
    function boqOf(m) { return (ctx.S.boqItems || []).find(function (b) { return b.id === m.boqItemId; }) || null; }
    function relevantBoq() {
      return (ctx.S.boqItems || []).filter(function (b) { return !item.floor || item.floor === 'ELEV' || b.floor === item.floor; })
        .sort(function (a, b) { return (a.code || '').localeCompare(b.code || ''); });
    }
    function mapPosPct(ev) {
      const r = mapLayer.getBoundingClientRect();
      return [Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)), Math.max(0, Math.min(1, (ev.clientY - r.top) / r.height))];
    }

    /** منطقة مرسومة للتو ولم تُحفظ بعد — لا تُكتب على الخادم إلا بعد اختيار بند كميات صراحةً (§ لا سجلات يتيمة) */
    function renderPendingPanel() {
      const x = Math.min(mapDraft.from[0], mapDraft.to[0]), y = Math.min(mapDraft.from[1], mapDraft.to[1]);
      const w = Math.abs(mapDraft.to[0] - mapDraft.from[0]), h = Math.abs(mapDraft.to[1] - mapDraft.from[1]);
      mapPanel.innerHTML =
        '<b class="small">▭ ' + I18n.t('منطقة جديدة — لم تُحفظ بعد') + '</b>' +
        '<div class="mt">' +
        '<label class="fl">' + I18n.t('اربط ببند كميات') + '</label>' +
        '<select class="inp" id="dm-boqsel"><option value="">' + I18n.t('اختر بند كميات...') + '</option>' +
        relevantBoq().map(function (b) { return '<option value="' + b.id + '">' + esc(b.code || b.id) + ' — ' + esc(b.description || '') + '</option>'; }).join('') + '</select>' +
        '<label class="fl">' + I18n.t('نسبة التخصيص لهذه المنطقة') + '</label>' +
        '<input class="inp num" id="dm-pct" type="number" min="1" max="100" value="100">' +
        '<div class="m-actions">' +
        '<button class="btn sm" id="dm-save">💾 ' + I18n.t('حفظ الربط') + '</button>' +
        '<button class="btn mutedb sm" id="dm-cancel">' + I18n.t('إلغاء') + '</button>' +
        '</div></div>';
      mapPanel.querySelector('#dm-save').addEventListener('click', async function () {
        const boqItemId = mapPanel.querySelector('#dm-boqsel').value;
        if (!boqItemId) { VS.toast(I18n.t('اختر بند كميات...'), true); return; }
        const pct = Math.max(1, Math.min(100, Number(mapPanel.querySelector('#dm-pct').value) || 100));
        try {
          const created = await Api.create('drawingMappings', {
            drawingId: item.id, projectId: ctx.projectId, page: page, x: x, y: y, w: w, h: h,
            boqItemId: boqItemId, allocationPct: pct
          });
          mapDraft = null;
          await ctx.refreshSilent();
          mapSelected = created;
          VS.toast(I18n.t('تم الربط بنجاح'));
          renderMapLayer(); renderMapPanel();
        } catch (e) { VS.toast(e.message, true); }
      });
      mapPanel.querySelector('#dm-cancel').addEventListener('click', function () {
        mapDraft = null; // لم يُكتب شيء على الخادم بعد — إلغاء نظيف بلا أي أثر
        renderMapLayer(); renderMapPanel();
      });
    }

    function renderMapPanel() {
      if (!mapPanel) return;
      if (mapDraft) { renderPendingPanel(); return; }
      if (!mapSelected) {
        mapPanel.innerHTML = '<div class="small muted">' + I18n.t('اختر منطقة مرسومة، أو ارسم منطقة جديدة لربطها ببند كميات.') + '</div>';
        return;
      }
      const m = mapSelected;
      const bq = boqOf(m);
      let html = '<b class="small">📐 ' + I18n.t('منطقة مرتبطة') + '</b>';
      if (bq) {
        html += '<div class="mt small"><b>' + esc(bq.code || bq.id) + '</b> — ' + esc(bq.description || '') + '</div>' +
          '<div class="flex" style="justify-content:space-between;margin-top:8px"><span class="small muted">' + I18n.t('الإنجاز المعتمد') + '</span><b class="num small">' + (bq.progress || 0) + '%</b></div>' +
          '<div class="bar" style="margin-top:4px"><i style="width:' + (bq.progress || 0) + '%;background:' + mapStatusColor(bq) + '"></i></div>' +
          '<div class="small muted mt">' + I18n.t('نسبة التخصيص') + ': <b class="num">' + (m.allocationPct || 100) + '%</b></div>';
      }
      if (canMap) {
        html += '<div class="mt" style="border-top:1px solid var(--border);padding-top:10px">' +
          '<label class="fl">' + (bq ? I18n.t('تغيير الربط') : I18n.t('اربط ببند كميات')) + '</label>' +
          '<select class="inp" id="dm-boqsel"><option value="">' + I18n.t('اختر بند كميات...') + '</option>' +
          relevantBoq().map(function (b) {
            return '<option value="' + b.id + '"' + (m.boqItemId === b.id ? ' selected' : '') + '>' + esc(b.code || b.id) + ' — ' + esc(b.description || '') + '</option>';
          }).join('') + '</select>' +
          '<label class="fl">' + I18n.t('نسبة التخصيص لهذه المنطقة') + '</label>' +
          '<input class="inp num" id="dm-pct" type="number" min="1" max="100" value="' + (m.allocationPct || 100) + '">' +
          '<div class="m-actions">' +
          '<button class="btn sm" id="dm-save">💾 ' + I18n.t('حفظ الربط') + '</button>' +
          (canDeleteMap ? '<button class="btn danger sm" id="dm-del">🗑 ' + I18n.t('حذف المنطقة') + '</button>' : '') +
          '</div></div>';
      }
      mapPanel.innerHTML = html;
      const saveBtn = mapPanel.querySelector('#dm-save');
      if (saveBtn) saveBtn.addEventListener('click', async function () {
        const boqItemId = mapPanel.querySelector('#dm-boqsel').value;
        if (!boqItemId) { VS.toast(I18n.t('اختر بند كميات...'), true); return; }
        const pct = Math.max(1, Math.min(100, Number(mapPanel.querySelector('#dm-pct').value) || 100));
        try {
          await Api.update('drawingMappings', m.id, { boqItemId: boqItemId, allocationPct: pct });
          await ctx.refreshSilent();
          VS.toast(I18n.t('تم الربط بنجاح'));
          mapSelected = (ctx.S.drawingMappings || []).find(function (x) { return x.id === m.id; }) || null;
          renderMapLayer(); renderMapPanel();
        } catch (e) { VS.toast(e.message, true); }
      });
      const delBtn = mapPanel.querySelector('#dm-del');
      if (delBtn) delBtn.addEventListener('click', async function () {
        if (!confirm(I18n.t('حذف هذه المنطقة نهائياً؟'))) return;
        try {
          await Api.remove('drawingMappings', m.id);
          await ctx.refreshSilent();
          mapSelected = null;
          VS.toast(I18n.t('تم الحذف'));
          renderMapLayer(); renderMapPanel();
        } catch (e) { VS.toast(e.message, true); }
      });
    }

    function renderMapLayer() {
      if (!mapLayer) return;
      mapLayer.innerHTML = '';
      pageMappings().forEach(function (m) {
        const bq = boqOf(m);
        const box = document.createElement('div');
        box.style.cssText = 'position:absolute;cursor:pointer;border:1.5px solid;left:' + (m.x * 100) + '%;top:' + (m.y * 100) + '%;width:' + (m.w * 100) + '%;height:' + (m.h * 100) + '%;';
        const c = mapStatusColor(bq) || '#8b95a8';
        box.style.borderColor = c;
        box.style.background = c + (bq ? '46' : '22');
        if (m === mapSelected || (mapSelected && mapSelected.id === m.id)) box.style.boxShadow = '0 0 0 2px var(--accent)';
        box.title = bq ? (bq.code || bq.id) + ' — ' + (bq.progress || 0) + '%' : I18n.t('غير مربوط');
        box.addEventListener('click', function (e) {
          e.stopPropagation();
          if (mapTool !== 'select') return;
          mapDraft = null; // اختيار منطقة موجودة يُلغي أي رسم جديد غير محفوظ (لم يُكتب على الخادم أصلاً)
          mapSelected = m;
          renderMapLayer(); renderMapPanel();
        });
        mapLayer.appendChild(box);
      });
      if (mapDraft) {
        const box = document.createElement('div');
        const x = Math.min(mapDraft.from[0], mapDraft.to[0]), y = Math.min(mapDraft.from[1], mapDraft.to[1]);
        const w = Math.abs(mapDraft.to[0] - mapDraft.from[0]), h = Math.abs(mapDraft.to[1] - mapDraft.from[1]);
        box.style.cssText = 'position:absolute;border:1.5px dashed var(--accent);background:rgba(224,164,88,.18);left:' + (x * 100) + '%;top:' + (y * 100) + '%;width:' + (w * 100) + '%;height:' + (h * 100) + '%;';
        mapLayer.appendChild(box);
      }
    }

    if (showMap) {
      const toggleBtn = back.querySelector('#dv-maptoggle');
      const maptools = back.querySelector('#dv-maptools');
      toggleBtn.addEventListener('click', function () {
        mapMode = !mapMode;
        toggleBtn.classList.toggle('active', mapMode);
        maptools.style.display = mapMode ? '' : 'none';
        mapLayer.style.display = mapMode ? '' : 'none';
        mapPanel.style.display = mapMode ? '' : 'none';
        canvas.style.pointerEvents = mapMode ? 'none' : '';
        if (mapMode) { renderMapLayer(); renderMapPanel(); }
      });
      back.querySelectorAll('.dv-maptool').forEach(function (b) {
        b.addEventListener('click', function () {
          mapTool = b.getAttribute('data-maptool');
          back.querySelectorAll('.dv-maptool').forEach(function (x) { x.classList.toggle('active', x === b); });
          mapLayer.style.cursor = mapTool === 'draw' ? 'crosshair' : 'default';
        });
      });
    }

    // رسم منطقة جديدة — الاستشاري/الأدمن فقط. العرض والتحديد أعلاه متاحان لأي دور (canMap ⊂ showMap)
    if (canMap) {
      let mapDown = null;
      mapLayer.addEventListener('pointerdown', function (ev) {
        if (mapTool !== 'draw') return;
        mapDown = mapPosPct(ev);
        mapDraft = { from: mapDown, to: mapDown };
        mapLayer.setPointerCapture(ev.pointerId);
      });
      mapLayer.addEventListener('pointermove', function (ev) {
        if (!mapDraft) return;
        mapDraft.to = mapPosPct(ev);
        renderMapLayer();
      });
      mapLayer.addEventListener('pointerup', function () {
        if (!mapDraft) return;
        const w = Math.abs(mapDraft.to[0] - mapDraft.from[0]), h = Math.abs(mapDraft.to[1] - mapDraft.from[1]);
        if (w < 0.02 || h < 0.02) { mapDraft = null; renderMapLayer(); return; } // منطقة أصغر من أن تكون مقصودة
        // لا كتابة على الخادم هنا — تبقى محلية فقط حتى يختار المستخدم بند كميات ويحفظ صراحةً (renderPendingPanel)
        mapSelected = null;
        mapTool = 'select';
        back.querySelectorAll('.dv-maptool').forEach(function (x2) { x2.classList.toggle('active', x2.getAttribute('data-maptool') === 'select'); });
        renderMapLayer(); renderMapPanel();
      });
    }

    if (canDraw) {
      canvas.style.cursor = 'crosshair';
      canvas.addEventListener('pointerdown', function (ev) {
        if (viewingRev) return; // النسخ المؤرشفة للقراءة فقط
        const p = pos(ev);
        if (tool === 'stamp') {
          const s = STAMPS[stampIdx];
          anns.push({ type: 'stamp', at: p, text: s[0], color: s[1], page: page,
            by: ctx.U.name, date: new Date().toISOString().slice(0, 10) });
          dirty = true; redraw();
          return;
        }
        if (tool === 'text' || tool === 'pin') {
          const txt = prompt(tool === 'pin' ? 'نص الملاحظة المرقمة:' : 'النص الذي سيكتب على المستند:');
          if (txt) {
            if (tool === 'pin') {
              const n = anns.filter(function (a) { return a.type === 'pin'; }).length + 1;
              anns.push({ type: 'pin', at: p, text: txt, color: color, n: n, page: page, by: ctx.U.name });
            } else {
              anns.push({ type: 'text', at: p, text: txt, color: color, page: page, by: ctx.U.name });
            }
            dirty = true; redraw();
          }
          return;
        }
        canvas.setPointerCapture(ev.pointerId);
        current = tool === 'pen'
          ? { type: 'pen', points: [p], color: color, page: page }
          : { type: tool, from: p, to: p, color: color, page: page };
      });
      canvas.addEventListener('pointermove', function (ev) {
        if (!current) return;
        const p = pos(ev);
        if (current.type === 'pen') current.points.push(p); else current.to = p;
        redraw();
      });
      canvas.addEventListener('pointerup', function () {
        if (!current) return;
        anns.push(current); current = null; dirty = true; redraw();
      });

      back.querySelectorAll('.dv-tool').forEach(function (b) {
        b.addEventListener('click', function () {
          tool = b.getAttribute('data-tool');
          back.querySelector('#dv-stampsel').style.display = tool === 'stamp' ? '' : 'none';
          back.querySelectorAll('.dv-tool').forEach(function (x) { x.classList.toggle('active', x === b); });
        });
      });
      back.querySelector('#dv-stampsel').addEventListener('change', function (e) { stampIdx = Number(e.target.value); });
      back.querySelectorAll('.dv-color').forEach(function (b) {
        b.addEventListener('click', function () {
          color = b.getAttribute('data-color');
          back.querySelectorAll('.dv-color').forEach(function (x) { x.classList.toggle('active', x === b); });
        });
      });
      back.querySelector('#dv-undo').addEventListener('click', function () { anns.pop(); dirty = true; redraw(); });
      back.querySelector('#dv-clearall').addEventListener('click', function () {
        if (anns.length && confirm('مسح كل الترميز عن المستند؟')) { anns = []; dirty = true; redraw(); }
      });
      back.querySelector('#dv-save').addEventListener('click', function () { saveAnns(true); });
    }

    async function saveAnns(showToast) {
      try {
        await Api.update(collection, item.id, {
          annotations: anns,
          markupBy: ctx.U.name,
          markupDate: new Date().toISOString().slice(0, 10)
        });
        item.annotations = anns; dirty = false;
        if (showToast) VS.toast('💾 حُفظ على نفس المستند — بلا نسخ مكررة');
      } catch (e) { VS.toast(e.message, true); }
    }

    async function decide(status) {
      try {
        if (dirty || anns.length !== (item.annotations || []).length) await saveAnns(false);
        await Api.review({
          collection: collection, id: item.id, status: status,
          notes: back.querySelector('#dv-notes').value ||
            (status === 'rejected' ? 'مرجع للمقاول لعمل اللازم — راجع الترميز على المخطط' : '')
        });
        back.remove();
        VS.toast(status === 'rejected' ? '↩ أُرجع المستند للمقاول مع الترميز والملاحظات' : '✅ اعتُمد المستند بتوقيعك');
        if (opts.onDone) opts.onDone(); else ctx.refresh();
      } catch (e) { VS.toast(e.message, true); }
    }

    if (canReview) {
      back.querySelector('#dv-approve').addEventListener('click', function () { decide('approved'); });
      back.querySelector('#dv-approve-notes').addEventListener('click', function () { decide('approved_notes'); });
      back.querySelector('#dv-reject').addEventListener('click', function () { decide('rejected'); });
    }

    // إعادة التقديم: أرشفة النسخة ورجوع المستند لقيد المراجعة — دورة متصلة
    if (canRespond) {
      back.querySelector('#dv-resubmit').addEventListener('click', async function () {
        if (!confirm('إعادة تقديم المستند للمراجعة؟ ستؤرشف النسخة الحالية بترميزها وقرارها في سجل النسخ.')) return;
        try {
          if (dirty) await saveAnns(false);
          let newFile = null;
          const rf = back.querySelector('#dv-refile').files[0];
          if (rf) newFile = await Api.upload(rf, { versionOf: item.file && item.file.id });
          await Api.resubmit({ collection: collection, id: item.id, file: newFile || undefined });
          back.remove();
          VS.toast('🔄 أُعيد التقديم — أُرشفت النسخة السابقة وعاد المستند لقيد المراجعة');
          if (opts.onDone) opts.onDone(); else ctx.refresh();
        } catch (e) { VS.toast(e.message, true); }
      });
    }

    back.querySelector('#dv-close').addEventListener('click', function () {
      if (dirty && canDraw && confirm('لديك ترميز غير محفوظ — حفظه قبل الإغلاق؟')) { saveAnns(true).then(function () { back.remove(); }); return; }
      back.remove();
    });
    back.addEventListener('click', function (e) { if (e.target === back && !dirty) back.remove(); });

    if (img) { img.addEventListener('load', fit); if (img.complete) fit(); }
    else if (f.isPdf) openPdf();
    else if (f.isDxf) setTimeout(openDxf, 30);
    else setTimeout(fit, 30);
    window.addEventListener('resize', fit);
  }

  /** زر فتح العارض لعنصر فيه ملف أو ترميز */
  function viewerBtn(item, extra) {
    if (!item.file && !(item.annotations || []).length) return '';
    const n = (item.annotations || []).length;
    const f = fileOf(item);
    return '<button class="btn ghost sm" data-dview="' + item.id + '"' + (extra || '') + '>' +
      (f.isPdf ? '📄 PDF' : f.isDxf ? '📐 DXF' : '🖊 المخطط') +
      (n ? ' <span class="pill p-warn" style="font-size:10px;padding:1px 7px">' + n + '</span>' : '') + '</button>';
  }

  window.DrawingViewer = { open: openDrawingViewer, btn: viewerBtn };
})();

/**
 * بصير | عارض BIM/IFC ثلاثي الأبعاد الحقيقي (web-ifc + three.js)
 * يفتح ملف IFC فعلياً داخل المتصفح، يقرأ هندسته، ويعرضه بتدوير/تكبير تفاعلي
 * — بلا أي خدمة خارجية. (DWG/RVT الأصلية تحتاج مسار Autodesk APS المنفصل.)
 *
 * ربط عناصر BIM ببنود جدول الكميات (§10-12 من وثيقة المتطلبات):
 * كل عنصر في النموذج (عمود، بلاطة، لوح واجهة...) له expressID حقيقي من ملف الـIFC.
 * عند تمرير ctx + modelId، يُلوَّن كل عنصر حسب نسبة إنجاز بند الكميات المربوط به —
 * فيتحول من داكن/شفاف (غير مربوط) إلى كهرماني (جزئي) إلى أخضر ساطع (معتمد بالكامل)،
 * بنفس مصدر الحقيقة الذي تعتمده لوحة القيادة والتقارير (bq.progress) — لا حساب مواز.
 * إن كان canMap=true (استشاري/أدمن)، يمكن النقر على عنصر وربطه ببند كميات مباشرة.
 */
(function () {
  'use strict';

  I18n.registerDict({
    'ربط عناصر النموذج ببنود الكميات': 'Link Model Elements to BOQ Items',
    'اختر عنصراً في النموذج لعرض تفاصيله': 'Select an element in the model to see its details',

    'الفئة': 'Category',
    'المعرّف الفريد (GUID)': 'Unique ID (GUID)',
    'بند الكميات المربوط': 'Linked BOQ Item',
    'غير مربوط بعد': 'Not linked yet',
    'اربط ببند كميات': 'Link to a BOQ Item',
    'اختر بند كميات...': 'Select a BOQ item…',
    'نسبة التخصيص لهذا العنصر': 'Allocation for this element',
    'حفظ الربط': 'Save Link',
    'إلغاء الربط': 'Remove Link',
    'تم الربط بنجاح': 'Linked successfully',
    'تم إلغاء الربط': 'Link removed',
    'الإنجاز المعتمد': 'Approved Progress',
    'القيمة المعتمدة': 'Approved Value',
    'دلالة الألوان': 'Color Key',
    'غير مربوط': 'Not linked',
    'لم يبدأ': 'Not started',
    'إنجاز جزئي': 'Partially approved',
    'معتمد بالكامل': 'Fully approved',
    'عناصر مربوطة': 'elements linked',
    'انقر أي عنصر في النموذج لعرض تفاصيله أو ربطه ببند كميات.': 'Click any element in the model to see its details or link it to a BOQ item.',
    'عنصر بلا اسم': 'Unnamed element'
  });

  let webifcPromise = null;
  function loadThree() { return import('/vendor/bim/three.module.js'); }
  function loadWebIFC() {
    if (window.WebIFC) return Promise.resolve(window.WebIFC);
    if (webifcPromise) return webifcPromise;
    webifcPromise = new Promise(function (res, rej) {
      const s = document.createElement('script');
      s.src = '/vendor/bim/web-ifc-api-iife.js';
      s.onload = function () { res(window.WebIFC); };
      s.onerror = function () { rej(new Error('تعذّر تحميل محرك IFC')); };
      document.head.appendChild(s);
    });
    return webifcPromise;
  }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // ألوان الحالة — نفس القيم الدلالية المستخدمة في باقي النظام (styles.css) لا حساب مواز
  const COL_OK = 0x30a46c, COL_WARN = 0xf5a524, COL_NONE = 0x3a4258;

  /** يحسب حالة العنصر ولونه من نسبة إنجاز بند الكميات المربوط به فقط (bq.progress — مصدر الحقيقة الوحيد) */
  function statusOf(boqItem) {
    if (!boqItem) return { key: 'unlinked', color: null };
    const p = boqItem.progress || 0;
    if (p >= 100) return { key: 'ok', color: COL_OK, pct: p };
    if (p > 0) return { key: 'warn', color: COL_WARN, pct: p };
    return { key: 'none', color: COL_NONE, pct: p };
  }

  /**
   * فتح عارض BIM.
   * opts: { title, url, ctx, modelId, canMap }
   *  - ctx + modelId: يُفعّلان تلوين العناصر حسب اعتماد بنود الكميات المربوطة (لكل الأدوار، قراءة).
   *  - canMap: يُظهر لوحة الربط الجانبية للنقر وربط/إلغاء ربط عنصر ببند كميات (استشاري/أدمن فقط).
   */
  async function open(opts) {
    opts = opts || {};
    const ctx = opts.ctx || null;
    const modelId = opts.modelId || null;
    const canMap = !!opts.canMap && !!ctx && !!modelId;
    const canDelete = canMap && ctx.U.role === 'admin'; // الحذف متاح للأدمن فقط — يطابق قاعدة النظام العامة (deleteItem)
    const showPanel = !!ctx; // لوحة القراءة تظهر لأي دور مرّر ctx، والربط الفعلي يقتصر على canMap

    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML =
      '<div class="dv-wrap" style="width:min(1280px,97vw)">' +
      '<div class="dv-head"><div><b>🧊 ' + esc(opts.title || I18n.t('نموذج BIM')) + '</b>' +
      '<div class="small muted" id="bv-info">' + I18n.t('جارٍ تحميل محرك BIM وقراءة النموذج...') + '</div></div>' +
      '<span class="spacer"></span>' +
      '<div class="flex" style="gap:6px">' +
      '<button class="btn mutedb sm" id="bv-fit">⤢ ' + I18n.t('ملاءمة') + '</button>' +
      '<button class="btn mutedb sm" id="bv-wire">🔲 ' + I18n.t('شبكي') + '</button>' +
      '<button class="btn mutedb sm" id="bv-close">✕ ' + I18n.t('إغلاق') + '</button></div></div>' +

      '<div class="dv-body">' +
      '<div class="dv-stage-wrap" style="padding:0">' +
      '<div class="bv-stage" id="bv-stage" style="position:relative;background:#0d1017;border-radius:12px;height:70vh;overflow:hidden">' +
      '<div id="bv-loading" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b95a8;flex-direction:column;gap:10px;z-index:2">' +
      '<div style="font-size:34px">🧊</div><div class="small">' + I18n.t('جارٍ بناء النموذج ثلاثي الأبعاد...') + '</div></div></div>' +
      '<div class="small muted mt">🖱 ' + I18n.t('اسحب للتدوير · عجلة الماوس للتكبير · اسحب باليمين للتحريك') + (showPanel ? ' · ' + I18n.t('انقر عنصراً لعرض تفاصيله') : '') + '</div>' +
      '</div>' +
      (showPanel ?
        '<div class="dv-side" id="bv-side">' +
        '<div class="dv-pins" id="bv-legend"></div>' +
        '<div class="dv-review" id="bv-panel"><div class="small muted">' + I18n.t('اختر عنصراً في النموذج لعرض تفاصيله') + '</div></div>' +
        '</div>' : '') +
      '</div>' +
      '</div>';
    document.body.appendChild(back);
    const stage = back.querySelector('#bv-stage');
    const info = back.querySelector('#bv-info');
    const panelEl = back.querySelector('#bv-panel');
    const legendEl = back.querySelector('#bv-legend');
    const toast = (window.ViewsShared && window.ViewsShared.toast) || function (m) { console.log(m); };

    function close() { cancelAnimationFrame(raf); try { renderer && renderer.dispose(); } catch (e) {} back.remove(); window.removeEventListener('resize', onResize); }
    back.querySelector('#bv-close').addEventListener('click', close);
    back.addEventListener('click', function (e) { if (e.target === back) close(); });

    let THREE, renderer, scene, camera, root, raf = 0, meshes = [], wire = false;
    let selected = null; // آخر مesh مُختار
    const elementInfo = {}; // expressID -> {name, globalId, category}
    let mappings = {}; // expressID -> سجل الربط الحالي (من ctx.S.bimMappings)

    // مدار يدوي (بلا اعتماد إضافي)
    const cam = { theta: Math.PI * 0.25, phi: Math.PI * 0.32, dist: 20, target: null };

    function boqOptions() {
      if (!ctx) return [];
      return (ctx.S.boqItems || []).slice().sort(function (a, b) { return (a.code || '').localeCompare(b.code || ''); });
    }

    function refreshMappings() {
      mappings = {};
      if (!ctx || !modelId) return;
      (ctx.S.bimMappings || []).forEach(function (m) {
        if (m.bimModelId === modelId) mappings[m.elementExpressId] = m;
      });
    }

    function boqOf(mapping) {
      if (!mapping || !ctx) return null;
      return (ctx.S.boqItems || []).find(function (b) { return b.id === mapping.boqItemId; }) || null;
    }

    /** يعيد تلوين كل عناصر النموذج حسب حالة الربط والاعتماد الحالية (يُستدعى بعد كل تغيير) */
    function recolorAll() {
      if (!ctx || !modelId) return;
      refreshMappings();
      meshes.forEach(function (mesh) {
        const id = mesh.userData.expressID;
        const mapping = mappings[id];
        if (!mapping) {
          // غير مربوط بعد: نُبقي اللون الأصلي لكن نُخفّف الشفافية (تحذير بصري بلا فقدان شكل النموذج)
          mesh.material.color.copy(mesh.userData.baseColor);
          mesh.material.opacity = Math.min(mesh.userData.baseOpacity, 0.35);
          mesh.material.transparent = true;
          return;
        }
        const st = statusOf(boqOf(mapping));
        mesh.material.color.setHex(st.color);
        mesh.material.opacity = 1;
        mesh.material.transparent = false;
      });
    }

    function renderLegend() {
      if (!legendEl) return;
      const linked = Object.keys(mappings).length;
      legendEl.innerHTML =
        '<b class="small">' + I18n.t('دلالة الألوان') + '</b>' +
        '<div class="small muted" style="margin-top:8px;display:flex;flex-direction:column;gap:6px">' +
        '<span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#30a46c;margin-inline-end:6px"></i>' + I18n.t('معتمد بالكامل') + '</span>' +
        '<span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#f5a524;margin-inline-end:6px"></i>' + I18n.t('إنجاز جزئي') + '</span>' +
        '<span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#3a4258;margin-inline-end:6px"></i>' + I18n.t('لم يبدأ') + '</span>' +
        '<span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#8b95a8;opacity:.4;margin-inline-end:6px"></i>' + I18n.t('غير مربوط') + '</span>' +
        '</div><div class="small muted mt" style="border-top:1px solid var(--border);padding-top:8px">' +
        '<b class="num">' + linked + '</b> ' + I18n.t('عناصر مربوطة') + '</div>';
    }

    function renderPanel() {
      if (!panelEl) return;
      if (!selected) {
        panelEl.innerHTML = '<div class="small muted">' + I18n.t('انقر أي عنصر في النموذج لعرض تفاصيله أو ربطه ببند كميات.') + '</div>';
        return;
      }
      const id = selected.userData.expressID;
      const info2 = elementInfo[id] || {};
      const mapping = mappings[id];
      const bq = boqOf(mapping);
      const st = statusOf(bq);

      let html = '<b class="small">🔩 ' + esc(info2.name || I18n.t('عنصر بلا اسم')) + '</b>' +
        '<div class="small muted" style="margin:6px 0">' + esc(info2.category || '') + '</div>' +
        '<div class="small" style="font-family:monospace;font-size:10.5px;color:var(--muted);word-break:break-all">' + esc(info2.globalId || '') + '</div>';

      if (bq) {
        html += '<div class="mt" style="border-top:1px solid var(--border);padding-top:10px">' +
          '<div class="small"><b>' + I18n.t('بند الكميات المربوط') + ':</b> ' + esc(bq.code || bq.id) + ' — ' + esc(bq.description || '') + '</div>' +
          '<div class="flex" style="justify-content:space-between;margin-top:8px"><span class="small muted">' + I18n.t('الإنجاز المعتمد') + '</span><b class="num small">' + (bq.progress || 0) + '%</b></div>' +
          '<div class="bar" style="margin-top:4px"><i style="width:' + (bq.progress || 0) + '%;background:' + (st.key === 'ok' ? '#30a46c' : st.key === 'warn' ? '#f5a524' : '#3a4258') + '"></i></div>' +
          '<div class="flex" style="justify-content:space-between;margin-top:8px"><span class="small muted">' + I18n.t('القيمة المعتمدة') + '</span><b class="num small">' + Math.round((bq.qty || 0) * (bq.unitPrice || 0) * (bq.progress || 0) / 100).toLocaleString('en-US') + ' ' + I18n.t('ر.س') + '</b></div>' +
          '</div>';
      } else {
        html += '<div class="mt small muted" style="border-top:1px solid var(--border);padding-top:10px">' + I18n.t('غير مربوط بعد') + '</div>';
      }

      if (canMap) {
        html += '<div class="mt" style="border-top:1px solid var(--border);padding-top:10px">' +
          '<label class="fl">' + (bq ? I18n.t('تغيير الربط') : I18n.t('اربط ببند كميات')) + '</label>' +
          '<select class="inp" id="bv-boqsel"><option value="">' + I18n.t('اختر بند كميات...') + '</option>' +
          boqOptions().map(function (b) {
            return '<option value="' + b.id + '"' + (mapping && mapping.boqItemId === b.id ? ' selected' : '') + '>' + esc(b.code || b.id) + ' — ' + esc(b.description || '') + '</option>';
          }).join('') + '</select>' +
          '<label class="fl">' + I18n.t('نسبة التخصيص لهذا العنصر') + '</label>' +
          '<input class="inp num" id="bv-pct" type="number" min="1" max="100" value="' + (mapping ? mapping.allocationPct : 100) + '">' +
          '<div class="m-actions">' +
          '<button class="btn sm" id="bv-savelink">💾 ' + I18n.t('حفظ الربط') + '</button>' +
          (mapping && canDelete ? '<button class="btn danger sm" id="bv-unlink">' + I18n.t('إلغاء الربط') + '</button>' : '') +
          '</div></div>';
      }
      panelEl.innerHTML = html;

      const saveBtn = panelEl.querySelector('#bv-savelink');
      if (saveBtn) saveBtn.addEventListener('click', async function () {
        const boqItemId = panelEl.querySelector('#bv-boqsel').value;
        if (!boqItemId) { toast(I18n.t('اختر بند كميات...'), true); return; }
        const pct = Math.max(1, Math.min(100, Number(panelEl.querySelector('#bv-pct').value) || 100));
        try {
          if (mapping) {
            await Api.update('bimMappings', mapping.id, { boqItemId: boqItemId, allocationPct: pct });
          } else {
            await Api.create('bimMappings', {
              bimModelId: modelId, elementExpressId: id, projectId: ctx.projectId,
              elementName: info2.name || '', elementCategory: info2.category || '', globalId: info2.globalId || '',
              boqItemId: boqItemId, allocationPct: pct
            });
          }
          await ctx.refreshSilent();
          toast(I18n.t('تم الربط بنجاح'));
          recolorAll(); renderLegend(); renderPanel();
        } catch (e) { toast(e.message, true); }
      });
      const unlinkBtn = panelEl.querySelector('#bv-unlink');
      if (unlinkBtn) unlinkBtn.addEventListener('click', async function () {
        try {
          await Api.remove('bimMappings', mapping.id);
          await ctx.refreshSilent();
          toast(I18n.t('تم إلغاء الربط'));
          recolorAll(); renderLegend(); renderPanel();
        } catch (e) { toast(e.message, true); }
      });
    }

    try {
      THREE = await loadThree();
      const WebIFC = await loadWebIFC();
      const api = new WebIFC.IfcAPI();
      api.SetWasmPath('/vendor/bim/', true);
      await api.Init();

      const resp = await fetch(opts.url);
      if (!resp.ok) throw new Error('تعذّر جلب ملف النموذج');
      const buf = new Uint8Array(await resp.arrayBuffer());
      const modelIfcID = api.OpenModel(buf);

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0d1017);
      root = new THREE.Group();
      scene.add(root);

      const box = new THREE.Box3();
      let meshCount = 0, triCount = 0;
      const expressIDs = [];

      api.StreamAllMeshes(modelIfcID, function (placedMesh) {
        const geos = placedMesh.geometries;
        for (let i = 0; i < geos.size(); i++) {
          const pg = geos.get(i);
          const geo = api.GetGeometry(modelIfcID, pg.geometryExpressID);
          const verts = api.GetVertexArray(geo.GetVertexData(), geo.GetVertexDataSize());
          const idx = api.GetIndexArray(geo.GetIndexData(), geo.GetIndexDataSize());
          const nV = verts.length / 6;
          const pos = new Float32Array(nV * 3), nor = new Float32Array(nV * 3);
          for (let v = 0; v < nV; v++) {
            pos[v * 3] = verts[v * 6]; pos[v * 3 + 1] = verts[v * 6 + 1]; pos[v * 3 + 2] = verts[v * 6 + 2];
            nor[v * 3] = verts[v * 6 + 3]; nor[v * 3 + 1] = verts[v * 6 + 4]; nor[v * 3 + 2] = verts[v * 6 + 5];
          }
          const bg = new THREE.BufferGeometry();
          bg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
          bg.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
          bg.setIndex(new THREE.BufferAttribute(new Uint32Array(idx), 1));
          const c = pg.color;
          const mat = new THREE.MeshLambertMaterial({
            color: new THREE.Color(c.x, c.y, c.z),
            transparent: c.w < 1, opacity: c.w, side: THREE.DoubleSide
          });
          const mesh = new THREE.Mesh(bg, mat);
          const m = pg.flatTransformation;
          mesh.matrixAutoUpdate = false;
          mesh.matrix.set(m[0], m[4], m[8], m[12], m[1], m[5], m[9], m[13], m[2], m[6], m[10], m[14], m[3], m[7], m[11], m[15]);
          mesh.userData.expressID = placedMesh.expressID;
          mesh.userData.baseColor = mat.color.clone();
          mesh.userData.baseOpacity = c.w;
          root.add(mesh);
          meshes.push(mesh);
          bg.computeBoundingBox();
          const bb = bg.boundingBox.clone().applyMatrix4(mesh.matrix);
          box.union(bb);
          meshCount++;
          triCount += idx.length / 3;
          geo.delete && geo.delete();
        }
        if (showPanel && expressIDs.indexOf(placedMesh.expressID) === -1) expressIDs.push(placedMesh.expressID);
      });

      // نقرأ خصائص كل عنصر (الاسم، GUID، التصنيف) قبل إغلاق النموذج — تُستخدم في لوحة التفاصيل
      if (showPanel && api.properties && api.properties.getItemProperties) {
        for (let i = 0; i < expressIDs.length; i++) {
          const eid = expressIDs[i];
          try {
            const props = await api.properties.getItemProperties(modelIfcID, eid, false);
            elementInfo[eid] = {
              name: (props.Name && props.Name.value) || '',
              globalId: (props.GlobalId && props.GlobalId.value) || '',
              category: (props.PredefinedType && props.PredefinedType.value) || ''
            };
          } catch (e) { /* عنصر لا يدعم قراءة الخصائص — نتجاهله بأمان */ }
        }
      }
      api.CloseModel(modelIfcID);

      scene.add(new THREE.AmbientLight(0xffffff, 0.65));
      const d1 = new THREE.DirectionalLight(0xffffff, 0.8); d1.position.set(1, 2, 1.5); scene.add(d1);
      const d2 = new THREE.DirectionalLight(0xafc4ff, 0.35); d2.position.set(-1, -0.5, -1); scene.add(d2);

      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      cam.target = center;
      cam.dist = Math.max(size.x, size.y, size.z, 1) * 2.2;
      camera = new THREE.PerspectiveCamera(50, stage.clientWidth / stage.clientHeight, 0.05, cam.dist * 50);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(stage.clientWidth, stage.clientHeight);
      stage.appendChild(renderer.domElement);
      const loading = back.querySelector('#bv-loading'); if (loading) loading.remove();

      info.innerHTML = '✅ ' + I18n.t('نموذج IFC حقيقي') + ' — <b class="num">' + meshCount + '</b> ' + I18n.t('عنصر') + ' · <b class="num">' + Math.round(triCount).toLocaleString('en-US') + '</b> ' + I18n.t('مثلث');
      window.BimViewer._last = { meshCount: meshCount, triCount: triCount };

      if (showPanel) { recolorAll(); renderLegend(); renderPanel(); }

      function applyCam() {
        const t = cam.target;
        camera.position.set(
          t.x + cam.dist * Math.sin(cam.phi) * Math.cos(cam.theta),
          t.y + cam.dist * Math.cos(cam.phi),
          t.z + cam.dist * Math.sin(cam.phi) * Math.sin(cam.theta)
        );
        camera.lookAt(t);
      }
      applyCam();

      function loop() { raf = requestAnimationFrame(loop); renderer.render(scene, camera); }
      loop();

      function onResize() {
        if (!stage.clientWidth) return;
        camera.aspect = stage.clientWidth / stage.clientHeight; camera.updateProjectionMatrix();
        renderer.setSize(stage.clientWidth, stage.clientHeight);
      }
      window.addEventListener('resize', onResize);

      // تحكم بالماوس + تمييز نقرة عادية (اختيار) عن سحب (تدوير/تحريك)
      let drag = null, downPt = null;
      renderer.domElement.addEventListener('pointerdown', function (e) {
        drag = { x: e.clientX, y: e.clientY, btn: e.button };
        downPt = { x: e.clientX, y: e.clientY, t: Date.now() };
        renderer.domElement.setPointerCapture(e.pointerId);
      });
      renderer.domElement.addEventListener('pointermove', function (e) {
        if (!drag) return;
        const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
        if (drag.btn === 2 || e.shiftKey) {
          const panScale = cam.dist * 0.0015;
          const right = new THREE.Vector3().subVectors(camera.position, cam.target).cross(camera.up).normalize();
          const up = camera.up.clone();
          cam.target.addScaledVector(right, -dx * panScale).addScaledVector(up, dy * panScale);
        } else {
          cam.theta -= dx * 0.008;
          cam.phi = Math.max(0.05, Math.min(Math.PI - 0.05, cam.phi - dy * 0.008));
        }
        applyCam();
      });
      renderer.domElement.addEventListener('pointerup', function (e) {
        drag = null;
        if (showPanel && downPt && Math.abs(e.clientX - downPt.x) < 5 && Math.abs(e.clientY - downPt.y) < 5 && Date.now() - downPt.t < 500 && (e.button === 0)) {
          pick(e);
        }
        downPt = null;
      });
      renderer.domElement.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      renderer.domElement.addEventListener('wheel', function (e) {
        e.preventDefault();
        cam.dist = Math.max(0.5, cam.dist * (e.deltaY > 0 ? 1.12 : 0.89));
        applyCam();
      }, { passive: false });

      const raycaster = new THREE.Raycaster();
      const ndc = new THREE.Vector2();
      function pick(e) {
        const rect = renderer.domElement.getBoundingClientRect();
        ndc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        ndc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(ndc, camera);
        const hits = raycaster.intersectObjects(meshes, false);
        if (selected) selected.material.emissive && selected.material.emissive.setHex(0x000000);
        if (!hits.length) { selected = null; renderPanel(); return; }
        selected = hits[0].object;
        if (!selected.material.emissive) selected.material.emissive = new THREE.Color(0x000000);
        selected.material.emissive.setHex(0x3a2a10);
        renderPanel();
      }

      back.querySelector('#bv-fit').addEventListener('click', function () {
        cam.target = center.clone(); cam.dist = Math.max(size.x, size.y, size.z, 1) * 2.2;
        cam.theta = Math.PI * 0.25; cam.phi = Math.PI * 0.32; applyCam();
      });
      back.querySelector('#bv-wire').addEventListener('click', function () {
        wire = !wire; meshes.forEach(function (mesh) { mesh.material.wireframe = wire; });
      });
    } catch (e) {
      const loading = back.querySelector('#bv-loading');
      if (loading) loading.innerHTML = '<div style="font-size:34px">⚠️</div><div class="small" style="color:var(--warn)">' + esc(e.message) + '</div>';
      info.textContent = 'تعذّر عرض النموذج';
      toast(e.message, true);
    }
  }

  window.BimViewer = { open: open, _last: null };
})();


/* ===== public/js/dxf-viewer.js ===== */
/*
 * dxf-viewer.js — عارض DXF حقيقي داخل المتصفح (بلا اعتماديات خارجية)
 *
 * يقرأ ملفات AutoCAD DXF (ASCII) ويرسم خطوطاً متجهية قابلة للقياس على Canvas.
 * يدعم الكيانات: LINE, LWPOLYLINE, POLYLINE, CIRCLE, ARC, TEXT, MTEXT, POINT.
 * ميزات: احتواء تلقائي (Fit)، تكبير/تصغير بالعجلة، تحريك بالسحب،
 *        أداة قياس نقطتين تعرض المسافة بوحدات الرسم الحقيقية،
 *        عرض/إخفاء الطبقات، مؤشر إحداثيات حيّ.
 *
 * الواجهة العامة:  window.DxfViewer.open({ title, url })
 *                  window.DxfViewer.parse(text) -> { entities, layers, bounds }
 */
(function () {
  'use strict';

  /* ------------------------------------------------------------------ *
   *  1) المحلّل (Parser): يحوّل نص DXF إلى قائمة كيانات هندسية
   * ------------------------------------------------------------------ */

  // يقسّم DXF إلى أزواج [code, value] — كل زوج سطران (رمز المجموعة ثم القيمة).
  function tokenize(text) {
    // نطبّع أسطر الويندوز/ماك ونتجاهل الفراغات الطرفية.
    var lines = text.split(/\r\n|\r|\n/);
    var pairs = [];
    for (var i = 0; i + 1 < lines.length; i += 2) {
      var code = parseInt(lines[i].trim(), 10);
      if (isNaN(code)) { i -= 1; continue; } // سطر تالف: انزلق سطراً واحداً
      pairs.push([code, lines[i + 1]]);
    }
    return pairs;
  }

  function num(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }

  // يمشي على قسم ENTITIES ويبني كائنات كيانات.
  function parse(text) {
    var pairs = tokenize(text);
    var entities = [];
    var layers = {};
    var i = 0;

    // تخطَّ حتى بداية قسم ENTITIES (إن وُجد؛ وإلا حلّل الكل).
    var start = 0, hasEntitiesSection = false;
    for (var k = 0; k < pairs.length - 1; k++) {
      if (pairs[k][0] === 0 && pairs[k][1].trim() === 'SECTION' &&
          pairs[k + 1][0] === 2 && pairs[k + 1][1].trim() === 'ENTITIES') {
        start = k + 2; hasEntitiesSection = true; break;
      }
    }
    i = hasEntitiesSection ? start : 0;

    function registerLayer(name) {
      if (!(name in layers)) layers[name] = { name: name, visible: true, count: 0 };
      layers[name].count++;
    }

    while (i < pairs.length) {
      var code = pairs[i][0];
      var val = pairs[i][1] != null ? pairs[i][1].trim() : '';

      if (code === 0 && (val === 'ENDSEC' || val === 'EOF')) break;

      if (code !== 0) { i++; continue; }

      var type = val;
      i++;
      // اجمع أزواج هذا الكيان حتى الكيان التالي (code 0).
      var ent = { type: type, layer: '0' };
      var lwVerts = [];       // رؤوس LWPOLYLINE
      var plVerts = [];       // رؤوس POLYLINE (عبر VERTEX)
      var pendingVertex = null;

      // معالج خاص لـ POLYLINE القديمة: تتبعها كيانات VERTEX ثم SEQEND.
      if (type === 'POLYLINE') {
        // اقرأ خصائص POLYLINE نفسها
        while (i < pairs.length && pairs[i][0] !== 0) {
          var c = pairs[i][0], v = pairs[i][1].trim();
          if (c === 8) ent.layer = v;
          if (c === 70) ent.flags = num(v);
          i++;
        }
        // اقرأ كيانات VERTEX
        while (i < pairs.length && pairs[i][0] === 0 && pairs[i][1].trim() === 'VERTEX') {
          i++;
          var vx = { x: 0, y: 0 };
          while (i < pairs.length && pairs[i][0] !== 0) {
            var vc = pairs[i][0], vv = pairs[i][1].trim();
            if (vc === 10) vx.x = num(vv);
            else if (vc === 20) vx.y = num(vv);
            i++;
          }
          plVerts.push(vx);
        }
        // تخطَّ SEQEND
        if (i < pairs.length && pairs[i][0] === 0 && pairs[i][1].trim() === 'SEQEND') {
          i++;
          while (i < pairs.length && pairs[i][0] !== 0) i++;
        }
        ent.vertices = plVerts;
        ent.closed = !!(ent.flags & 1);
        registerLayer(ent.layer);
        if (plVerts.length >= 2) entities.push(ent);
        continue;
      }

      // بقية الكيانات: اقرأ الأزواج حتى الكيان التالي.
      while (i < pairs.length && pairs[i][0] !== 0) {
        var gc = pairs[i][0];
        var gv = pairs[i][1] != null ? pairs[i][1].trim() : '';
        switch (gc) {
          case 8: ent.layer = gv; break;
          case 10:
            if (type === 'LWPOLYLINE') { lwVerts.push({ x: num(gv), y: 0 }); }
            else ent.x = num(gv);
            break;
          case 20:
            if (type === 'LWPOLYLINE') { if (lwVerts.length) lwVerts[lwVerts.length - 1].y = num(gv); }
            else ent.y = num(gv);
            break;
          case 11: ent.x2 = num(gv); break;
          case 21: ent.y2 = num(gv); break;
          case 40: ent.r = num(gv); ent.h = num(gv); break; // نصف قطر / ارتفاع نص
          case 50: ent.a0 = num(gv); break;                  // زاوية بداية القوس
          case 51: ent.a1 = num(gv); break;                  // زاوية نهاية القوس
          case 70: ent.flags = num(gv); break;
          case 1: ent.text = gv; break;
          default: break;
        }
        i++;
      }

      if (type === 'LWPOLYLINE') {
        ent.vertices = lwVerts;
        ent.closed = !!(ent.flags & 1);
      }
      registerLayer(ent.layer);
      entities.push(ent);
    }

    var bounds = computeBounds(entities);
    return { entities: entities, layers: layers, bounds: bounds };
  }

  // يحسب المستطيل المحيط بكل الكيانات لأجل الاحتواء التلقائي.
  function computeBounds(entities) {
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    function ext(x, y) {
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
    }
    entities.forEach(function (e) {
      switch (e.type) {
        case 'LINE': ext(e.x, e.y); ext(e.x2, e.y2); break;
        case 'LWPOLYLINE':
        case 'POLYLINE':
          (e.vertices || []).forEach(function (v) { ext(v.x, v.y); }); break;
        case 'CIRCLE': ext(e.x - e.r, e.y - e.r); ext(e.x + e.r, e.y + e.r); break;
        case 'ARC': ext(e.x - e.r, e.y - e.r); ext(e.x + e.r, e.y + e.r); break;
        case 'TEXT':
        case 'MTEXT':
        case 'POINT': ext(e.x, e.y); break;
      }
    });
    if (!isFinite(minX)) { minX = 0; minY = 0; maxX = 100; maxY = 100; }
    return { minX: minX, minY: minY, maxX: maxX, maxY: maxY,
             w: maxX - minX, h: maxY - minY };
  }

  /* ------------------------------------------------------------------ *
   *  2) العارض (Renderer): Canvas 2D مع تحويل عالم→شاشة
   * ------------------------------------------------------------------ */

  var LAYER_COLORS = {
    WALLS: '#e8eaed', COLUMNS: '#ffb74d', DOORS: '#4fc3f7',
    DIM: '#9ccc65', TEXT: '#ce93d8', TITLE: '#fff176', '0': '#cfd8dc'
  };
  function layerColor(name) { return LAYER_COLORS[name] || '#90caf9'; }

  function DxfView(canvas, model) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.model = model;
    this.scale = 1;
    this.tx = 0; this.ty = 0;       // إزاحة (بكسل)
    this.measure = { active: false, p1: null, p2: null };
    this.mouseWorld = { x: 0, y: 0 };
    this._bindEvents();
    this.fit();
  }

  DxfView.prototype.worldToScreen = function (x, y) {
    // نقلب Y لأن إحداثيات CAD تصعد للأعلى بينما الشاشة تنزل.
    return { x: x * this.scale + this.tx,
             y: this.canvas.height - (y * this.scale + this.ty) };
  };
  DxfView.prototype.screenToWorld = function (sx, sy) {
    return { x: (sx - this.tx) / this.scale,
             y: (this.canvas.height - sy - this.ty) / this.scale };
  };

  DxfView.prototype.fit = function () {
    var b = this.model.bounds;
    var pad = 40;
    var cw = this.canvas.width - pad * 2, ch = this.canvas.height - pad * 2;
    var sx = b.w > 0 ? cw / b.w : 1, sy = b.h > 0 ? ch / b.h : 1;
    this.scale = Math.min(sx, sy) || 1;
    // مركّز الرسم داخل الكانفس.
    this.tx = pad + (cw - b.w * this.scale) / 2 - b.minX * this.scale;
    this.ty = pad + (ch - b.h * this.scale) / 2 - b.minY * this.scale;
    this.draw();
  };

  DxfView.prototype.zoomAt = function (sx, sy, factor) {
    var before = this.screenToWorld(sx, sy);
    this.scale *= factor;
    // ثبّت النقطة تحت المؤشر أثناء التكبير.
    this.tx = sx - before.x * this.scale;
    this.ty = (this.canvas.height - sy) - before.y * this.scale;
    this.draw();
  };

  DxfView.prototype.draw = function () {
    var ctx = this.ctx, W = this.canvas.width, H = this.canvas.height;
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#0f1720';
    ctx.fillRect(0, 0, W, H);
    this._drawGrid();

    var self = this;
    this.model.entities.forEach(function (e) {
      var lay = self.model.layers[e.layer];
      if (lay && !lay.visible) return;
      ctx.strokeStyle = layerColor(e.layer);
      ctx.fillStyle = layerColor(e.layer);
      ctx.lineWidth = 1.25;
      self._drawEntity(e);
    });

    this._drawMeasure();
    this._drawScaleBar();
    ctx.restore();
  };

  DxfView.prototype._drawEntity = function (e) {
    var ctx = this.ctx, self = this;
    function P(x, y) { return self.worldToScreen(x, y); }
    switch (e.type) {
      case 'LINE': {
        var a = P(e.x, e.y), b = P(e.x2, e.y2);
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        break;
      }
      case 'LWPOLYLINE':
      case 'POLYLINE': {
        var vs = e.vertices || []; if (vs.length < 2) break;
        ctx.beginPath();
        var s0 = P(vs[0].x, vs[0].y); ctx.moveTo(s0.x, s0.y);
        for (var j = 1; j < vs.length; j++) { var s = P(vs[j].x, vs[j].y); ctx.lineTo(s.x, s.y); }
        if (e.closed) ctx.closePath();
        ctx.stroke();
        break;
      }
      case 'CIRCLE': {
        var c = P(e.x, e.y);
        ctx.beginPath(); ctx.arc(c.x, c.y, Math.max(0.5, e.r * this.scale), 0, Math.PI * 2); ctx.stroke();
        break;
      }
      case 'ARC': {
        var cc = P(e.x, e.y);
        // Canvas: الزوايا باتجاه عقارب الساعة مع محور Y نازل؛ لذا نعكس ونستخدم counter-clockwise.
        var a0 = -(e.a0 * Math.PI / 180), a1 = -(e.a1 * Math.PI / 180);
        ctx.beginPath();
        ctx.arc(cc.x, cc.y, Math.max(0.5, e.r * this.scale), a0, a1, true);
        ctx.stroke();
        break;
      }
      case 'TEXT':
      case 'MTEXT': {
        if (!e.text) break;
        var t = P(e.x, e.y);
        var px = Math.max(9, (e.h || 0.3) * this.scale);
        ctx.save();
        ctx.font = px + 'px system-ui, sans-serif';
        ctx.textBaseline = 'bottom';
        ctx.fillText(e.text, t.x, t.y);
        ctx.restore();
        break;
      }
      case 'POINT': {
        var pp = P(e.x, e.y);
        ctx.beginPath(); ctx.arc(pp.x, pp.y, 2, 0, Math.PI * 2); ctx.fill();
        break;
      }
    }
  };

  DxfView.prototype._drawGrid = function () {
    var ctx = this.ctx, W = this.canvas.width, H = this.canvas.height;
    // شبكة بوحدة رسم واحدة، تُخفى إن صغُرت جداً.
    var step = this.scale;
    if (step < 8) return;
    // اختر خطوة عالمية 1/5/10 حسب الكثافة.
    var unit = 1;
    while (unit * this.scale < 30) unit *= (unit === 1 ? 5 : 2);
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    var b = this.model.bounds;
    var startX = Math.floor(b.minX / unit) * unit;
    var endX = Math.ceil(b.maxX / unit) * unit;
    var startY = Math.floor(b.minY / unit) * unit;
    var endY = Math.ceil(b.maxY / unit) * unit;
    for (var gx = startX; gx <= endX; gx += unit) {
      var a = this.worldToScreen(gx, startY), c = this.worldToScreen(gx, endY);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(c.x, c.y); ctx.stroke();
    }
    for (var gy = startY; gy <= endY; gy += unit) {
      var d = this.worldToScreen(startX, gy), f = this.worldToScreen(endX, gy);
      ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(f.x, f.y); ctx.stroke();
    }
    ctx.restore();
  };

  DxfView.prototype._drawMeasure = function () {
    var m = this.measure; if (!m.p1) return;
    var ctx = this.ctx;
    var a = this.worldToScreen(m.p1.x, m.p1.y);
    var end = m.p2 || this.mouseWorld;
    var b = this.worldToScreen(end.x, end.y);
    ctx.save();
    ctx.strokeStyle = '#ff5252'; ctx.fillStyle = '#ff5252'; ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.setLineDash([]);
    [a, b].forEach(function (p) { ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill(); });
    var dx = end.x - m.p1.x, dy = end.y - m.p1.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var label = dist.toFixed(2) + ' وحدة';
    var mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    ctx.font = '13px system-ui, sans-serif';
    var tw = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(mid.x - tw / 2 - 6, mid.y - 22, tw + 12, 20);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, mid.x, mid.y - 12);
    ctx.textAlign = 'start';
    ctx.restore();
  };

  DxfView.prototype._drawScaleBar = function () {
    var ctx = this.ctx, H = this.canvas.height;
    // اختر طول قضيب مرجعي مرتباً (1,2,5,10...).
    var target = 120; // بكسل
    var unit = 1;
    while (unit * this.scale < target) unit *= (unit === 1 ? 5 : 2);
    while (unit * this.scale > target * 2) unit /= 2;
    var px = unit * this.scale;
    var x0 = 16, y0 = H - 20;
    ctx.save();
    ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x0, y0 - 5); ctx.lineTo(x0, y0); ctx.lineTo(x0 + px, y0); ctx.lineTo(x0 + px, y0 - 5);
    ctx.stroke();
    ctx.font = '12px system-ui, sans-serif';
    ctx.fillText(unit + ' وحدة', x0, y0 - 8);
    ctx.restore();
  };

  DxfView.prototype._bindEvents = function () {
    var self = this, canvas = this.canvas;
    var dragging = false, last = null;

    canvas.addEventListener('wheel', function (ev) {
      ev.preventDefault();
      var rect = canvas.getBoundingClientRect();
      var sx = ev.clientX - rect.left, sy = ev.clientY - rect.top;
      self.zoomAt(sx, sy, ev.deltaY < 0 ? 1.1 : 1 / 1.1);
    }, { passive: false });

    canvas.addEventListener('mousedown', function (ev) {
      var rect = canvas.getBoundingClientRect();
      var sx = ev.clientX - rect.left, sy = ev.clientY - rect.top;
      if (self.measure.active) {
        var w = self.screenToWorld(sx, sy);
        if (!self.measure.p1 || self.measure.p2) {
          self.measure.p1 = w; self.measure.p2 = null;
        } else {
          self.measure.p2 = w;
        }
        self.draw();
        return;
      }
      dragging = true; last = { x: sx, y: sy };
    });

    window.addEventListener('mousemove', function (ev) {
      var rect = canvas.getBoundingClientRect();
      var sx = ev.clientX - rect.left, sy = ev.clientY - rect.top;
      self.mouseWorld = self.screenToWorld(sx, sy);
      if (self._coordCb) self._coordCb(self.mouseWorld);
      if (self.measure.active && self.measure.p1 && !self.measure.p2) { self.draw(); }
      if (!dragging) return;
      self.tx += sx - last.x;
      self.ty -= sy - last.y; // Y مقلوب
      last = { x: sx, y: sy };
      self.draw();
    });

    window.addEventListener('mouseup', function () { dragging = false; });
  };

  DxfView.prototype.toggleMeasure = function () {
    this.measure.active = !this.measure.active;
    if (!this.measure.active) { this.measure.p1 = this.measure.p2 = null; }
    this.draw();
    return this.measure.active;
  };

  /* ------------------------------------------------------------------ *
   *  3) الواجهة العامة + نافذة العرض (modal)
   * ------------------------------------------------------------------ */

  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'style') e.setAttribute('style', attrs[k]);
      else if (k.slice(0, 2) === 'on') e[k] = attrs[k];
      else e.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }

  function openModal(opts) {
    opts = opts || {};
    var title = opts.title || 'عارض DXF';

    var overlay = el('div', { style:
      'position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:9999;display:flex;' +
      'align-items:center;justify-content:center;' });

    var box = el('div', { style:
      'width:min(96vw,1200px);height:min(92vh,820px);background:#111a24;border-radius:12px;' +
      'display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);' });

    // شريط علوي
    var bar = el('div', { style:
      'display:flex;align-items:center;gap:8px;padding:10px 14px;background:#0c141c;' +
      'border-bottom:1px solid #1e2a36;color:#e8eaed;font:600 14px system-ui,sans-serif;' });
    var btnFit = el('button', { style: btnStyle(), title: 'احتواء' }, ['⤢ احتواء']);
    var btnMeasure = el('button', { style: btnStyle(), title: 'قياس مسافة' }, ['📐 قياس']);
    var coord = el('span', { style: 'margin-inline-start:auto;color:#90a4ae;font-weight:400;font-size:12px;' }, ['—']);
    var btnClose = el('button', { style: btnStyle('#b71c1c'), title: 'إغلاق' }, ['✕']);
    bar.appendChild(el('span', { style: 'font-size:16px;' }, ['📐']));
    bar.appendChild(el('span', {}, [title]));
    bar.appendChild(btnFit); bar.appendChild(btnMeasure);
    bar.appendChild(coord); bar.appendChild(btnClose);

    // منطقة العرض: طبقات + كانفس
    var body = el('div', { style: 'flex:1;display:flex;min-height:0;' });
    var side = el('div', { style:
      'width:180px;background:#0c141c;border-inline-end:1px solid #1e2a36;padding:10px;' +
      'overflow:auto;color:#cfd8dc;font:12px system-ui,sans-serif;' });
    side.appendChild(el('div', { style: 'font-weight:700;margin-bottom:8px;color:#90a4ae;' }, ['الطبقات']));
    var layerList = el('div', {});
    side.appendChild(layerList);

    var stage = el('div', { style: 'flex:1;position:relative;min-width:0;background:#0f1720;' });
    var canvas = el('canvas', { style: 'position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;' });
    var status = el('div', { style:
      'position:absolute;left:0;right:0;bottom:0;padding:6px 10px;background:rgba(0,0,0,.4);' +
      'color:#b0bec5;font:12px system-ui,sans-serif;pointer-events:none;' }, ['جارٍ التحميل…']);
    stage.appendChild(canvas); stage.appendChild(status);
    body.appendChild(side); body.appendChild(stage);

    box.appendChild(bar); box.appendChild(body);
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    function close() { document.body.removeChild(overlay); window.removeEventListener('keydown', onKey); }
    function onKey(e) { if (e.key === 'Escape') close(); }
    window.addEventListener('keydown', onKey);
    btnClose.onclick = close;
    overlay.addEventListener('mousedown', function (e) { if (e.target === overlay) close(); });

    // اضبط دقة الكانفس على الحجم الفعلي.
    function sizeCanvas() {
      var r = stage.getBoundingClientRect();
      canvas.width = Math.max(300, Math.floor(r.width));
      canvas.height = Math.max(200, Math.floor(r.height));
    }

    var view = null;

    function boot(text) {
      var model;
      try { model = parse(text); }
      catch (err) { status.textContent = 'تعذّر تحليل ملف DXF: ' + err.message; return; }
      if (!model.entities.length) { status.textContent = 'لا توجد كيانات قابلة للرسم في هذا الملف.'; return; }
      sizeCanvas();
      view = new DxfView(canvas, model);
      window.DxfViewer._last = {
        entityCount: model.entities.length,
        layerCount: Object.keys(model.layers).length,
        bounds: model.bounds
      };

      // عدّاد الكيانات في الحالة
      status.textContent = 'الكيانات: ' + model.entities.length +
        ' • الطبقات: ' + Object.keys(model.layers).length +
        ' • الأبعاد: ' + model.bounds.w.toFixed(2) + ' × ' + model.bounds.h.toFixed(2) + ' وحدة';

      // مؤشر الإحداثيات الحي
      view._coordCb = function (w) { coord.textContent = 'X: ' + w.x.toFixed(2) + '  Y: ' + w.y.toFixed(2); };

      // قائمة الطبقات
      Object.keys(model.layers).forEach(function (name) {
        var lay = model.layers[name];
        var row = el('label', { style: 'display:flex;align-items:center;gap:6px;padding:3px 0;cursor:pointer;' });
        var cb = el('input', { type: 'checkbox' }); cb.checked = true;
        cb.onchange = function () { lay.visible = cb.checked; view.draw(); };
        var sw = el('span', { style: 'width:12px;height:12px;border-radius:2px;display:inline-block;background:' + layerColor(name) + ';' });
        row.appendChild(cb); row.appendChild(sw);
        row.appendChild(el('span', {}, [name + ' (' + lay.count + ')']));
        layerList.appendChild(row);
      });

      btnFit.onclick = function () { view.fit(); };
      btnMeasure.onclick = function () {
        var on = view.toggleMeasure();
        btnMeasure.style.background = on ? '#00695c' : '#1c2b3a';
        status.textContent = on ? 'وضع القياس: انقر نقطتين لقياس المسافة.'
                                : 'الكيانات: ' + model.entities.length + ' • الطبقات: ' + Object.keys(model.layers).length;
      };
    }

    window.addEventListener('resize', function () { if (view) { sizeCanvas(); view.fit(); } });

    // حمّل النص: إمّا opts.text مباشرة أو عبر fetch لـ opts.url
    if (opts.text) {
      setTimeout(function () { boot(opts.text); }, 0);
    } else if (opts.url) {
      fetch(opts.url).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      }).then(boot).catch(function (err) {
        status.textContent = 'تعذّر تحميل الملف: ' + err.message;
      });
    } else {
      status.textContent = 'لم يُحدَّد ملف DXF.';
    }

    return { close: close };
  }

  function btnStyle(bg) {
    return 'background:' + (bg || '#1c2b3a') + ';color:#e8eaed;border:1px solid #2a3b4c;' +
           'border-radius:6px;padding:6px 12px;font:600 13px system-ui,sans-serif;cursor:pointer;';
  }

  window.DxfViewer = {
    open: openModal,
    parse: parse,
    _last: null,
    _DxfView: DxfView
  };
})();

  // ============ أدوات مشتركة ============
  /* قاموس الحالات الموحّد (§7-3): [النص، صنف اللون، الأيقونة].
     قاعدة إلزامية: لا نعتمد على اللون وحده — كل حالة تحمل أيقونة بجانب لونها،
     فيبقى المعنى واضحاً لمن لا يميّز الأحمر عن الأخضر (~1 من 12) وعند الطباعة أبيض/أسود. */
  const STATUS = {
    // دورة الاعتماد / المعاملات
    pending: ['قيد المراجعة', 'p-info', '●'],
    under_review: ['قيد المراجعة', 'p-info', '●'],

    answered: ['تم الرد', 'p-ok', '✓'],
    replied: ['تم الرد', 'p-ok', '✓'],
